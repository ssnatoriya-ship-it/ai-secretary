// 顧客保存失敗時、local_server.py側が返すpath/errorType/messageをそのまま表示する
// （customer-save-fix-report.mdの要件：対象パス・例外型・例外メッセージをブラウザへ返す）。
function formatCustomerSaveError(data) {
  const lines = [];
  if (data.path) lines.push(`パス: ${data.path}`);
  if (data.errorType) lines.push(`種別: ${data.errorType}`);
  lines.push(`詳細: ${data.message || '不明なエラーです'}`);
  return lines.join('\n');
}

async function saveNewCustomer(ntrId) {
  const name  = document.getElementById('cm-name')?.value.trim();
  const yomi  = document.getElementById('cm-yomi')?.value.trim();
  if (!name) { alert('氏名を入力してください'); return; }
  if (!yomi) { alert('よみを入力してください'); return; }
  const size  = document.getElementById('cm-size')?.value.trim();
  const width = document.getElementById('cm-width')?.value.trim();
  const girth = document.getElementById('cm-girth')?.value.trim();
  const diff  = document.getElementById('cm-diff')?.value.trim();
  const brand = document.getElementById('cm-brand')?.value.trim();
  const style = document.getElementById('cm-style')?.value.trim();
  const color = document.getElementById('cm-color')?.value.trim();
  const avoid = document.getElementById('cm-avoid')?.value.trim();
  const memo  = document.getElementById('cm-memo')?.value.trim();
  const today = new Date().toISOString().slice(0, 10);
  const content = `---\ndate: ${today}\ntags: [customer]\nai_secretary_id: ${ntrId}\nname: ${name}\nyomi: ${yomi}\n---\n\n# ${ntrId}\n\n## 顧客情報\n氏名: ${name}\nよみ: ${yomi}\n\n## サイズ情報\n足サイズ: ${size}\n足幅: ${width}\n足囲: ${girth}\n左右差: ${diff}\n\n## 好み・傾向\n好みブランド: ${brand}\n好みスタイル: ${style}\n好みカラー: ${color}\n避けるもの: ${avoid}\n\n## 接客メモ\n${memo}\n\n## 問い合わせ履歴\n<!-- 日付 | チャネル | 内容の要点 | 対応結果 -->\n`;
  try {
    const res = await localFetch('/api/customer-save', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id: ntrId, content }),
    });
    const data = await res.json();
    if (!data.ok) throw new Error(formatCustomerSaveError(data));
    closeModal();
    await initCustomerList();
    const input = document.getElementById('reply-name');
    const label = `${ntrId}　${name} 様`;
    if (input) { input.value = label; await onNameInput(label); }
  } catch(e) {
    alert('保存に失敗しました: ' + e.message);
  }
}

async function saveEditCustomer(editKey) {
  const content = document.getElementById('cm-content')?.value;
  if (!content) { alert('内容が空です'); return; }
  const isNtr = editKey.startsWith('id:');
  const fileKey = isNtr ? editKey.slice(3) : editKey.slice(5);
  const body = isNtr ? { id: fileKey, content } : { name: fileKey, content };
  try {
    const res = await localFetch('/api/customer-save', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const data = await res.json();
    if (!data.ok) throw new Error(formatCustomerSaveError(data));
    closeModal();
    await initCustomerList();
    const input = document.getElementById('reply-name');
    if (input?.value) await onNameInput(input.value);
  } catch(e) {
    alert('保存に失敗しました: ' + e.message);
  }
}

// 顧客返信履歴：AI秘書IDごとの履歴を新しい順で表示する専用モーダル（読み取り専用）。
// 編集モーダル（showCustomerModal）とは別ボタン・別画面にすることで、
// プロフィール編集と履歴閲覧の操作を混在させない（customer-reply-history-implementation-plan.md参照）。
async function showCustomerReplyHistory(aiSecretaryId) {
  const items = await ReplyHistoryStore.listByCustomer(aiSecretaryId);
  const rows = items.map(r => `
    <div class="card" style="padding:12px 16px;margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:13px;color:var(--text-muted)">
        <span>${esc(r.channel || '─')}</span>
        <span>${esc(formatDate(r.createdAt))}</span>
      </div>
      <div style="white-space:pre-wrap;font-size:14px">${esc(r.content)}</div>
    </div>
  `).join('');

  showModal(`
    <h3>返信履歴：${esc(aiSecretaryId)}</h3>
    ${items.length ? rows : '<p class="idea-plan-note">この顧客の返信履歴はまだありません。</p>'}
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">閉じる</button>
    </div>
  `);
}

// ── 回答案コピー・保存 ──────────────────────

async function copyReply() {
  const text = document.getElementById('reply-result').value.trim();
  if (!text) return;
  try {
    await navigator.clipboard.writeText(text);
    const btn = document.getElementById('copy-reply-btn');
    btn.textContent = '&#10003; コピー済み';
    setTimeout(() => { btn.innerHTML = '&#128203; コピー'; }, 2000);
  } catch(e) {
    alert('コピーに失敗しました。手動でテキストを選択してコピーしてください。');
  }
}

async function saveReply() {
  const text = document.getElementById('reply-result').value.trim();
  if (!text) { alert('保存する返信文がありません。'); return; }
  const name = document.getElementById('reply-name').value.trim() || 'お客様';
  const channel = document.querySelector('input[name="reply-channel"]:checked')?.value || 'メール';
  const btn = document.getElementById('save-reply-btn');
  btn.disabled = true;
  btn.textContent = '保存中...';
  try {
    // 顧客返信履歴はメモではなくcustomer_repliesへ保存する（customer-reply-history-implementation-plan.md参照）。
    // 顧客が特定できていない場合もai_secretary_idを空文字のまま保存し、内容自体は失わない。
    const saved = await ReplyHistoryStore.add({
      aiSecretaryId: App.selectedCustomer?.id || '',
      customerName: name,
      channel,
      content: text,
    });
    if (!saved) throw new Error('保存に失敗しました');
    btn.innerHTML = '&#10003; 保存済み';
    setTimeout(() => { btn.innerHTML = '&#128190; 保存'; btn.disabled = false; }, 2000);
    // 返信保存後、「過去のやり取り」をページ移動せず再取得して即時反映する
    // （customer-reply-inline-history-report.md参照）。
    loadCustomerInlineHistory(getCurrentReplyCustomerIdentity());
  } catch(e) {
    alert('保存に失敗しました: ' + e.message);
    btn.innerHTML = '&#128190; 保存';
    btn.disabled = false;
  }
}

// 顧客対応案件の保存（customer_correspondences）。AI返信文を生成しただけでは保存完了と
// しない：このボタンを押したときだけ、customer_correspondencesへ確定保存する
// （customer-correspondence-management-phase1-report.md参照）。
// 既存のsaveReply()（customer_repliesへの返信ログ保存）とは別経路・別テーブルで、
// 互いに影響しない。
async function saveCorrespondence() {
  const btn = document.getElementById('corr-save-btn');
  const resultArea = document.getElementById('corr-save-result');
  if (btn.disabled) return; // 二重クリック対策（saveEditorialArticle()と同じパターン）
  const getVal = (id) => (document.getElementById(id)?.value || '').trim();

  const customerName = getVal('reply-name');
  if (!customerName) {
    resultArea.innerHTML = '<p class="idea-plan-note" style="color:var(--danger)">顧客名（宛名）を入力してください。</p>';
    return;
  }

  const status = getVal('corr-status') || 'unhandled';
  const nextActionDate = getVal('corr-next-action-date');
  const targetPeriod = getVal('corr-target-period');
  const monitoringNote = getVal('corr-monitoring-note');

  // 監視中は、次回対応日の入力を必須にする（忘れ防止が最優先目標のため）。
  if (status === 'monitoring' && !nextActionDate) {
    resultArea.innerHTML = '<p class="idea-plan-note" style="color:var(--danger)">監視案件には、忘れ防止のため次回対応日を設定してください。</p>';
    return;
  }
  // 監視中は、予定時期または監視メモのどちらかを必須にする。
  if (status === 'monitoring' && !targetPeriod && !monitoringNote) {
    resultArea.innerHTML = '<p class="idea-plan-note" style="color:var(--danger)">監視中を選択した場合は、予定時期または監視メモのどちらかを入力してください。</p>';
    return;
  }

  const item = {
    customerName,
    subject: getVal('corr-subject'),
    inquiryText: getVal('reply-customer-message'),
    replyText: getVal('reply-result'),
    status,
    nextActionDate,
    followUpDeadline: getVal('corr-follow-up-deadline'),
    targetPeriod,
    monitoringNote,
    memo: getVal('corr-memo'),
    // 顧客IDが判明していれば保存する（「過去のやり取り」のID優先照合に使う。
    // 未判明の場合は空文字のまま＝CorrespondenceStore.update()側で既存の紐付けを消さない）。
    aiSecretaryId: App.selectedCustomer?.id || '',
  };

  const reEditId = App._correspondenceReEditId;
  const previousStatus = App._correspondenceReEditPrevStatus;
  btn.disabled = true;
  btn.textContent = reEditId ? '更新中...' : '保存中...';
  resultArea.innerHTML = '';

  let saved;
  try {
    if (reEditId) {
      saved = await CorrespondenceStore.update(reEditId, item, previousStatus);
    } else {
      saved = await CorrespondenceStore.add(item);
    }
  } catch (e) {
    console.error(e);
    btn.disabled = false;
    btn.textContent = reEditId ? '&#128190; 案件として保存' : '&#128190; 案件として保存';
    resultArea.innerHTML = `<p class="idea-plan-note" style="color:var(--danger)">${esc(e.message || '保存に失敗しました。')}</p>`;
    return;
  }

  // ── 再編集からのUPDATE成功パス ──
  // ブログ機能の重複INSERT不具合修正（blog-reedit-residual-insert-path-fix-report.md）と同じ理由で、
  // ボタン文言変更・フォーム再描画のどのコードよりも先にこの分岐を置き、
  // UPDATE成功時は必ずここでreturnする（同じ画面上に「保存」ボタンを残さない）。
  if (reEditId && saved) {
    App._correspondenceReEditId = null;
    App._correspondenceReEditPrevStatus = null;
    navigate('correspondenceLibrary');
    return;
  }

  btn.disabled = false;
  btn.textContent = '&#128190; 案件として保存';
  if (!saved) {
    resultArea.innerHTML = '<p class="idea-plan-note" style="color:var(--danger)">保存に失敗しました。もう一度お試しください。</p>';
    return;
  }
  resultArea.innerHTML = '<p class="idea-plan-note" style="color:var(--success)">案件として保存しました。</p>';
  refreshCorrespondenceAlertCount();
  // 案件保存後、「過去のやり取り」をページ移動せず再取得して即時反映する
  // （customer-reply-inline-history-report.md参照）。
  loadCustomerInlineHistory(getCurrentReplyCustomerIdentity());
}

// ブログ書庫の再編集（reEditEditorialArticle）と同じ考え方：navigate()の直後、他のawaitを
// 一切挟まずApp._correspondenceReEditIdを同期的に設定する。これにより、再編集開始から保存until
// の間に別の描画が割り込んでも、保存時にArticleStore.add()相当（＝重複INSERT）へ誤って
// 到達することがない（blog-reedit-duplicate-insert-fix-report.md参照）。
async function reEditCorrespondence(id) {
  const cached = (App._correspondenceLibraryItems || []).find(c => c.id === id);
  const item = cached || await CorrespondenceStore.find(id);
  if (!item) return alert('案件が見つかりませんでした。');

  navigate('customerReply');
  App._correspondenceReEditId = id;
  App._correspondenceReEditPrevStatus = item.status;
  document.getElementById('reply-name').value = item.customerName;
  document.getElementById('reply-customer-message').value = item.inquiryText;
  document.getElementById('reply-result').value = item.replyText;
  document.getElementById('corr-subject').value = item.subject;
  document.getElementById('corr-status').value = item.status;
  document.getElementById('corr-next-action-date').value = item.nextActionDate;
  document.getElementById('corr-follow-up-deadline').value = item.followUpDeadline;
  document.getElementById('corr-target-period').value = item.targetPeriod;
  document.getElementById('corr-monitoring-note').value = item.monitoringNote;
  document.getElementById('corr-memo').value = item.memo;
  const note = document.getElementById('corr-reedit-note');
  if (note) note.innerHTML = `<span style="color:var(--warning)">顧客対応書庫の案件を再編集中です（${esc(item.customerName)} 様）。保存すると元の案件が更新されます。</span>`;
  const saveBtn = document.getElementById('corr-save-btn');
  if (saveBtn) saveBtn.innerHTML = '&#128190; 案件を更新する';

  // 顧客IDが分かっていれば、再保存時も紐付けが維持されるようApp.selectedCustomerへ反映しておく
  // （saveCorrespondence()のaiSecretaryIdはApp.selectedCustomer?.idから読むため）。
  App.selectedCustomer = item.aiSecretaryId ? { id: item.aiSecretaryId, content: '' } : null;
  // 「過去のやり取り」を再編集画面を開いた時点で読み込む（customer-reply-inline-history-report.md参照）。
  loadCustomerInlineHistory({ id: item.aiSecretaryId || '', name: item.aiSecretaryId ? '' : item.customerName });
}

// ── 顧客対応書庫 ──────────────────────────────────────────────────────
// customer-correspondence-management-phase1-report.md参照。

function todayDateString() {
  const d = new Date();
  return `${d.getFullYear()}-${(d.getMonth() + 1).toString().padStart(2, '0')}-${d.getDate().toString().padStart(2, '0')}`;
}

// 左メニューの「顧客対応」バッジ・トップ画面アラートで使う件数計算。
// いずれか1つでも満たせば1件としてカウントする（複数条件に該当しても重複カウントしない）：
// ・status = unhandled
// ・next_action_dateが今日以前
// ・follow_up_deadlineが今日以前
// ・status = monitoring かつ次回対応日が今日以前
// 完了(completed)の案件は対象外（完了案件は通常アラートから除外する）。
function computeCorrespondenceAlertCount(items) {
  const today = todayDateString();
  let count = 0;
  for (const c of items) {
    if (c.status === 'completed') continue;
    const matches =
      c.status === 'unhandled' ||
      (!!c.nextActionDate && c.nextActionDate <= today) ||
      (!!c.followUpDeadline && c.followUpDeadline <= today) ||
      (c.status === 'monitoring' && !!c.nextActionDate && c.nextActionDate <= today);
    if (matches) count++;
  }
  return count;
}

// トップ画面アラートタイル用の集計。優先表示の順序（期限超過→本日対応→要対応→返信待ち→監視中）
// に沿った5つの指標を計算する。完了(completed)の案件はすべての指標から除外する。
// 「期限超過」はフォロー期限が今日以前のものを指す（次回対応日の超過は書庫カード上で
// 個別に「確認予定日を超過」として表示するため、ここでは重複させない）。
function computeCorrespondenceDashboardStats(items) {
  const today = todayDateString();
  const active = items.filter(c => c.status !== 'completed');
  return {
    overdue: active.filter(c => !!c.followUpDeadline && c.followUpDeadline <= today).length,
    today: active.filter(c => c.nextActionDate === today).length,
    unhandled: active.filter(c => c.status === 'unhandled').length,
    waiting: active.filter(c => c.status === 'waiting').length,
    monitoring: active.filter(c => c.status === 'monitoring').length,
  };
}

// トップ画面アラート・書庫の期限超過カードから、フィルターを指定した状態で顧客対応書庫へ移動する。
function navigateToCorrespondenceLibrary(filter) {
  CorrespondenceLibrary.filter = filter;
  navigate('correspondenceLibrary');
}

// App._correspondenceAlertCountを更新し、renderNav()でバッジへ反映する。
// itemsを渡した場合は再取得を省略する（顧客対応書庫の読み込み・保存・完了・削除の直後など、
// 既に最新データを取得済みの場面で使う）。省略した場合はDBから取得し直す
// （ログイン直後、まだ顧客対応書庫を開いていない場面で使う）。
async function refreshCorrespondenceAlertCount(items) {
  const list = items || await CorrespondenceStore.list();
  App._correspondenceAlertCount = computeCorrespondenceAlertCount(list);
  renderNav();
}

// 左メニュー「業務管理」バッジの集計。「確認・対応が必要な件数」を表す（総登録件数ではない）：
// ・本日のスケジュール件数
// ・未完了タスクのうち、期限が本日または本日より前（＝本日期限＋期限超過）の件数
// 完了済みタスク・過去の完了予定は含めない。メモ・アイデアは対象外
// （navigation-priority-and-work-management-group-report.md参照）。
function computeWorkManagementCounts(schedules, tasks) {
  const today = dateStr(new Date());
  const scheduleToday = schedules.filter(s => s.date === today).length;
  const taskAlert = tasks.filter(t => !t.done && t.dueDate && t.dueDate <= today).length;
  return { scheduleToday, taskAlert, total: scheduleToday + taskAlert };
}

// App._workManagementCountsを更新し、renderNav()でバッジへ反映する（親メニュー本体の合計と、
// スケジュール・タスク子メニューの内訳の両方に使う。合計＝内訳の単純合算のため矛盾しない）。
// schedules/tasksを渡した場合はその表の再取得を省略する（renderSchedule()/renderTasks()が
// 自身の一覧表示のためにどのみち取得済みのデータをそのまま渡す）。省略した側は
// 個別に取得し直す（ログイン直後や、もう片方のテーブルを取得していない場面で使う）。
async function refreshWorkManagementAlertCount(schedules, tasks) {
  const allSchedules = schedules || await Store.get('schedules');
  const allTasks = tasks || await Store.get('tasks');
  App._workManagementCounts = computeWorkManagementCounts(allSchedules, allTasks);
  renderNav();
}

// 左メニュー「スケジュール」子メニューの件数。今日を含む未来の予定総数
// （Store.get()が返す時点で削除済み行は含まれないため、削除済み除外は別途不要。
// 同じ行が重複することもないため、単純なfilter().lengthで重複カウントの心配もない）。
// 「業務管理」親メニューの本日件数（computeWorkManagementCounts）とは意味が異なる指標のため、
// 別のApp状態（App._scheduleUpcomingCount）で持つ（schedule-upcoming-list-and-badge-report.md参照）。
function computeUpcomingScheduleCount(schedules) {
  const today = dateStr(new Date());
  return schedules.filter(s => s.date >= today).length;
}

// App._scheduleUpcomingCountを更新し、renderNav()でバッジへ反映する。schedulesを渡した場合は
// 再取得を省略する（renderSchedule()が自身の一覧表示のためにどのみち取得済みのデータを渡す）。
async function refreshScheduleUpcomingCount(schedules) {
  const allSchedules = schedules || await Store.get('schedules');
  App._scheduleUpcomingCount = computeUpcomingScheduleCount(allSchedules);
  renderNav();
}

// 期限超過（次回対応日またはフォロー期限のいずれかが今日以前）かどうか。
// 完了済みの案件は対象外とする（完了案件は通常アラート・期限超過フィルターから除外する）。
function isCorrespondenceOverdue(item) {
  if (item.status === 'completed') return false;
  const today = todayDateString();
  return (!!item.nextActionDate && item.nextActionDate <= today) || (!!item.followUpDeadline && item.followUpDeadline <= today);
}
function isNextActionOverdue(item) {
  return item.status !== 'completed' && !!item.nextActionDate && item.nextActionDate <= todayDateString();
}
function isFollowUpOverdue(item) {
  return item.status !== 'completed' && !!item.followUpDeadline && item.followUpDeadline <= todayDateString();
}

// 「同じ顧客」の判定ロジック。Phase1ではcustomer_nameの完全一致のみで判定する。
// 将来的にAI秘書IDなど別の顧客識別子と連携する場合は、この関数の内部実装だけを
// 差し替えれば済むよう、呼び出し側から判定ロジックを分離している。
function findCorrespondencesByCustomerName(items, customerName, excludeId) {
  if (!customerName) return [];
  return items
    .filter(c => c.id !== excludeId && c.customerName === customerName)
    .sort((a, b) => new Date(b.updatedAt || b.createdAt) - new Date(a.updatedAt || a.createdAt));
}

const CORRESPONDENCE_FILTER_TABS = [
  ['all', 'すべて'],
  ['unhandled', '要対応'],
  ['ongoing', '継続中'],
  ['waiting', '返信待ち'],
  ['monitoring', '監視中'],
  ['completed', '完了'],
  ['overdue', '期限超過'],
];

const CorrespondenceLibrary = { query: '', isComposing: false, filter: 'all' };

function applyCorrespondenceFilter(items) {
  const q = CorrespondenceLibrary.query.normalize('NFKC').toLowerCase();
  return items.filter(c => {
    if (q && !(c.customerName || '').normalize('NFKC').toLowerCase().includes(q)) return false;
    const f = CorrespondenceLibrary.filter;
    if (f === 'all') return true;
    if (f === 'overdue') return isCorrespondenceOverdue(c);
    return c.status === f;
  });
}

async function renderCorrespondenceLibrary() {
  document.getElementById('main').innerHTML = '<div class="loading-screen">読み込み中...</div>';
  const items = await CorrespondenceStore.list();
  App._correspondenceLibraryItems = items;
  refreshCorrespondenceAlertCount(items);
  renderCorrespondenceLibraryShell();
}

// App._correspondenceLibraryItemsを再取得せず、現在メモリ上にあるデータから
// 顧客対応書庫の画面（検索欄＋フィルタータブ＋カード一覧）だけを再構築する
// （ブログ書庫のrenderEditorialLibraryShell()と同じ考え方）。
function renderCorrespondenceLibraryShell() {
  const items = App._correspondenceLibraryItems || [];
  const filtered = applyCorrespondenceFilter(items);
  document.getElementById('main').innerHTML = `
    <div class="section-header"><h2>案件一覧</h2></div>
    <div style="display:flex;gap:8px;margin-bottom:12px">
      <input
        id="corr-lib-search"
        type="text"
        placeholder="&#128269; 顧客名で検索..."
        value="${esc(CorrespondenceLibrary.query)}"
        oninput="corrLibOnSearch(this.value)"
        oncompositionstart="corrLibOnCompositionStart()"
        oncompositionend="corrLibOnCompositionEnd(this.value)"
        style="flex:1;padding:8px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px"
      >
      <button class="btn" onclick="document.getElementById('corr-lib-search').value='';corrLibOnSearch('')">クリア</button>
    </div>
    <div class="filter-bar">
      ${CORRESPONDENCE_FILTER_TABS.map(([v, l]) => `<button class="filter-btn ${CorrespondenceLibrary.filter === v ? 'active' : ''}" onclick="corrLibSetFilter('${v}')">${esc(l)}</button>`).join('')}
    </div>
    ${filtered.length ? filtered.map(c => buildCorrespondenceCardHtml(c)).join('') : '<div class="empty-state"><div class="icon">&#128203;</div><p>該当する案件はありません</p></div>'}
  `;
}

// 期限日（YYYY-MM-DD）まであと何日かを計算する。負の値は超過を意味する
// （超過表示自体はisFollowUpOverdue/isNextActionOverdueで別途行う）。
function daysUntilDate(dateStr) {
  if (!dateStr) return null;
  const today = new Date(`${todayDateString()}T00:00:00`);
  const target = new Date(`${dateStr}T00:00:00`);
  return Math.round((target - today) / 86400000);
}

function buildCorrespondenceCardHtml(c) {
  const nextOverdue = isNextActionOverdue(c);
  const followOverdue = isFollowUpOverdue(c);
  const replyPreview = (c.replyText || '').trim().slice(0, 60);
  const isMonitoring = c.status === 'monitoring';
  // 監視中案件は、予定時期・次回確認日・確認期限・期限までの日数を目立たせる
  // （長期監視案件を忘れないことが最優先目標のため。customer-correspondence-management-phase1-report.md参照）。
  const daysLeft = isMonitoring && c.followUpDeadline && !followOverdue ? daysUntilDate(c.followUpDeadline) : null;
  return `
    <div class="card catalog-library-card memo-item" style="cursor:pointer" onclick="showCorrespondenceDetail('${c.id}')">
      <div class="catalog-library-info">
        <div class="memo-title">${esc(c.customerName || '(顧客名未入力)')}${c.subject ? `　${esc(c.subject)}` : ''}</div>
        <div class="idea-plan-note" style="margin:4px 0"><span class="idea-plan-badge">${esc(correspondenceStatusLabel(c.status))}</span></div>
        ${isMonitoring ? `
          <div class="idea-plan-note" style="margin:6px 0;padding:8px;background:#fffbeb;border-radius:6px;font-weight:600">
            &#128064; 予定時期：${esc(c.targetPeriod || '未設定')}　次回確認日：${esc(c.nextActionDate || '未設定')}　確認期限：${esc(c.followUpDeadline || '未設定')}${daysLeft !== null ? `（期限まであと${daysLeft}日）` : ''}
          </div>
        ` : ''}
        ${c.nextActionDate ? `<div class="memo-preview">次回対応日：${esc(c.nextActionDate)}${nextOverdue ? ' <span style="color:var(--danger);font-weight:600">確認予定日を超過</span>' : ''}</div>` : ''}
        ${c.followUpDeadline ? `<div class="memo-preview">フォロー期限：${esc(c.followUpDeadline)}${followOverdue ? ' <span style="color:var(--danger);font-weight:600">期限超過</span>' : ''}</div>` : ''}
        ${!isMonitoring && c.targetPeriod ? `<div class="memo-preview">予定時期：${esc(c.targetPeriod)}</div>` : ''}
        ${replyPreview ? `<div class="memo-preview">${esc(replyPreview)}</div>` : ''}

// Event Management（イベント管理）
// event-customer-link-management-phase1-report.md参照。3テーブル（events/event_brands/
// event_watchers）はevents_management_tables.sqlで新規作成する。既存の顧客管理・顧客対応・
// メール返信の各機能へは、必要な連携ポイント（顧客紐付け・メール返信の宛名/本文引き継ぎ）
// 以外、一切変更を加えない。

const EventLibrary = { query: '', isComposing: false, statusFilter: 'all', dateModeFilter: 'all', sortKey: 'updated' };

const EVENT_FILTER_TABS = [
  ['all', 'すべて'],
  ['unannounced', '未発表'],
  ['date_confirmed', '日程決定'],
  ['inviting', '案内中'],
  ['completed', '終了'],
  ['cancelled', '中止'],
];
const EVENT_DATE_MODE_FILTER_TABS = [
  ['all', 'すべて'],
  ['undecided', '未定'],
  ['approximate', '時期のみ'],
  ['fixed', '日程確定'],
];

function eventWatcherCounts(eventId) {
  const list = (App._eventLibraryWatchers || []).filter(w => w.eventId === eventId);
  return {
    total: list.length,
    waiting: list.filter(w => w.contactStatus === 'waiting').length,
    contacted: list.filter(w => w.contactStatus === 'contacted').length,
    reserved: list.filter(w => w.contactStatus === 'reserved').length,
    declined: list.filter(w => w.contactStatus === 'declined').length,
  };
}

function applyEventFilter(events) {
  const q = EventLibrary.query.normalize('NFKC').toLowerCase();
  return events.filter(ev => {
    if (q) {
      const hay = `${ev.title} ${ev.supplier} ${ev.seasonLabel}`.normalize('NFKC').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    if (EventLibrary.statusFilter !== 'all' && ev.status !== EventLibrary.statusFilter) return false;
    if (EventLibrary.dateModeFilter !== 'all' && ev.dateMode !== EventLibrary.dateModeFilter) return false;
    return true;
  });
}

function applyEventSort(events) {
  const sorted = events.slice();
  if (EventLibrary.sortKey === 'upcoming') {
    // 日程未確定（undecided/approximate）は「開催予定が近い順」では常に末尾へ回す。
    sorted.sort((a, b) => {
      const da = (a.dateMode === 'fixed' && a.startDate) ? a.startDate : '9999-99-99';
      const db = (b.dateMode === 'fixed' && b.startDate) ? b.startDate : '9999-99-99';
      return da.localeCompare(db);
    });
  } else if (EventLibrary.sortKey === 'waiting') {
    sorted.sort((a, b) => eventWatcherCounts(b.id).waiting - eventWatcherCounts(a.id).waiting);
  } else {
    sorted.sort((a, b) => new Date(b.updatedAt) - new Date(a.updatedAt));
  }
  return sorted;
}

async function renderEventLibrary() {
  document.getElementById('main').innerHTML = '<div class="loading-screen">読み込み中...</div>';
  const events = await EventStore.list();
  App._eventLibraryItems = events;
  const eventIds = events.map(e => e.id);
  const [brands, watchers] = await Promise.all([
    EventBrandStore.listByEventIds(eventIds),
    EventWatcherStore.listByEventIds(eventIds),
  ]);
  App._eventLibraryBrands = brands;
  App._eventLibraryWatchers = watchers;
  refreshEventAlertCount(events, watchers);
  renderEventLibraryShell();
}

// App._eventLibraryItemsを再取得せず、現在メモリ上にあるデータから一覧画面（検索欄＋
// フィルター＋ソート＋カード一覧）だけを再構築する（顧客対応書庫と同じ考え方）。
function renderEventLibraryShell() {
  const events = App._eventLibraryItems || [];
  const filtered = applyEventSort(applyEventFilter(events));
  document.getElementById('main').innerHTML = `
    <div class="section-header" style="display:flex;justify-content:space-between;align-items:center">
      <h2>イベント管理</h2>
      <button class="btn btn-primary" onclick="showEventModal(null)">＋ 新規イベント</button>
    </div>
    <div style="display:flex;gap:8px;margin-bottom:12px">
      <input
        id="event-lib-search"
        type="text"
        placeholder="&#128269; イベント名・主催／取引先で検索..."
        value="${esc(EventLibrary.query)}"
        oninput="eventLibOnSearch(this.value)"
        oncompositionstart="eventLibOnCompositionStart()"
        oncompositionend="eventLibOnCompositionEnd(this.value)"
        style="flex:1;padding:8px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px"
      >
      <button class="btn" onclick="document.getElementById('event-lib-search').value='';eventLibOnSearch('')">クリア</button>
      <select onchange="eventLibSetSort(this.value)" style="padding:8px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px">
        <option value="updated" ${EventLibrary.sortKey === 'updated' ? 'selected' : ''}>更新日が新しい順</option>
        <option value="upcoming" ${EventLibrary.sortKey === 'upcoming' ? 'selected' : ''}>開催予定が近い順</option>
        <option value="waiting" ${EventLibrary.sortKey === 'waiting' ? 'selected' : ''}>連絡待ちが多い順</option>
      </select>
    </div>
    <div class="filter-bar">
      ${EVENT_FILTER_TABS.map(([v, l]) => `<button class="filter-btn ${EventLibrary.statusFilter === v ? 'active' : ''}" onclick="eventLibSetStatusFilter('${v}')">${esc(l)}</button>`).join('')}
    </div>
    <div class="filter-bar" style="margin-top:6px">
      ${EVENT_DATE_MODE_FILTER_TABS.map(([v, l]) => `<button class="filter-btn ${EventLibrary.dateModeFilter === v ? 'active' : ''}" onclick="eventLibSetDateModeFilter('${v}')">開催時期: ${esc(l)}</button>`).join('')}
    </div>
    ${filtered.length ? filtered.map(ev => buildEventCardHtml(ev)).join('') : '<div class="empty-state"><div class="icon">&#127914;</div><p>該当するイベントはありません</p></div>'}
  `;
}

function buildEventCardHtml(ev) {
  const brands = (App._eventLibraryBrands || []).filter(b => b.eventId === ev.id);
  const counts = eventWatcherCounts(ev.id);
  const isUndated = ev.dateMode === 'undecided';
  return `
    <div class="card catalog-library-card memo-item" style="cursor:pointer" onclick="showEventDetail('${ev.id}')">
      <div class="catalog-library-info">
        <div class="memo-title">${esc(ev.title)}${isUndated ? ' <span class="idea-plan-badge" style="background:#fef3c7;color:#92400e">日程確認待ち</span>' : ''}</div>
        <div class="idea-plan-note" style="margin:4px 0">
          <span class="idea-plan-badge">${esc(eventStatusLabel(ev.status))}</span>
          ${ev.supplier ? `　主催／取引先：${esc(ev.supplier)}` : ''}
          ${ev.seasonLabel ? `　シーズン：${esc(ev.seasonLabel)}` : ''}
        </div>
        ${brands.length ? `<div class="memo-preview">対象ブランド：${esc(brands.map(b => b.brandName).join('、'))}</div>` : ''}
        <div class="memo-preview">開催予定：${esc(formatEventSchedule(ev))}</div>
        <div class="idea-plan-note" style="margin:6px 0;padding:8px;background:${counts.waiting > 0 ? '#fffbeb' : 'var(--surface)'};border-radius:6px">
          連絡希望顧客：${counts.total}名　${counts.waiting > 0 ? `<strong style="color:var(--danger)">未連絡 ${counts.waiting}</strong>` : '未連絡 0'}　連絡済 ${counts.contacted}　予約済 ${counts.reserved}　辞退 ${counts.declined}
        </div>
        <div class="memo-date" style="margin-top:6px"><span>最終更新 ${formatDate(ev.updatedAt)}</span></div>
      </div>
      <div class="blog-library-actions">
        <button class="btn" onclick="event.stopPropagation();showEventModal('${ev.id}')">再編集</button>
        <button class="btn" onclick="event.stopPropagation();showEventDetail('${ev.id}')">詳細</button>
        <button class="btn-ghost" onclick="event.stopPropagation();deleteEvent('${ev.id}')">&#10005;</button>
      </div>
    </div>
  `;
}

function eventLibSetStatusFilter(v) { EventLibrary.statusFilter = v; renderEventLibraryShell(); }
function eventLibSetDateModeFilter(v) { EventLibrary.dateModeFilter = v; renderEventLibraryShell(); }
function eventLibSetSort(v) { EventLibrary.sortKey = v; renderEventLibraryShell(); }
function eventLibOnSearch(val) {
  EventLibrary.query = val.trim();
  if (EventLibrary.isComposing) return;
  renderEventLibraryShell();
}
function eventLibOnCompositionStart() { EventLibrary.isComposing = true; }
function eventLibOnCompositionEnd(val) { EventLibrary.isComposing = false; eventLibOnSearch(val); }

// イベント削除：確認文言は要件どおり一言一句固定する。event_brands/event_watchersは
// on delete cascadeで自動削除される（顧客本体には一切触れない）。
async function deleteEvent(id) {
  if (!confirm('このイベントを削除しますか？紐付いている連絡希望顧客も解除されます。この操作は取り消せません。')) return;
  const ok = await EventStore.remove(id);
  if (!ok) { alert('削除に失敗しました。'); return; }
  App._eventLibraryItems = (App._eventLibraryItems || []).filter(e => e.id !== id);
  App._eventLibraryBrands = (App._eventLibraryBrands || []).filter(b => b.eventId !== id);
  App._eventLibraryWatchers = (App._eventLibraryWatchers || []).filter(w => w.eventId !== id);
  renderEventLibraryShell();
  refreshEventAlertCount(App._eventLibraryItems, App._eventLibraryWatchers);
}

  if (dateGroup) dateGroup.style.display = mode === 'fixed' ? 'block' : 'none';

// 対象ブランドのtextarea入力（1行1ブランド、読点/カンマ区切りも許容）を配列へ変換する。
// 商品カタログのparseCatalogKeywordList()と同じ考え方（分割→trim→重複排除→空要素除去）。
function parseEventBrandList(text) {
  return [...new Set(text.split(/[\n,、]/).map(s => s.trim()).filter(Boolean))];
}

// 新規登録／再編集の共通フォームモーダル。editIdがnullなら新規、指定があれば再編集。

  }
  // 重複INSERT不具合修正（blog-reedit-residual-insert-path-fix-report.md）と同じ理由で、
  // navigate等の非同期処理を挟まずここで同期的に再編集対象idを確定させる。
  App._eventModalEditId = editId || null;
  App._eventModalPrevStatus = ev ? ev.status : null;

    <div class="form-group"><label>イベント名（必須）</label><input id="ev-title" value="${esc(ev?.title || '')}" placeholder="例：フラテッリジャコメッティ／マルモラーダ秋冬オーダー会"></div>

    <div class="form-group"><label>シーズン</label><input id="ev-season" value="${esc(ev?.seasonLabel || '')}" placeholder="例：2026秋冬"></div>
    <div class="form-group"><label>状態</label>
      <select id="ev-status">${EVENT_STATUS_OPTIONS.map(([v, l]) => `<option value="${v}" ${(ev?.status || 'unannounced') === v ? 'selected' : ''}>${l}</option>`).join('')}</select>
    </div>
    <div class="form-group"><label>日程区分</label>
      <select id="ev-date-mode" onchange="eventModalOnDateModeChange(this.value)">${EVENT_DATE_MODE_OPTIONS.map(([v, l]) => `<option value="${v}" ${dateMode === v ? 'selected' : ''}>${l}</option>`).join('')}</select>
    </div>
    <div class="form-group" id="ev-target-period-group" style="display:${dateMode === 'approximate' ? 'block' : 'none'}">

    </div>
    <div class="form-group" id="ev-date-range-group" style="display:${dateMode === 'fixed' ? 'block' : 'none'}">
      <label>開始日</label><input id="ev-start-date" type="date" value="${esc(ev?.startDate || '')}">
      <label style="margin-top:8px;display:block">終了日</label><input id="ev-end-date" type="date" value="${esc(ev?.endDate || '')}">
    </div>
    <div class="form-group"><label>対象ブランド（1行に1つ）</label><textarea id="ev-brands" rows="3" placeholder="例：Fratelli Giacometti">${esc(brands.map(b => b.brandName).join('\n'))}</textarea></div>
    <div class="form-group"><label>説明</label><textarea id="ev-description" rows="3">${esc(ev?.description || '')}</textarea></div>
    <div class="form-group"><label>社内メモ</label><textarea id="ev-memo" rows="3">${esc(ev?.internalMemo || '')}</textarea></div>
    <div id="event-modal-result"></div>

      <button class="btn" onclick="closeModal()">キャンセル</button>

    </div>
  `);
}

async function saveEventForm() {
  const btn = document.getElementById('event-save-btn');
  const resultArea = document.getElementById('event-modal-result');
  if (btn.disabled) return; // 二重クリック対策（saveCorrespondence()と同じパターン）
  const getVal = (id) => (document.getElementById(id)?.value || '').trim();

  const title = getVal('ev-title');
  if (!title) { resultArea.innerHTML = '<p class="idea-plan-note" style="color:var(--danger)">イベント名を入力してください。</p>'; return; }

  const dateMode = getVal('ev-date-mode') || 'undecided';
  const targetPeriod = getVal('ev-target-period');
  const description = getVal('ev-description');
  const internalMemo = getVal('ev-memo');
  const startDate = getVal('ev-start-date');

  // 曖昧時期の扱い（要件13）：未定は説明または社内メモ必須、時期のみは予定時期必須、
  // 日程確定は開始日必須。
  if (dateMode === 'undecided' && !description && !internalMemo) {
    resultArea.innerHTML = '<p class="idea-plan-note" style="color:var(--danger)">日程区分が未定の場合は、説明または社内メモのどちらかを入力してください。</p>';
    return;
  }
  if (dateMode === 'approximate' && !targetPeriod) {
    resultArea.innerHTML = '<p class="idea-plan-note" style="color:var(--danger)">日程区分が時期のみの場合は、予定時期を入力してください。</p>';
    return;
  }
  if (dateMode === 'fixed' && !startDate) {
    resultArea.innerHTML = '<p class="idea-plan-note" style="color:var(--danger)">日程区分が日程確定の場合は、開始日を入力してください。</p>';
    return;
  }

  const item = {
    title,
    supplier: getVal('ev-supplier'),
    seasonLabel: getVal('ev-season'),
    status: getVal('ev-status') || 'unannounced',
    dateMode,
    targetPeriod,
    startDate,
    endDate: getVal('ev-end-date'),
    description,
    internalMemo,
  };
  const brandNames = parseEventBrandList(getVal('ev-brands'));

  const editId = App._eventModalEditId;
  const prevStatus = App._eventModalPrevStatus;
  btn.disabled = true;
  btn.textContent = editId ? '更新中...' : '保存中...';
  resultArea.innerHTML = '';

  let saved;
  try {
    saved = editId ? await EventStore.update(editId, item, prevStatus) : await EventStore.add(item);
  } catch (e) {
    console.error(e);
    btn.disabled = false;
    btn.textContent = editId ? '&#128190; 更新' : '&#128190; 保存';
    resultArea.innerHTML = `<p class="idea-plan-note" style="color:var(--danger)">${esc(e.message || '保存に失敗しました。')}</p>`;
    return;
  }

  // 再編集からのUPDATE成功パス。ブログ・顧客対応と同じ重複INSERT防止パターンで、
  // ボタン文言変更・フォーム再描画のどのコードよりも先にこの分岐を置き、
  // UPDATE成功時は必ずここでreturnする（同じ画面上に保存ボタンを残さない）。
  if (editId) {
    if (!saved) {
      btn.disabled = false;
      btn.textContent = '&#128190; 更新';
      resultArea.innerHTML = '<p class="idea-plan-note" style="color:var(--danger)">更新に失敗しました。もう一度お試しください。</p>';
      return;
    }
    // ブランドは安全な差分更新（追加分のみINSERT・除外分のみDELETE）。event_watchersには
    // 一切触れない（要件6：再編集で連絡希望顧客を無言で消さない）。
    const brandOk = await EventBrandStore.replaceForEvent(editId, brandNames);
    if (!brandOk) alert('対象ブランドの更新に失敗しました。イベント自体は更新済みです。');
    closeModal();
    await renderEventLibrary();
    return;
  }

  if (!saved) {
    btn.disabled = false;
    btn.textContent = '&#128190; 保存';
    resultArea.innerHTML = '<p class="idea-plan-note" style="color:var(--danger)">保存に失敗しました。もう一度お試しください。</p>';
    return;
  }
  const brandOk = await EventBrandStore.addAll(saved.id, brandNames);
  if (!brandOk) alert('イベントは保存されましたが、対象ブランドの保存に失敗しました。再編集から登録し直してください。');
  closeModal();
  await renderEventLibrary();
}

// メール返信画面のdatalist（customer-list）と同じ作り方で、氏名検索用の候補一覧を用意する。
async function loadEventWatcherCandidates() {
  const customers = (App._customerList && App._customerList.length) ? App._customerList : await loadCustomerList();
  App._customerList = customers;
  const dl = document.getElementById('event-watcher-candidates');
  if (!dl) return;
  const nameCounts = {};
  customers.forEach(c => { nameCounts[c.name] = (nameCounts[c.name] || 0) + 1; });
  dl.innerHTML = customers.map(c => {
    const hasDupe = nameCounts[c.name] > 1;
    const label = (hasDupe && c.id) ? `${c.id}　${c.name} 様` : `${c.name} 様`;
    return `<option value="${esc(label)}">`;
  }).join('');
}

// 入力文字列（datalistの候補、またはID直打ち）から顧客識別子を解決する。onNameInput()の
// ID優先解決ロジックのうち、顧客プロフィール本文の取得までは不要（氏名・IDのみ使う）ため
// 必要な部分だけを流用する。
function resolveEventWatcherCandidate(query) {
  const q = query.trim();
  if (!q) return null;
  const idMatch = q.match(/^(NTR-\d{6})/);
  if (idMatch) {
    const found = (App._customerList || []).find(c => c.id === idMatch[1]);
    // loadEventWatcherCandidates()の完了前に追加された場合など、App._customerListが
    // まだ無い/該当が見つからない場合でも、ID接頭辞と「様」をraw文字列から取り除いてから
    // customer_nameへ保存する（生のdatalistラベルをそのまま保存しない。
    // customer-reply-label-and-duplicate-header-fix-report.mdと同じ理由）。
    const fallbackName = stripCustomerIdPrefix(q).replace(/\s*様\s*$/, '').trim();
    return { id: idMatch[1], name: found ? found.name : fallbackName };
  }
  const nameQuery = q.replace(/^NTR-\d{6}\s*　?\s*/, '').replace(/\s*様\s*$/, '').trim();
  const found = (App._customerList || []).find(c => c.name === nameQuery || c.yomi === nameQuery);
  return found ? { id: found.id || '', name: found.name } : { id: '', name: nameQuery };
}

async function addEventWatcherFromInput() {
  const input = document.getElementById('event-watcher-search');
  const candidate = resolveEventWatcherCandidate(input?.value || '');
  if (!candidate || !candidate.name) { alert('顧客名を入力または選択してください。'); return; }

  const watchers = App._eventDetailWatchers || [];
  // 重複追加防止：IDが判明していればID一致、無い場合のみ氏名完全一致で判定する
  // （要件3・7参照。events_management_tables.sqlの部分unique indexと同じ優先順位）。
  const isDupe = candidate.id
    ? watchers.some(w => w.aiSecretaryId === candidate.id)
    : watchers.some(w => !w.aiSecretaryId && w.customerName === candidate.name);
  if (isDupe) { alert('この顧客は既にこのイベントに登録されています。'); return; }

  const saved = await EventWatcherStore.add({
    eventId: App._eventDetailId,
    aiSecretaryId: candidate.id,
    customerName: candidate.name,
    contactStatus: 'waiting',
  });
  if (!saved) { alert('追加に失敗しました。もう一度お試しください。'); return; }
  if (input) input.value = '';
  await reloadEventDetail();
}

// Customer Management
const CM = {
  list: [],          // customers-index.json の全データ
  filtered: [],      // 検索・ソート後のリスト
  sortKey: 'updatedAt',
  sortAsc: false,
  query: '',
  checked: new Set(),
  isComposing: false, // IME変換中フラグ（customer-search-bug-report.md参照）
};

async function renderCustomerManagement() {
  document.getElementById('main').innerHTML = '<div class="loading-screen">読み込み中...</div>';
  const res = await localFetch('/api/customers', { cache: 'no-store' });
  const data = await res.json();
  CM.list = (data.customers || []);
  CM.checked = new Set();
  cmApplyFilter();
}

function cmApplyFilter() {
  const q = CM.query.normalize('NFKC').toLowerCase();
  CM.filtered = CM.list.filter(c => {
    if (!q) return true;
    const id = (c.id || '').toLowerCase();
    const name = (c.name || '').normalize('NFKC').toLowerCase();
    const yomi = (c.yomi || '').normalize('NFKC').toLowerCase();
    // 検索対象に「主な好み」「メモ概要」を追加（customer-search-bug-report.md参照）。
    // 既存のid/name/yomiと同じくNFKC正規化＋小文字化で表記ゆれを吸収する。
    const preferBrands = (c.preferBrands || '').normalize('NFKC').toLowerCase();
    const preferStyle = (c.preferStyle || '').normalize('NFKC').toLowerCase();
    const memoSnippet = (c.memoSnippet || '').normalize('NFKC').toLowerCase();
    return id.includes(q) || name.includes(q) || yomi.includes(q)
      || preferBrands.includes(q) || preferStyle.includes(q) || memoSnippet.includes(q);
  });
  cmApplySort();
}

function cmApplySort() {
  const key = CM.sortKey;
  const asc = CM.sortAsc;
  CM.filtered.sort((a, b) => {
    let va = a[key] || '';
    let vb = b[key] || '';
    if (key === 'id') {
      va = parseInt((va.match(/\d+/) || ['0'])[0], 10);
      vb = parseInt((vb.match(/\d+/) || ['0'])[0], 10);
    } else if (key === 'name' || key === 'yomi') {
      va = (a.yomi || a.name || '').normalize('NFKC');
      vb = (b.yomi || b.name || '').normalize('NFKC');
    }
    if (va < vb) return asc ? -1 : 1;
    if (va > vb) return asc ? 1 : -1;
    return 0;
  });
  cmRender();
}

function cmSortBy(key) {
  if (CM.sortKey === key) {
    CM.sortAsc = !CM.sortAsc;
  } else {
    CM.sortKey = key;
    CM.sortAsc = key !== 'updatedAt'; // 更新日はデフォルト降順、他は昇順
  }
  cmApplySort();
}

function cmOnSearch(val) {
  CM.query = val.trim();
  CM.checked = new Set();
  // IME変換中（未確定文字列を編集している間）はcmApplyFilter()→cmRender()を走らせない。
  // cmRender()は#main全体をinnerHTMLで作り直すため、検索欄DOMごと再生成されてしまい、
  // ブラウザの変換セッションが強制的に断ち切られる（customer-search-bug-report.md参照）。
  // 変換中でなければ（＝半角英数字の通常入力時は）従来通り即座に絞り込みを反映する。
  if (CM.isComposing) return;
  cmApplyFilter();
}

function cmOnCompositionStart() {
  CM.isComposing = true;
}

function cmOnCompositionEnd(val) {
  CM.isComposing = false;
  // 変換確定時点の値で検索を反映する
  cmOnSearch(val);
}

function cmToggleAll(checked) {
  if (checked) {
    CM.filtered.forEach(c => CM.checked.add(c.id !== '' ? c.id : c.name));
  } else {
    CM.checked = new Set();
  }
  cmRender();
}

function cmToggleRow(key, checked) {
  if (checked) CM.checked.add(key);
  else CM.checked.delete(key);
  cmRender();
}

function cmOpenSelected() {
  if (CM.checked.size !== 1) return;
  const key = [...CM.checked][0];
  const c = CM.list.find(x => (x.id || x.name) === key);
  if (!c) return;
  navigate('customerReply');
  // 顧客返信タブが描画された後に検索フィールドをセット
  setTimeout(() => {
    const input = document.getElementById('reply-name');
    if (!input) return;
    const label = c.id ? `${c.id}　${c.name} 様` : `${c.name} 様`;
    input.value = label;
    onNameInput(label);
  }, 300);
}

function cmRender() {
  const checkedCount = CM.checked.size;
  const allChecked = CM.filtered.length > 0 && CM.filtered.every(c => CM.checked.has(c.id !== '' ? c.id : c.name));

  function sortIcon(key) {
    if (CM.sortKey !== key) return '<span style="color:#ccc">↕</span>';
    return CM.sortAsc ? '↑' : '↓';
  }

  // 再描画のたびに#main配下のDOMを丸ごと作り直すため、フォーカス中の要素（検索欄など）が
  // 新しいDOMノードに置き換わり、フォーカスが失われてしまう（不具合1の原因）。
  // 再描画前にフォーカス位置・カーソル位置を記録し、再描画後に同じidの要素へ復元する。
  const mainEl = document.getElementById('main');
  const active = document.activeElement;
  const shouldRestoreFocus = !!(active && mainEl && mainEl.contains(active) && active.id);
  const focusId = shouldRestoreFocus ? active.id : null;
  const selStart = shouldRestoreFocus && typeof active.selectionStart === 'number' ? active.selectionStart : null;
  const selEnd = shouldRestoreFocus && typeof active.selectionEnd === 'number' ? active.selectionEnd : null;

  }).join('');

  const thStyle = 'padding:8px;text-align:left;font-size:13px;color:var(--text-muted);cursor:pointer;user-select:none;white-space:nowrap';

  document.getElementById('main').innerHTML = `
    <div class="section-header" style="display:flex;justify-content:space-between;align-items:center">
      <h2>顧客管理</h2>
      <button class="btn btn-primary" onclick="showCustomerModal(null)">＋ 新規登録</button>

      >
      <button class="btn" onclick="document.getElementById('cm-search').value='';cmOnSearch('')">クリア</button>

    <div style="display:flex;align-items:center;gap:12px;margin-bottom:8px;font-size:13px">
      <label style="display:flex;align-items:center;gap:6px;cursor:pointer">

            <th style="${thStyle}" onclick="cmSortBy('updatedAt')">更新日 ${sortIcon('updatedAt')}</th>
            <th style="${thStyle}" onclick="cmSortBy('preferBrands')">主な好み ${sortIcon('preferBrands')}</th>

      全${CM.list.length}件中 ${CM.filtered.length}件表示
    </div>
  `;

  // フォーカスの復元（不具合1対策）。テキスト系入力の場合はカーソル位置も復元する。
  if (focusId) {
    const el = document.getElementById(focusId);
    if (el) {
      el.focus();
      const canSelect = el.tagName === 'TEXTAREA' || (el.tagName === 'INPUT' && /^(text|search|tel|url|password)$/.test(el.type));
      if (canSelect && selStart !== null && selEnd !== null) {
        try { el.setSelectionRange(selStart, selEnd); } catch (e) {}
      }
    }
  }

  // compositionstart/compositionendは標準のHTMLイベントハンドラ属性（oncompositionstart等）として
  // 認識されないため、inline属性ではなくaddEventListener()で明示的にバインドする必要がある
  // （インライン属性のままだと発火せず、IME対応が機能しない）。再描画のたびに要素が
  // 作り直されるため、毎回このタイミングで登録し直す。
  const searchInput = document.getElementById('cm-search');
  if (searchInput) {
    searchInput.addEventListener('compositionstart', cmOnCompositionStart);
    searchInput.addEventListener('compositionend', () => cmOnCompositionEnd(searchInput.value));
  }

// ── 商品カタログ（調査部門兼WEBカタログ作成チーム）Phase1 ──────────────────────

const CATALOG_CATEGORIES = ['革靴・シューズ', 'バッグ', '財布・革小物', '衣類', 'アクセサリー', 'その他'];

// カテゴリー別のスペック候補項目（catalog-production-team-master-design.md参照）。
// 「その他」は固定候補を持たず、AIの判断に委ねる（ただし店舗提供情報のみという制約は変わらない）。
const CATALOG_SPEC_CANDIDATES = {

  'アクセサリー': ['品番', '素材', 'カラー', 'サイズ', '重量', 'モチーフ', '仕上げ', '付属品', '生産国', '特徴'],
};

// 関連リンク：一覧・詳細モーダルの両方で共有する表示順・ラベル定義（catalog-related-links-implementation-report.md参照）。
const CATALOG_LINK_FIELDS = [
  { key: 'catalogUrl', label: 'WEBカタログ' },
  { key: 'referenceUrl', label: '参考ページ' },
  { key: 'relatedBlogUrl', label: '関連Blog' },
];

// http:// / https:// で始まるURLのみ許可する（javascript:・data:・file:等を拒否）。空文字は未入力として許可する。
function isValidCatalogLinkUrl(url) {
  if (!url) return true;
  return /^https?:\/\//i.test(url);
}

// price_jpy（税込販売価格）の表示用フォーマット。未入力・null・undefined・空文字・0以下・
// 数値として不正な値はすべて空文字を返す＝呼び出し側で価格行自体を表示しない判定に使う
// （catalog-card-thumbnail-price-report.md参照）。カード描画側でフォーマット処理を
// 重複実装しないよう、この関数だけを経由する。DBの保存形式（price_jpy整数列）には触れない。
function formatCatalogPriceJpy(value) {
  const price = Number(value);
  if (!Number.isFinite(price) || price <= 0) return '';
  return `税込 ¥${Math.round(price).toLocaleString('ja-JP')}`;
}

// ── 掲載状態の判定（WEB／Google）──────────────────────
// WEB掲載状態とGoogle掲載状態は別概念のため、判定関数を完全に分離する
// （catalog-google-status-badges-and-layout-report.md参照）。一覧タグ・件数集計・
// フィルターの全箇所がこれらの関数だけを見て、判定ロジックを重複実装しない。

// WEB掲載状態：catalog_url（WEBカタログURL）の有無のみで判定する。reference_url・
// related_blog_urlは判定に含めない（従来通りリンクボタン表示のみに使う）。
// 空文字・null・undefined・空白のみはすべて「未入力」として扱う。
function getCatalogWebPublicationStatus(product) {
  const catalogUrl = typeof product?.catalogUrl === 'string' ? product.catalogUrl.trim() : '';
  return catalogUrl ? { key: 'published', label: 'WEB掲載済' } : { key: 'unpublished', label: '未掲載' };
}

// Google掲載状態：現段階ではgoogle_publishチェックの有無のみで判定する。'published'・'error'は
// 実際のGMC連携（フィード送信・同期）を実装するまで判定できないため、今は返さない
// （catalog_key構造は将来の拡張を見越して用意してある）。
function getCatalogGooglePublicationStatus(product) {
  if (product?.googlePublish === true) return { key: 'scheduled', label: 'Google掲載予定' };
  return { key: 'unset', label: 'Google未設定' };
}

// カード・フィルター・件数集計が共通で使う、1商品分の状態一式。
function getCatalogPublicationBadges(product) {
  return {
    web: getCatalogWebPublicationStatus(product),
    google: getCatalogGooglePublicationStatus(product),
  };
}

// 既存呼び出し元（他フェーズのコード）との互換のため、単純な真偽値判定は薄いラッパーとして残す。
// 判定ロジック本体はgetCatalogWebPublicationStatus()のみに存在する。
function isCatalogProductUnpublished(product) {
  return getCatalogWebPublicationStatus(product).key === 'unpublished';
}

// 状態フィルター（'all'／'unpublished'／'google_scheduled'／'google_published'／'google_error'）の
// 判定。一覧タグの状態キー（unpublished/published/unset/scheduled/published/error）と対応させる。
function matchesCatalogStatusFilter(product, filterValue) {
  if (filterValue === 'unpublished') return getCatalogWebPublicationStatus(product).key === 'unpublished';
  if (filterValue === 'google_scheduled') return getCatalogGooglePublicationStatus(product).key === 'scheduled';
  // Google掲載済・Googleエラーは実連携（フィード送信・同期）をまだ実装していないため、
  // 判定できる実データが存在しない＝常に非該当とする（catalog-google-merchant-center-phase1-report.md参照）。
  if (filterValue === 'google_published') return false;
  if (filterValue === 'google_error') return false;
  return true; // 'all'
}

// 検索（ブランド・商品名・品番の部分一致）の判定。normalizedQueryは呼び出し側で
// 1回だけ正規化したものを渡す（商品ごとに正規化し直さない。既存のパフォーマンス特性を維持）。
function matchesCatalogSearch(product, normalizedQuery) {
  if (!normalizedQuery) return true;
  const brand = (product.brand || '').normalize('NFKC').toLowerCase();
  const productName = (product.productName || '').normalize('NFKC').toLowerCase();
  const modelNumber = (product.modelNumber || '').normalize('NFKC').toLowerCase();
  return brand.includes(normalizedQuery) || productName.includes(normalizedQuery) || modelNumber.includes(normalizedQuery);
}

// ── 一覧の並び替え（catalog-sort-function-report.md参照）──────────────────────
// 一覧表示に使っているのと同じc.updatedAt（editorial同様、DBのupdated_atをそのまま
// 保持したもの）を更新日ソートの基準にする。日時として解釈できない値はNaNを返し、
// 呼び出し側の比較関数で「新しい順・古い順のどちらでも末尾へ」扱う。
function catalogUpdatedAtTime(product) {
  const t = product?.updatedAt ? new Date(product.updatedAt).getTime() : NaN;
  return Number.isFinite(t) ? t : NaN;
}
function compareCatalogUpdatedAtDesc(a, b) {
  const ta = catalogUpdatedAtTime(a), tb = catalogUpdatedAtTime(b);
  if (!Number.isFinite(ta) && !Number.isFinite(tb)) return 0;
  if (!Number.isFinite(ta)) return 1;
  if (!Number.isFinite(tb)) return -1;
  return tb - ta;
}
function compareCatalogUpdatedAtAsc(a, b) {
  const ta = catalogUpdatedAtTime(a), tb = catalogUpdatedAtTime(b);
  if (!Number.isFinite(ta) && !Number.isFinite(tb)) return 0;
  if (!Number.isFinite(ta)) return 1;
  if (!Number.isFinite(tb)) return -1;
  return ta - tb;
}

// 日本語・英字を含む自然な昇順比較。空文字（未入力）は必ず末尾へ回す。
function catalogCompareText(a, b) {
  const av = a || '', bv = b || '';
  if (!av && !bv) return 0;
  if (!av) return 1;
  if (!bv) return -1;
  return av.localeCompare(bv, 'ja', { numeric: true, sensitivity: 'base' });
}
// ブランド名・商品名が同じ場合は品番を第2比較条件にする。
function compareCatalogBrandAsc(a, b) {
  const primary = catalogCompareText(a.brand, b.brand);
  return primary !== 0 ? primary : catalogCompareText(a.modelNumber, b.modelNumber);
}
function compareCatalogNameAsc(a, b) {
  const primary = catalogCompareText(a.productName, b.productName);
  return primary !== 0 ? primary : catalogCompareText(a.modelNumber, b.modelNumber);
}

// 価格ソートの対象になる「有効な価格」の判定。formatCatalogPriceJpy()が価格行を
// 表示するかどうかの判定と同じ基準（数値として有効かつ0より大きい）に揃える。
function isCatalogPriceValid(product) {
  const p = Number(product?.priceJpy);
  return Number.isFinite(p) && p > 0;
}
function compareCatalogPriceDesc(a, b) {
  const av = isCatalogPriceValid(a), bv = isCatalogPriceValid(b);
  if (!av && !bv) return 0;
  if (!av) return 1;
  if (!bv) return -1;
  return Number(b.priceJpy) - Number(a.priceJpy);
}
function compareCatalogPriceAsc(a, b) {
  const av = isCatalogPriceValid(a), bv = isCatalogPriceValid(b);
  if (!av && !bv) return 0;
  if (!av) return 1;
  if (!bv) return -1;
  return Number(a.priceJpy) - Number(b.priceJpy);
}

const CATALOG_SORT_OPTIONS = [
  ['updated_desc', '更新日：新しい順'],
  ['updated_asc', '更新日：古い順'],
  ['brand_asc', 'ブランド名順'],
  ['name_asc', '商品名順'],
  ['price_desc', '価格：高い順'],
  ['price_asc', '価格：安い順'],
];

// 元の配列は変更せず、コピー配列をソートして返す。
function sortCatalogProducts(products, sortValue) {
  const sorted = [...products];
  switch (sortValue) {
    case 'updated_asc': return sorted.sort(compareCatalogUpdatedAtAsc);
    case 'brand_asc': return sorted.sort(compareCatalogBrandAsc);
    case 'name_asc': return sorted.sort(compareCatalogNameAsc);
    case 'price_desc': return sorted.sort(compareCatalogPriceDesc);
    case 'price_asc': return sorted.sort(compareCatalogPriceAsc);
    case 'updated_desc':
    default:
      return sorted.sort(compareCatalogUpdatedAtDesc);
  }
}

// ── ブランドフィルター（catalog-brand-filter-report.md参照）──────────────────────
// 一覧カードのブランド名表示（c.brand）と同じ値を使う。固定値は一切持たず、商品データから
// 動的に選択肢を生成する。前後の空白を除去し、空文字・null・undefinedは除外する。
function getCatalogBrandOptions(products) {
  const brands = new Set();
  (products || []).forEach(p => {
    const b = (p?.brand || '').trim();
    if (b) brands.add(b);
  });
  // ソート機能で確立済みのcatalogCompareText()と同じ自然順（日本語・英字対応）で並べる。
  return [...brands].sort((a, b) => catalogCompareText(a, b));
}

// 'all'（すべてのブランド）の場合は常に一致。それ以外は前後空白を除去したブランド名の完全一致。
function matchesCatalogBrand(product, brandValue) {
  if (!brandValue || brandValue === 'all') return true;
  return (product?.brand || '').trim() === brandValue;
}

// 状態タグの配色。'published'はWEB掲載済・将来のGoogle掲載済の両方で共用する（緑系）。
// 'unpublished'（未掲載）は既存の.idea-plan-badgeデフォルト（オレンジ系）をそのまま使うため
// ここには含めない＝スタイルを上書きしない。

  unset: 'background:#f1f5f9;color:#64748b',        // Google未設定：グレー系
  scheduled: 'background:#eef2ff;color:#4f46e5',    // Google掲載予定：青紫系
  error: 'background:#fef2f2;color:#ef4444',        // Googleエラー：赤系
};
function renderCatalogStatusBadge(status) {
  const styleOverride = CATALOG_STATUS_BADGE_STYLES[status.key];
  return `<span class="idea-plan-badge" style="margin:0${styleOverride ? ';' + styleOverride : ''}">${esc(status.label)}</span>`;

  { color: 'Gray', keywords: ['GRAY', 'GREY', 'GRIGIO', 'グレー', '灰'] },
  { color: 'Red', keywords: ['RED', 'ROSSO', 'レッド', '赤'] },
  { color: 'Green', keywords: ['GREEN', 'VERDE', 'グリーン', '緑'] },
  { color: 'Beige', keywords: ['BEIGE', 'ベージュ'] },
  { color: 'Yellow', keywords: ['YELLOW', 'GIALLO', 'イエロー', '黄'] },
  { color: 'Orange', keywords: ['ORANGE', 'ARANCIO', 'オレンジ'] },
  { color: 'Purple', keywords: ['PURPLE', 'VIOLA', 'パープル', '紫'] },
  { color: 'Pink', keywords: ['PINK', 'ROSA', 'ピンク'] },
  { color: 'Gold', keywords: ['GOLD', 'ORO', 'ゴールド', '金'] },
  { color: 'Silver', keywords: ['SILVER', 'ARGENTO', 'シルバー', '銀'] },
];

// 採用済みスペック項目（specData）の項目名・値をまとめて検索対象テキストへ変換する。
function flattenCatalogSpecDataToText(specData) {
  if (!Array.isArray(specData)) return '';
  return specData.map(row => `${row.item || ''} ${row.value || ''}`).join('\n');
}

// 「商品解説・スペック」に相当する既存フィールド一式から、既知パターンで色を推定する。
// 不明な場合は空文字を返す（未設定のまま。GMC送信時は必須ではないため許容する）。
function guessCatalogGoogleColor(item) {
  const sourceText = [
    item.knownSpecs,
    item.supplementaryInfo,
    item.chatgptResearchResult,
    item.description1Body,
    item.description2Body,
    item.description3Body,
    flattenCatalogSpecDataToText(item.specData),
  ].filter(Boolean).join('\n').toUpperCase();
  if (!sourceText) return '';
  for (const pattern of CATALOG_GOOGLE_COLOR_PATTERNS) {
    if (pattern.keywords.some(kw => sourceText.includes(kw.toUpperCase()))) return pattern.color;
  }
  return '';
}

// Google Merchant Centerフィード用項目一式を内部生成する。color/condition/google_product_category
// は商品編集画面で保存された明示的な値をそのまま使用する（catalog-google-merchant-attributes-report.md参照）。
// 以前はcondition固定値'new'・googleCategoryをCATALOG_GOOGLE_CATEGORY_MAPから推測・
// googleColorをguessCatalogGoogleColor()で本文から推測していたが、専用カラムを追加した
// ことで推測は不要になった（CATALOG_GOOGLE_CATEGORY_MAP・guessCatalogGoogleColor()自体は
// 削除せず残置。他で参照する可能性に備える）。brand（既存のブランド名をそのまま使用）・
// mpn（既存の品番をそのまま使用）は変更なし。
function buildCatalogGoogleMerchantFields(item) {
  return {
    googleCategory: item.googleProductCategory || '',
    googleColor: item.color || '',
    condition: item.condition || 'new',
    brand: item.brand || '',
    mpn: item.modelNumber || '',
  };
}

// ── Google Merchant Center CSV出力（Phase1：CSV生成のみ。実連携・自動送信は行わない）──
// catalog-google-merchant-csv-export-report.md参照。すべてブラウザ内で完結し、外部APIへの
// 送信は一切行わない。既存データの書き換え・Google掲載状態の変更も行わない。

// 既存スプレッドシートと一致させる列順・日本語ヘッダー（末尾の「色」はGoogle Merchant Center
// 対応強化により追加。末尾の「mpn」はGoogle公式のMPN項目に対応するため追加
// （catalog-google-merchant-mpn-report.md参照）。既存13列の並びは変更せず、末尾に追加するのみに留める。
const CATALOG_GOOGLE_MERCHANT_CSV_HEADERS = ['id', 'タイトル', '概要', '商品リンク', '状態', '価格', '在庫状況', '画像リンク', 'gtin', '製品番号', 'ブランド', 'google 商品カテゴリ', '色', 'mpn'];

// CSV出力候補：Google掲載予定（google_publish===true）の商品のみ。既存の
// getCatalogGooglePublicationStatus()を再利用し、判定を重複実装しない（要件9参照）。
function getCatalogGoogleMerchantCandidates(products) {
  return (products || []).filter(p => getCatalogGooglePublicationStatus(p).key === 'scheduled');
}

// 商品ID：DBの主キー（UUID）を最優先で使用する。一覧の並び順や商品名変更では変化せず、
// 同じ商品を再出力しても常に同じ値になる。UUIDが取得できない場合のみ、品番を含む
// 識別子へフォールバックする（要件5「id」参照）。
function getCatalogMerchantProductId(product) {
  if (product?.id) return String(product.id);
  const model = (product?.modelNumber || '').trim();
  return model ? `catalog-${model}` : '';
}

// タイトル：商品名にブランド名が含まれていなければ「ブランド名 商品名」とする。150文字を
// 超える場合は、単語の区切り（空白）でできるだけ自然に切る（要件5「タイトル」参照）。
function getCatalogMerchantTitle(product) {
  const brand = (product?.brand || '').trim();
  const name = (product?.productName || '').trim();
  let title = name;
  if (brand && name && !name.toUpperCase().includes(brand.toUpperCase())) {
    title = `${brand} ${name}`.trim();
  } else if (!name) {
    title = '';
  }
  if (title.length > 150) {
    const truncated = title.slice(0, 150);
    const lastSpace = truncated.lastIndexOf(' ');
    title = (lastSpace > 100) ? truncated.slice(0, lastSpace) : truncated;
  }
  return title;
}

function stripCatalogHtmlTags(html) {
  return String(html || '').replace(/<[^>]*>/g, '');
}

// 概要：商品説明の取得元は優先順位で決める（1.AI生成済みの商品解説文段落1〜3の結合
// →2.既知スペック→3.ChatGPT調査結果→4.補足情報）。HTMLタグ除去・改行を空白へ変換・
// 連続空白の整理・5000文字上限を行う（要件5「概要」参照）。
function getCatalogMerchantDescription(product) {
  if (!product) return '';
  const candidates = [
    [product.description1Body, product.description2Body, product.description3Body].filter(Boolean).join(' '),
    product.knownSpecs,
    product.chatgptResearchResult,
    product.supplementaryInfo,
  ];
  const raw = candidates.find(c => (c || '').trim()) || '';
  let text = stripCatalogHtmlTags(raw);
  text = text.replace(/\r\n|\r|\n/g, ' ');
  text = text.replace(/\s+/g, ' ').trim();
  if (text.length > 5000) text = text.slice(0, 5000);
  return text;
}

// 画像リンク：一覧サムネイル（Supabase Storageの署名付きURL）はGoogle Merchant Centerの
// 画像リンクには使用できないため使わない。代わりに商品編集画面で手動入力する
// merchant_image_url（外部から常時アクセス可能な公開URL）を使用する
// （catalog-merchant-image-url-report.md参照。catalog-google-merchant-csv-export-report.mdの
// 「未解決事項」で指摘した、非公開バケットにより画像リンクが出力できない問題への対応）。
function isCatalogMerchantPublicImageUrl(url) {
  const u = (url || '').trim();
  if (!u || !/^https?:\/\//i.test(u)) return false; // blob:・data:・相対パス等をまとめて除外
  let parsed;
  try { parsed = new URL(u); } catch (e) { return false; }
  const host = parsed.hostname.toLowerCase();
  if (host === 'localhost' || host === '127.0.0.1' || host.endsWith('.local')) return false;
  // Supabase Storageの署名付きURL（/object/sign/を含む、またはtokenクエリパラメータを持つ）は
  // 一定時間で失効する一時URLのため、恒久的な公開URLとして扱わない。
  if (parsed.pathname.includes('/object/sign/')) return false;
  if (parsed.searchParams.has('token')) return false;
  return true;
}
function getCatalogMerchantImageUrl(product) {
  const url = (product?.merchantImageUrl || '').trim();
  return isCatalogMerchantPublicImageUrl(url) ? url : '';
}

// 価格：「77000 JPY」形式（カンマ・円記号・「税込」なし）。有効性判定は既存の
// isCatalogPriceValid()（価格表示・価格ソートと同じ基準）を再利用する。
function formatCatalogMerchantPrice(product) {
  if (!isCatalogPriceValid(product)) return '';
  return `${Math.round(Number(product.priceJpy))} JPY`;
}

// 候補商品1件ごとに、CSVへ出力可能か（除外理由の有無）と、出力はするが要確認な項目
// （警告）を判定する。除外・警告の条件は要件11のとおり。
function validateCatalogGoogleMerchantProduct(product) {
  const reasons = [];
  const warnings = [];

  if (!getCatalogMerchantProductId(product)) reasons.push('安定した商品IDが取得できません');
  if (!(product?.productName || '').trim()) reasons.push('商品名未入力');

  const catalogUrl = (product?.catalogUrl || '').trim();
  if (!catalogUrl || !/^https?:\/\//i.test(catalogUrl) || !isValidCatalogLinkUrl(catalogUrl)) {
    reasons.push('商品リンク未入力');
  }

  if (!isCatalogPriceValid(product)) reasons.push('価格未入力');
  if (!getCatalogMerchantImageUrl(product)) {
    const rawImageUrl = (product?.merchantImageUrl || '').trim();
    reasons.push(rawImageUrl ? 'Google Merchant画像URLが不正' : 'Google Merchant画像URL未設定');
  }

  if (!getCatalogMerchantDescription(product)) warnings.push('概要（商品説明）未入力');
  if (!(product?.brand || '').trim()) warnings.push('ブランド未入力');
  if (!(product?.modelNumber || '').trim()) warnings.push('製品番号（品番）未入力');
  // gtin保存欄が存在しないため、現段階では常に空欄・常に警告対象（要件5「gtin」参照。
  // 推測値は生成しない）。
  warnings.push('GTIN未登録（保存欄なし）');
  if (!buildCatalogGoogleMerchantFields(product).googleCategory) warnings.push('Google商品カテゴリ未設定');

  return { eligible: reasons.length === 0, reasons, warnings };
}

// 出力対象1件分をCSV列順どおりの配列へ変換する。gtinは保存欄が存在しないため常に空欄
// （要件5「gtin」：品番の代用は行わない）。在庫状況は商品ごとのavailability保存値を出力する
// （catalog-google-merchant-availability-report.md参照。google_publishとは別概念で、
// 除外理由には含めない＝在庫切れでもCSVからは除外せずout_of_stock等として出力する）。
function mapCatalogProductToGoogleMerchantRow(product) {
  const fields = buildCatalogGoogleMerchantFields(product);
  return [
    getCatalogMerchantProductId(product),
    getCatalogMerchantTitle(product),
    getCatalogMerchantDescription(product),
    (product.catalogUrl || '').trim(),
    fields.condition,
    formatCatalogMerchantPrice(product),
    product.availability || 'in_stock',
    getCatalogMerchantImageUrl(product),
    '',
    (product.modelNumber || '').trim(),
    (fields.brand || '').trim(),
    fields.googleCategory,
    fields.googleColor,
    (product.modelNumber || '').trim(),
  ];
}

// RFC 4180相当のCSVセルエスケープ。カンマ・ダブルクォート・改行を含む場合のみ引用符で囲む。
function escapeCatalogCsvValue(value) {
  const text = String(value ?? '').replace(/\r\n|\r|\n/g, ' ');
  if (/[",\n]/.test(text)) {
    return `"${text.replace(/"/g, '""')}"`;
  }
  return text;
}

function buildCatalogGoogleMerchantCsv(rows) {
  const lines = [CATALOG_GOOGLE_MERCHANT_CSV_HEADERS, ...rows].map(row => row.map(escapeCatalogCsvValue).join(','));
  return lines.join('\r\n');
}

// UTF-8 BOM付きでBlobを生成し、ブラウザ内でダウンロードを完結させる（外部送信なし）。
function downloadCatalogGoogleMerchantCsv(csvText, filename) {
  const bom = '﻿';
  const blob = new Blob([bom + csvText], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function catalogGoogleMerchantCsvFilename() {
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `google-merchant-products-${y}${m}${day}.csv`;
}

// 出力前プレビュー（要件2・3）。CatalogLibrary.listは商品カタログ画面の再描画のたびに
// 最新化される（編集保存・削除後は必ずrenderCatalogLibrary()経由で戻るため）ので、
// ここで都度再取得すれば直前の編集内容が確実に反映される（要件10・要件Z参照）。
// CSVはこの時点ではまだ生成・ダウンロードしない（要件2「クリックしても即ダウンロードしない」）。
function showCatalogGoogleMerchantCsvPreview() {
  const candidates = getCatalogGoogleMerchantCandidates(CatalogLibrary.list);
  const results = candidates.map(p => ({ product: p, ...validateCatalogGoogleMerchantProduct(p) }));
  const eligible = results.filter(r => r.eligible);
  const excluded = results.filter(r => !r.eligible);
  const filename = catalogGoogleMerchantCsvFilename();
  // Google Merchant画像URL専用の件数表示（要件6参照）。画像URL以外の理由で除外される商品も
  // 含めて、Google掲載予定の対象全体を「画像URLあり／なし」で数える。
  const withImageUrlCount = candidates.filter(p => !!getCatalogMerchantImageUrl(p)).length;
  const withoutImageUrlCount = candidates.length - withImageUrlCount;

  const excludedListHtml = excluded.length
    ? `<ul style="margin:8px 0 0;padding-left:20px">${excluded.map(r =>
        `<li>${esc(r.product.productName || r.product.brand || '(商品名未入力)')}：${esc(r.reasons.join('・'))}</li>`
      ).join('')}</ul>`
    : '';
  const warnedListHtml = eligible.some(r => r.warnings.length)
    ? `<ul style="margin:8px 0 0;padding-left:20px">${eligible.filter(r => r.warnings.length).map(r =>
        `<li>${esc(r.product.productName || r.product.brand || '(商品名未入力)')}：${esc(r.warnings.join('・'))}（出力はされます）</li>`
      ).join('')}</ul>`
    : '';

  showModal(`
    <h3>Google Merchant CSV 出力前プレビュー</h3>
    <div class="form-group">
      <p>Google掲載予定：${candidates.length}件</p>
      <p>CSV出力可能：${eligible.length}件</p>
      <p>除外：${excluded.length}件</p>
      <p>公開画像URLあり：${withImageUrlCount}件</p>
      <p>公開画像URLなし：${withoutImageUrlCount}件</p>
    </div>
    ${excluded.length ? `<div class="form-group"><label>除外商品と理由</label>${excludedListHtml}</div>` : ''}
    ${warnedListHtml ? `<div class="form-group"><label>要確認（出力はされます）</label>${warnedListHtml}</div>` : ''}
    <div class="form-group"><label>出力ファイル名</label><input value="${esc(filename)}" readonly></div>
    ${eligible.length === 0 ? `<p style="color:var(--danger)">CSV出力可能な商品がないため、ダウンロードできません。</p>` : ''}
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">キャンセル</button>
      <button class="btn btn-primary" ${eligible.length === 0 ? 'disabled' : ''} onclick="downloadCatalogGoogleMerchantCsvFromPreview()">CSVをダウンロード</button>
    </div>
  `);
}

// プレビューと同じ抽出・検証条件で再度組み立ててからダウンロードする（プレビューと
// 実際の出力内容が食い違わないようにするため、同じ関数群を再利用する）。
// ダウンロードのみではGoogle掲載状態を一切変更しない（要件12・Y参照）。
function downloadCatalogGoogleMerchantCsvFromPreview() {
  const candidates = getCatalogGoogleMerchantCandidates(CatalogLibrary.list);
  const eligible = candidates.filter(p => validateCatalogGoogleMerchantProduct(p).eligible);
  if (!eligible.length) return;
  const rows = eligible.map(mapCatalogProductToGoogleMerchantRow);
  const csv = buildCatalogGoogleMerchantCsv(rows);
  downloadCatalogGoogleMerchantCsv(csv, catalogGoogleMerchantCsvFilename());
  closeModal();
}

// 入力済みのURLだけをボタンとして表示する共通ヘルパー。一覧カード・詳細モーダルの両方が使用する。
// カード全体クリックによる詳細表示へ伝播しないよう、各ボタンでevent.stopPropagation()を行う。
function renderCatalogLinkButtons(item) {
  // 空白のみの値をボタン化しない（isCatalogProductUnpublished()と同じ「空」の扱いに揃える。
  // 保存経路（saveCatalogProduct()）は常にtrimして保存するため通常は発生しないが、念のため
  // 未掲載判定と矛盾しないようにする。catalog-unpublished-highlight-and-filter-report.md参照）。
  const links = CATALOG_LINK_FIELDS.filter(f => (item[f.key] || '').trim());
  if (!links.length) return '';
  return `<div class="catalog-library-links">${links.map(f =>
    `<a class="catalog-link-btn" href="${esc(item[f.key])}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">${esc(f.label)}</a>`
  ).join('')}</div>`;
}

// catalog_products専用の軽量ヘルパー。ArticleStore/ReplyHistoryStoreと同じ理由
// （既存Storeを肥大化させない）で分離する。Phase1ではspec_html等のPhase2用列には一切触れない。
const CatalogStore = {
  async add(item) {
    const row = {
      user_id: App.user.id,
      brand: item.brand || '',
      product_name: item.productName || '',
      model_number: item.modelNumber || '',
      category: item.category || '',
      known_specs: item.knownSpecs || '',
      supplementary_info: item.supplementaryInfo || '',
      reference_urls: item.referenceUrls || '',
      research_notes_input: item.researchNotesInput || '',
      chatgpt_research_result: item.chatgptResearchResult || '',
      catalog_url: item.catalogUrl || '',
      reference_url: item.referenceUrl || '',
      related_blog_url: item.relatedBlogUrl || '',
      // Google Merchant CSV出力用の公開画像URL（手動入力）。Supabase Storageの署名付きURLは
      // CSVの画像リンクに使用できないため、外部から常時アクセス可能なURLを別途保存する
      // （catalog-merchant-image-url-report.md参照）。
      merchant_image_url: item.merchantImageUrl || '',
      // Google Merchant Center対応強化：color/condition/google_product_category
      // （catalog-google-merchant-attributes-report.md参照）。ブランドは既存のbrandカラムを使用。
      color: item.color || '',
      condition: item.condition || 'new',
      google_product_category: item.googleProductCategory || '187',
      // Google Merchant Center対応強化：在庫状況（catalog-google-merchant-availability-report.md参照）。
      // google_publish（Google掲載対象トグル）とは別概念のため、独立したカラムとして扱う。
      availability: item.availability || 'in_stock',
      // Google Merchant Center連携Phase1：DBカラム追加のみ、実連携はまだ行わない
      // （catalog-google-merchant-center-phase1-report.md参照）。
      price_jpy: (item.priceJpy === null || item.priceJpy === undefined) ? null : item.priceJpy,
      google_publish: !!item.googlePublish,
      edit_history: [{ editedAt: new Date().toISOString(), summary: '新規登録' }],
    };
    const { data, error } = await sb.from('catalog_products').insert(row).select().single();
    if (error) { console.error(error); return null; }
    return CatalogStore._fromDb(data);
  },
  async list() {
    const { data, error } = await sb.from('catalog_products').select('*').order('created_at', { ascending: false });
    if (error) { console.error(error); return []; }
    return data.map(CatalogStore._fromDb);
  },
  async find(id) {
    const { data, error } = await sb.from('catalog_products').select('*').eq('id', id).single();
    if (error) return null;
    return CatalogStore._fromDb(data);
  },
  // 編集履歴（edit_history）は既存データを読み戻してから追記する。DBトリガーは使わず、
  // updated_atと同じくJS側で明示的に管理する方式で統一する（catalog-production-phase1-readiness.md参照）。
  async _appendEditHistory(id, summary) {
    const { data, error } = await sb.from('catalog_products').select('edit_history').eq('id', id).single();
    const history = (!error && Array.isArray(data?.edit_history)) ? data.edit_history : [];
    return [...history, { editedAt: new Date().toISOString(), summary }];
  },
  async update(id, item) {
    const partial = {
      brand: item.brand || '',
      product_name: item.productName || '',
      model_number: item.modelNumber || '',
      category: item.category || '',
      known_specs: item.knownSpecs || '',
      supplementary_info: item.supplementaryInfo || '',
      reference_urls: item.referenceUrls || '',
      research_notes_input: item.researchNotesInput || '',
      chatgpt_research_result: item.chatgptResearchResult || '',
      catalog_url: item.catalogUrl || '',
      reference_url: item.referenceUrl || '',
      related_blog_url: item.relatedBlogUrl || '',
      merchant_image_url: item.merchantImageUrl || '',
      color: item.color || '',
      condition: item.condition || 'new',
      google_product_category: item.googleProductCategory || '187',
      availability: item.availability || 'in_stock',
      price_jpy: (item.priceJpy === null || item.priceJpy === undefined) ? null : item.priceJpy,
      google_publish: !!item.googlePublish,
      edit_history: await CatalogStore._appendEditHistory(id, '入力内容を編集'),
    };
    // updated_atはDBトリガーを使わずJS側で明示的に設定する方式（既存4テーブルと同じ統一方式。
    // catalog-production-phase1-readiness.md 16節参照）。update系メソッドは必ずこれを含めること。
    partial.updated_at = new Date().toISOString();
    const { error } = await sb.from('catalog_products').update(partial).eq('id', id);
    if (error) { console.error(error); return false; }
    return true;
  },
  async remove(id) {
    // 商品削除時、Storage上の写真ファイルが孤立して残らないよう、DB行の削除前に
    // 紐づく写真をStorageから削除する（catalog_product_photosの行自体はon delete cascadeで
    // 自動的に削除されるため、ここではStorage側の実ファイルだけを明示的に削除すればよい。
    // catalog-production-phase3a1-storage-design.md参照）。Storage削除が失敗しても、
    // DB削除自体は続行する（孤立ファイルは低コストで後から回収可能な問題のため）。
    const photos = await CatalogPhotoStore.list(id);
    if (photos.length) {

    const editHistory = await CatalogStore._appendEditHistory(id, `評価を★${rating}に変更`);

      .update({ rating, edit_history: editHistory, updated_at: new Date().toISOString() })
      .eq('id', id);

  // 一覧カードの「Google掲載対象」チェックボックス専用の軽量更新。updateRating()と同じ理由で
  // update()（フォーム全項目の一括保存）は再利用せず、この1項目だけをUPDATEする
  // （catalog-library-google-target-toggle-report.md参照。他の未保存編集を巻き込まない）。
  // 【設計メモ】_appendEditHistory()は「読み取り→追記→書き込み」の3ステップで、間に他の

  // 対応していない。複数ユーザー・同時編集に対応する場合は、この読み取り→書き込みを
  // 1回のDB往復にまとめたRPC化が望ましい（将来対応）。
  async setGooglePublish(id, googlePublish) {

    const { error } = await sb.from('catalog_products')

  // Phase2-A：AI生成結果（catalog_products_table.sqlのPhase2用カラム）の保存。
  // Phase1のupdate()には一切手を加えず、完全に別メソッドとして分離する

  // field_review_status（採用/修正採用/不採用）はPhase2-Aでは未実装のため書き込まない。
  async saveGenerationResult(id, payload) {
    const editHistory = await CatalogStore._appendEditHistory(id, 'AI生成結果を保存');

  // Phase3-A3：写真解析結果の保存。AI原稿生成（saveGenerationResult）とは完全に独立した列
  // （photo_analysis_result）に保存し、既存の生成結果・spec_data等には一切触れない

  // 再解析のたびに最新の結果で上書きする（履歴は残さない）。

  _fromDb(r) {

      manuallyEditedFields: (r.manually_edited_fields && typeof r.manually_edited_fields === 'object') ? r.manually_edited_fields : {},

// ── Phase3-A2：商品写真アップロード（catalog-production-phase3a1-storage-design.md参照） ──
// Claude画像解析・写真からのスペック抽出・generateCatalogSpecとの連携はまだ行わない。

const CATALOG_PHOTO_BUCKET = 'catalog-photos';
const CATALOG_PHOTO_MAX_COUNT = 6;
const CATALOG_PHOTO_MAX_FILE_SIZE = 8 * 1024 * 1024;
const CATALOG_PHOTO_MAX_DIMENSION = 1600;
const CATALOG_PHOTO_JPEG_QUALITY = 0.8;
const CATALOG_PHOTO_ALLOWED_MIME = ['image/jpeg', 'image/png', 'image/webp'];
const CATALOG_PHOTO_SIGNED_URL_EXPIRY = 3600;

// catalog_product_photos専用の軽量ヘルパー。CatalogStoreと同じ理由（既存Storeを肥大化させない）で分離する。
const CatalogPhotoStore = {
  async add(catalogProductId, meta) {
    const row = {
      user_id: App.user.id,
      catalog_product_id: catalogProductId,
      storage_path: meta.storagePath,
      file_name: meta.fileName || '',
      mime_type: meta.mimeType || '',
      width: meta.width,
      height: meta.height,
      file_size: meta.fileSize,
      sort_order: meta.sortOrder,
      is_primary: !!meta.isPrimary,
    };
    // RLS違反の切り分け用診断ログ（catalog-production-phase3a2-photo-upload-rls-root-cause-report.md参照）。
    // insertUserIdがauthUserIdと一致しているのに失敗する場合、catalog_product_photos自体のRLSではなく
    // 別の原因（Storage側のRLS等）である可能性が高い。
    console.log({
      currentUser: App.user,
      authUserId: App.user?.id,
      insertUserId: row.user_id,
      catalogProductId: row.catalog_product_id,
    });
    const { data, error } = await sb.from('catalog_product_photos').insert(row).select().single();
    if (error) { console.error('[catalog_product_photos insert error]', error); return null; }
    return CatalogPhotoStore._fromDb(data);
  },
  async list(catalogProductId) {
    const { data, error } = await sb.from('catalog_product_photos')
      .select('*').eq('catalog_product_id', catalogProductId).order('sort_order', { ascending: true });
    if (error) { console.error(error); return []; }
    return data.map(CatalogPhotoStore._fromDb);
  },
  // 一覧画面のサムネイル用：複数商品分のstorage_pathを1回のクエリでまとめて取得し、
  // 商品ごとにis_primary優先・なければsort_order最小の1枚のパスだけを返す（N+1回避。
  // catalog-library-thumbnail-implementation-report.md参照）。
  async primaryOrFirstPathsForProducts(catalogProductIds) {
    if (!catalogProductIds || !catalogProductIds.length) return {};
    const { data, error } = await sb.from('catalog_product_photos')
      .select('catalog_product_id, storage_path, is_primary, sort_order')
      .eq('user_id', App.user.id)
      .in('catalog_product_id', catalogProductIds)
      .order('sort_order', { ascending: true });
    if (error) { console.error(error); return {}; }
    const chosen = {};
    (data || []).forEach(r => {
      const cur = chosen[r.catalog_product_id];
      if (!cur || (!cur.is_primary && r.is_primary)) chosen[r.catalog_product_id] = r;
    });
    const result = {};
    Object.keys(chosen).forEach(pid => { result[pid] = chosen[pid].storage_path; });
    return result;
  },
  async remove(id) {
    const { error } = await sb.from('catalog_product_photos').delete().eq('id', id);
    if (error) { console.error(error); return false; }
    return true;
  },
  // is_primaryは1商品につき1枚だけ（catalog_product_photos_primary_uniqueの部分ユニークインデックス）のため、
  // 既存のメインを先に解除してから新しいメインを設定する（2回のUPDATEの間はどちらもfalseになるだけで、
  // ユニーク制約には抵触しない）。
  async setPrimary(catalogProductId, id) {
    await sb.from('catalog_product_photos')
      .update({ is_primary: false, updated_at: new Date().toISOString() })
      .eq('catalog_product_id', catalogProductId).eq('is_primary', true);
    const { error } = await sb.from('catalog_product_photos')
      .update({ is_primary: true, updated_at: new Date().toISOString() })
      .eq('id', id);
    if (error) { console.error(error); return false; }
    return true;
  },
  // Phase3-A3：写真解析に使われたかどうかの状態のみを更新する。解析結果の内容自体は
  // 現行スキーマに保存先がないため保存しない（catalog-production-phase3a3-image-analysis-report.md参照）。
  async updateAnalysisStatus(id, status) {
    const { error } = await sb.from('catalog_product_photos')
      .update({ analysis_status: status, updated_at: new Date().toISOString() })
      .eq('id', id);
    if (error) { console.error(error); return false; }
    return true;
  },
  _fromDb(r) {
    return {
      id: r.id,
      catalogProductId: r.catalog_product_id,
      storagePath: r.storage_path,
      fileName: r.file_name || '',
      mimeType: r.mime_type || '',
      width: r.width,
      height: r.height,
      fileSize: r.file_size,
      sortOrder: r.sort_order,
      isPrimary: !!r.is_primary,
      role: r.role || '',
      analysisStatus: r.analysis_status || 'unanalyzed',
      createdAt: r.created_at,
      updatedAt: r.updated_at,
    };
  },
};

// 画像ファイルをブラウザ側でリサイズ・JPEG統一圧縮する。
// createImageBitmapのimageOrientation指定でEXIFの向きを自動補正し、Canvas再エンコードにより
// 位置情報等のEXIFメタデータも副次的にすべて除去される（catalog-production-phase3a-photo-readiness.md 2章・13章参照）。
async function processCatalogPhotoFile(file) {
  if (!CATALOG_PHOTO_ALLOWED_MIME.includes(file.type)) {
    throw new Error(`対応していない形式です（${file.name}）。JPEG・PNG・WebPのみ対応しています。HEIC形式は変換してからアップロードしてください。`);
  }
  if (file.size > CATALOG_PHOTO_MAX_FILE_SIZE) {
    throw new Error(`ファイルサイズが大きすぎます（${file.name}）。1枚${CATALOG_PHOTO_MAX_FILE_SIZE / 1024 / 1024}MBまでです。`);
  }
  const bitmap = await createImageBitmap(file, { imageOrientation: 'from-image' });
  const scale = Math.min(1, CATALOG_PHOTO_MAX_DIMENSION / Math.max(bitmap.width, bitmap.height));
  const width = Math.round(bitmap.width * scale);
  const height = Math.round(bitmap.height * scale);
  const canvas = document.createElement('canvas');
  canvas.width = width;
  canvas.height = height;
  canvas.getContext('2d').drawImage(bitmap, 0, 0, width, height);
  const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', CATALOG_PHOTO_JPEG_QUALITY));
  return { blob, width, height, fileSize: blob.size, fileName: file.name };
}

// 前処理済み（リサイズ・圧縮済み）の画像をStorage・catalog_product_photosへ保存する実処理本体。
// 新規登録時の一時写真キュー（既に選択時点で前処理済み）と、編集画面での即時アップロードの
// 両方から共有する（catalog-production-phase3a2-new-product-photo-flow-report.md参照）。
async function uploadProcessedCatalogPhoto(catalogProductId, processed, sortOrder, isPrimary) {
  const path = `${App.user.id}/${catalogProductId}/${crypto.randomUUID()}.jpg`;
  // Storage(storage.objects)への書き込みと、catalog_product_photosへのDB INSERTは別の権限チェックを
  // 経由するため、失敗した段階をエラーメッセージ・ログの両方で明確に切り分ける
  // （catalog-production-phase3a2-photo-upload-rls-root-cause-report.md参照）。
  const { error: uploadError } = await sb.storage.from(CATALOG_PHOTO_BUCKET)
    .upload(path, processed.blob, { contentType: 'image/jpeg' });
  if (uploadError) {
    console.error('[Storage upload error]', uploadError);
    throw new Error(`Storageへのアップロードに失敗しました：${uploadError.message}`);
  }
  const saved = await CatalogPhotoStore.add(catalogProductId, {
    storagePath: path,
    fileName: processed.fileName,
    mimeType: 'image/jpeg',
    width: processed.width,
    height: processed.height,
    fileSize: processed.fileSize,
    sortOrder,
    isPrimary,
  });
  if (!saved) throw new Error('catalog_product_photosへの保存に失敗しました。');
  return saved;
}

async function uploadCatalogPhoto(catalogProductId, file, sortOrder, isPrimary) {
  const processed = await processCatalogPhotoFile(file);
  return uploadProcessedCatalogPhoto(catalogProductId, processed, sortOrder, isPrimary);
}

// ── ブログ書庫サムネイル：非公開の専用バケット（editorial-thumbnails）を使用する ──────────
// 商品カタログの写真処理（processCatalogPhotoFile：リサイズ・JPEG統一圧縮・EXIF除去）・
