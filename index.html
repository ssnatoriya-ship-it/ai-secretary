<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI秘書</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<style>
.auth-container {
  max-width: 400px;
  margin: 80px auto;
  padding: 32px;
  background: var(--card);
  border-radius: 16px;
  border: 1px solid var(--border);
}
.auth-container h2 { text-align: center; margin-bottom: 24px; font-size: 22px; }
.auth-toggle { text-align: center; margin-top: 16px; font-size: 14px; color: var(--text-muted); }
.auth-toggle a { color: var(--primary); cursor: pointer; text-decoration: underline; }
.auth-error { color: var(--danger); font-size: 13px; margin-bottom: 12px; text-align: center; }
.user-info { font-size: 13px; color: var(--text-muted); margin-left: auto; display: flex; align-items: center; gap: 8px; }
.user-info button { background: none; border: 1px solid rgba(255,255,255,0.3); color: white; padding: 4px 10px; border-radius: 6px; cursor: pointer; font-size: 12px; }
.loading-screen { text-align: center; padding: 80px 20px; color: var(--text-muted); font-size: 16px; }

:root {
  --primary: #4f46e5;
  --primary-light: #818cf8;
  --bg: #f8fafc;
  --card: #ffffff;
  --text: #1e293b;
  --text-muted: #64748b;
  --border: #e2e8f0;
  --danger: #ef4444;
  --success: #22c55e;
  --warning: #f59e0b;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
}

header {
  background: var(--primary);
  color: white;
  padding: 16px 24px;
  display: flex;
  align-items: center;
  gap: 12px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.1);
}

header h1 { font-size: 20px; font-weight: 600; }

.app-layout {
  display: flex;
  height: calc(100vh - 56px);
}

nav {
  width: 220px;
  background: var(--card);
  border-right: 1px solid var(--border);
  padding: 16px 0;
  flex-shrink: 0;
}

nav button {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 12px 20px;
  border: none;
  background: none;
  font-size: 15px;
  color: var(--text-muted);
  cursor: pointer;
  text-align: left;
  transition: all 0.15s;
}

nav button:hover { background: #f1f5f9; color: var(--text); }
nav button.active { background: #eef2ff; color: var(--primary); font-weight: 600; border-right: 3px solid var(--primary); }
nav button .icon { font-size: 18px; width: 24px; text-align: center; }
.nav-badge {
  margin-left: auto;
  background: var(--danger);
  color: white;
  font-size: 11px;
  font-weight: 700;
  line-height: 1;
  padding: 3px 7px;
  border-radius: 10px;
}

/* 折り畳み可能な親メニュー（顧客・ブログ・業務管理）。ヘッダー自体はnav buttonのスタイルを
   そのまま継承し、開閉アイコンとバッジを右端へ寄せるための調整のみ追加する。 */
.nav-group-header { justify-content: flex-start; }
.nav-chevron { margin-left: auto; font-size: 10px; color: var(--text-muted); flex-shrink: 0; }
.nav-group-children { display: flex; flex-direction: column; }
.nav-child { padding-left: 44px !important; font-size: 14px; }
/* 主要機能（顧客・商品カタログ・ブログ）と業務補助機能（業務管理）を分ける区切り線。 */
.nav-separator { height: 1px; background: var(--border); margin: 8px 16px; flex-shrink: 0; }

main {
  flex: 1;
  padding: 24px;
  overflow-y: auto;
}

.section-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}

.section-header h2 { font-size: 22px; font-weight: 600; }

.catalog-library-header { flex-wrap: wrap; gap: 8px; }
.catalog-header-actions { display: flex; gap: 8px; flex-wrap: wrap; }

.btn {
  padding: 8px 16px;
  border: none;
  border-radius: 8px;
  font-size: 14px;
  cursor: pointer;
  font-weight: 500;
  transition: all 0.15s;
}

.btn-primary { background: var(--primary); color: white; }
.btn-primary:hover { background: #4338ca; }
.btn-danger { background: var(--danger); color: white; }
.btn-danger:hover { background: #dc2626; }
.btn-ghost { background: none; color: var(--text-muted); padding: 4px 8px; }
.btn-ghost:hover { color: var(--danger); }

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 12px;
  transition: box-shadow 0.15s;
}

.card:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.06); }

/* Dashboard */
.dashboard-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  gap: 20px;
}

.dashboard-card { padding: 20px; }
.dashboard-card h3 { font-size: 14px; color: var(--text-muted); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
.stat { font-size: 32px; font-weight: 700; color: var(--primary); }
.stat-label { font-size: 13px; color: var(--text-muted); margin-top: 4px; }

.upcoming-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
}

.upcoming-item:last-child { border-bottom: none; }
.upcoming-time { font-size: 13px; color: var(--primary); font-weight: 600; min-width: 50px; }
.upcoming-title { font-size: 14px; }

/* Schedule */
.schedule-date-nav {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 20px;
}

.schedule-date-nav button {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 6px 12px;
  cursor: pointer;
  font-size: 16px;
}

.schedule-date-nav span { font-size: 18px; font-weight: 600; }

.schedule-item {
  display: flex;
  gap: 16px;
  align-items: flex-start;
}

.schedule-item .time {
  min-width: 80px;
  font-size: 14px;
  font-weight: 600;
  color: var(--primary);
  padding-top: 2px;
}

.schedule-item .content { flex: 1; min-width: 0; }
.schedule-item .title { font-size: 15px; font-weight: 500; }
.schedule-item .desc { font-size: 13px; color: var(--text-muted); margin-top: 4px; }
.schedule-item .actions { display: flex; gap: 4px; flex-shrink: 0; }

/* 今後1週間／1ヶ月表示の日付見出し（今日以降の予定を日付ごとにグループ化する）。 */
.schedule-date-group { margin-bottom: 20px; }
.schedule-date-group:last-child { margin-bottom: 0; }
.schedule-date-heading {
  font-size: 16px;
  font-weight: 600;
  margin: 0 0 10px;
  padding-bottom: 6px;
  border-bottom: 1px solid var(--border);
}

/* Tasks */
.task-item {
  display: flex;
  align-items: center;
  gap: 12px;
}

.task-item input[type="checkbox"] {
  width: 20px;
  height: 20px;
  accent-color: var(--primary);
  cursor: pointer;
}

.task-item.done .task-text { text-decoration: line-through; color: var(--text-muted); }
.task-text { flex: 1; font-size: 15px; }
.task-priority {
  font-size: 11px;
  padding: 2px 8px;
  border-radius: 12px;
  font-weight: 600;
}

.priority-high { background: #fef2f2; color: var(--danger); }
.priority-medium { background: #fffbeb; color: var(--warning); }
.priority-low { background: #f0fdf4; color: var(--success); }

.task-due { font-size: 12px; color: var(--text-muted); }

/* Memos */
.memo-item .memo-title { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
.memo-item .memo-preview { font-size: 14px; color: var(--text-muted); line-height: 1.5; }
.memo-item .memo-date { font-size: 12px; color: var(--text-muted); margin-top: 8px; }

/* ブログ書庫カードの★評価 */
.blog-rating-stars { display: flex; gap: 2px; line-height: 1; margin: 2px 0 6px; }
.blog-rating-stars span { display: inline-block; }

/* ブログ書庫カードの「再編集」「削除」（2ボタン）。商品カタログのcatalog-library-delete（削除1個のみ）とは
   別クラスにして、モバイル時の折り返し挙動を個別に調整できるようにする。 */
.blog-library-actions { flex: 0 0 auto; display: flex; gap: 4px; }

/* 商品カタログ一覧のサムネイル付きカード（catalog-card-thumbnail-layout-report.md参照）。
   カード上下のpaddingを既存の16pxから12pxへ圧縮し、削除ボタン分の右余白を確保する。
   align-items:stretchにし、本文側（.catalog-library-info）をflex縦並び＋
   justify-content:space-betweenで各行を上下に分散させることで、画像（180x160px）に対して
   本文が上寄せになり下部に空白が残る見た目を解消する（catalog-card-thumbnail-price-report.md参照）。 */
.catalog-library-card { display: flex; align-items: stretch; gap: 10px; position: relative; padding: 12px 16px; }
.catalog-library-thumb {
  flex: 0 0 auto;
  width: 180px;
  height: 160px;
  border-radius: 10px;
  border: 1px solid var(--border);
  overflow: hidden;
  background: #f1f5f9;
  display: flex;
  align-items: center;
  justify-content: center;
}
/* 画像全体が収まるよう、切り抜き(cover)ではなく余白ができても縦横比を維持するcontainへ変更。
   拡大縮小のどちらでも画像を引き伸ばさない。 */
.catalog-library-thumb img { width: 100%; height: 100%; object-fit: contain; display: block; }
.catalog-library-thumb-placeholder { font-size: 12px; color: var(--text-muted); text-align: center; }
/* 削除ボタンをposition:absoluteでカード右上へ固定するため、本文側の右端がボタンの下へ
   潜り込まないよう右padding分の余白を確保する。flex縦並び＋space-betweenで各行を
   カード（＝画像）の高さいっぱいに分散させ、本文が上寄せで下部だけ空白になるのを防ぐ。 */
.catalog-library-info { flex: 1; min-width: 0; padding-right: 40px; display: flex; flex-direction: column; justify-content: space-between; }
.catalog-library-delete { position: absolute; top: 10px; right: 10px; padding: 6px 10px; }
/* 「Google掲載対象」チェックボックス＋「編集」ボタンの行。既存の「Google掲載予定」バッジ
   （.idea-plan-badgeの丸みを帯びたピル型）とは形状を変え、チェックボックス＋プレーンな
   テキストにすることで一目で区別できるようにする（catalog-library-google-target-toggle-report.md参照）。
   削除ボタン（右上絶対配置）とは縦位置が離れるようinfo列の最下部に置く。 */
.catalog-library-actions-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px solid var(--border);
}
.catalog-google-target-toggle {
  display: flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  font-size: 13px;
  font-weight: 600;
  user-select: none;
  min-width: 0;
}
.catalog-google-target-toggle input[type="checkbox"] {
  width: 17px;
  height: 17px;
  flex-shrink: 0;
  cursor: pointer;
}
.catalog-google-target-toggle input[type="checkbox"]:disabled { cursor: not-allowed; }
.catalog-google-target-text { white-space: nowrap; }
/* ON/OFFは色だけでなく文字自体も変える（色弱対応・視認性のため、色のみに依存しない）。 */
.catalog-google-target-toggle.is-on .catalog-google-target-text { color: var(--success); }
.catalog-google-target-toggle.is-off .catalog-google-target-text { color: var(--text-muted); }
.catalog-google-target-saving {
  display: none;
  font-size: 12px;
  font-weight: 500;
  color: var(--text-muted);
  white-space: nowrap;
}
.catalog-google-target-toggle.is-saving .catalog-google-target-saving { display: inline; }
.catalog-google-target-toggle.is-saving .catalog-google-target-text { opacity: 0.6; }
.catalog-library-edit-btn { flex-shrink: 0; padding: 6px 14px; }
.catalog-library-links { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
/* WEB／Google掲載状態タグの行。折り返し可能にし、商品名を圧迫しないよう独立した行にする
   （catalog-google-status-badges-and-layout-report.md参照）。 */
.catalog-status-tags { display: flex; flex-wrap: wrap; gap: 6px; margin: 2px 0; }
/* 税込価格行（catalog-card-thumbnail-price-report.md参照）。商品名の直下に表示する。 */
.catalog-price { font-size: 15px; font-weight: 600; color: var(--primary); margin: 2px 0; }
/* 検索欄＋並び順＋クリアの行（catalog-sort-function-report.md参照）。flex-wrapにより、
   幅が足りない場合は検索欄（flex-basis:200px）が1行を占有し、.catalog-sort-controls
   （並び順＋クリア、まとまりを保ったまま）が次の行へ折り返る。 */
.catalog-search-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
/* ブランド選択・並び順・クリアのグループ（catalog-brand-filter-report.md参照）。
   検索欄の折り返し先としてはまとまって1行を占有するが、3つ揃うと幅を取るため、
   さらに狭い画面ではグループ内でも折り返せるようflex-wrapを付けておく。 */
/* min-width:0を明示しないと、flexアイテムは既定でコンテンツ幅未満に縮まないため、
   3つのコントロール（ブランド・並び順・クリア）の合計幅が画面幅を超えても内部で
   折り返されず、そのままビューポート外へはみ出してしまう（実機確認で発見・修正）。 */
.catalog-sort-controls { display: flex; gap: 8px; flex: 1 1 auto; flex-wrap: wrap; min-width: 0; max-width: 100%; }
/* カード内文字の行間・見出し下余白を一段だけ詰める。.memo-item配下の共通スタイルは
   memos／ideas／ブログ等でも使われる共有クラスのため、ここでは.catalog-library-card配下だけに
   スコープしたセレクタで上書きし、他画面には一切影響させない。 */
.catalog-library-card.memo-item .memo-title { margin-bottom: 4px; }
.catalog-library-card.memo-item .memo-preview { line-height: 1.35; }
.catalog-library-card.memo-item .memo-date { margin-top: 4px; }
.catalog-link-btn {
  display: inline-block;
  padding: 4px 10px;
  border: 1px solid var(--primary-light);
  border-radius: 20px;
  background: #eef2ff;
  color: var(--primary);
  font-size: 12px;
  font-weight: 600;
  text-decoration: none;
  cursor: pointer;
}
.catalog-link-btn:hover { background: var(--primary); color: white; }

/* 商品カタログ編集画面：キーワードの個別コピーボタン。catalog-keyword-copy-buttons-report.md参照。
   長い語句でも文字を切らず、ボタン内では改行させない。一覧全体は折り返し可能にする。 */
.catalog-keyword-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.catalog-keyword-chip {
  display: inline-flex;
  align-items: center;
  padding: 5px 12px;
  border: 1px solid var(--primary-light);
  border-radius: 20px;
  background: #eef2ff;
  color: var(--primary);
  font-size: 13px;
  font-weight: 500;
  font-family: inherit;
  white-space: nowrap;
  cursor: pointer;
  transition: all 0.15s;
}
.catalog-keyword-chip:hover { background: var(--primary); color: white; }
.catalog-keyword-chip:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.catalog-keyword-chip.is-copied { background: var(--success); border-color: var(--success); color: white; }

/* Modal */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.4);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
}

.modal {
  background: var(--card);
  border-radius: 16px;
  padding: 24px;
  width: 90%;
  max-width: 480px;
  max-height: 90vh;
  overflow-y: auto;
}

.modal h3 { font-size: 18px; margin-bottom: 20px; }

.form-group { margin-bottom: 16px; }
.form-group label { display: block; font-size: 13px; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; }
.form-group input, .form-group select, .form-group textarea {
  width: 100%;
  padding: 10px 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 14px;
  font-family: inherit;
}

.form-group textarea { min-height: 120px; resize: vertical; }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; }

.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-muted);
}

.empty-state .icon { font-size: 48px; margin-bottom: 12px; }
.empty-state p { font-size: 15px; }

.filter-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 16px;
}

.filter-btn {
  padding: 6px 14px;
  border: 1px solid var(--border);
  border-radius: 20px;
  background: var(--card);
  font-size: 13px;
  cursor: pointer;
  color: var(--text-muted);
}

.filter-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

.ai-actions { display: flex; gap: 8px; margin-bottom: 16px; }
.btn-ai {
  padding: 8px 14px;
  border: 1px solid var(--primary-light);
  border-radius: 8px;
  background: #eef2ff;
  color: var(--primary);
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s;
}
.btn-ai:hover { background: var(--primary); color: white; }
.btn-ai:disabled { opacity: 0.5; cursor: not-allowed; }

.ai-result {
  background: #eef2ff;
  border: 1px solid var(--primary-light);
  border-radius: 8px;
  padding: 14px;
  margin-bottom: 16px;
  font-size: 14px;
  line-height: 1.6;
}

.ai-result h4 { font-size: 13px; color: var(--primary); margin-bottom: 8px; }
.ai-result .loading { color: var(--text-muted); font-style: italic; }

.idea-plan-badge {
  display: inline-block;
  margin-left: 8px;
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--warning);
  color: white;
  font-size: 11px;
  font-weight: 600;
  vertical-align: middle;
}
.idea-plan-note {
  font-size: 12px;
  color: var(--text-muted);
  margin-bottom: 12px;
}
.up-char-count {
  font-size: 12px;
  color: var(--text-muted);
  font-weight: normal;
}

.ai-task-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 0;
  border-bottom: 1px solid var(--border);
}

.ai-task-item:last-child { border-bottom: none; }
.ai-task-item input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--primary); }
.ai-task-item span { flex: 1; font-size: 14px; }

.settings-section { max-width: 500px; }
.settings-section .form-group { margin-bottom: 20px; }
.api-key-input { font-family: monospace; }
.api-status { font-size: 13px; margin-top: 6px; }
.api-status.ok { color: var(--success); }
.api-status.ng { color: var(--danger); }

.customer-reply-section { max-width: 720px; }
.customer-reply-section .card { padding: 20px; }
.customer-reply-section .form-group { margin-bottom: 20px; }

.customer-panel {
  background: #f0fdf4;
  border: 1px solid #86efac;
  border-radius: 8px;
  padding: 12px 14px;
  margin-bottom: 16px;
  font-size: 13px;
}
.customer-panel .cp-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
}
.customer-panel .cp-name {
  font-weight: 700;
  font-size: 15px;
  color: #166534;
}
.customer-panel .cp-body {
  line-height: 1.8;
  color: var(--text);
  white-space: pre-wrap;
}
.customer-panel .cp-privacy-note {
  margin-top: 8px;
  font-size: 11px;
  color: #6b7280;
}
/* 「メール返信」画面の「過去のやり取り」（インライン履歴・アコーディオン展開）。
   customer-reply-inline-history-report.md参照。 */
.customer-history-row { padding: 12px 14px; margin-bottom: 8px; }
.customer-history-row .memo-date { font-size: 12px; color: var(--text-muted); }
.customer-history-row .memo-title { margin: 2px 0; }
.customer-history-detail {
  margin-top: 12px;
  padding-top: 12px;
  border-top: 1px solid var(--border);
  cursor: default;
}
.customer-history-detail .form-group { margin-bottom: 10px; }
.customer-history-detail .form-group textarea { min-height: 60px; }
.customer-search-row {
  display: flex;
  gap: 8px;
  align-items: center;
  margin-bottom: 16px;
}
.customer-search-row input {
  flex: 1;
  padding: 8px 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 14px;
  font-family: inherit;
}
.customer-search-row datalist {}

const Store = {
  async get(name) {
    const colMap = { schedules: 'schedules', tasks: 'tasks', memos: 'memos', ideas: 'ideas' };
    const table = colMap[name];
    const { data, error } = await sb.from(table).select('*').order('created_at', { ascending: true });
    if (error) { console.error(error); return []; }
    return data.map(r => Store._fromDb(name, r));
  },
  _fromDb(name, r) {
    if (name === 'schedules') return { id: r.id, title: r.title, date: r.date, startTime: r.start_time || '', endTime: r.end_time || '', description: r.description || '', createdAt: r.created_at, updatedAt: r.updated_at };
    if (name === 'tasks') return { id: r.id, title: r.title, priority: r.priority || 'medium', dueDate: r.due_date || '', description: r.description || '', done: r.done || false, createdAt: r.created_at, updatedAt: r.updated_at };
    if (name === 'memos') return { id: r.id, title: r.title, content: r.content || '', createdAt: r.created_at, updatedAt: r.updated_at };
    if (name === 'ideas') return { id: r.id, title: r.title, content: r.content || '', status: r.status || 'captured', exportedPath: r.exported_path || '', createdAt: r.created_at, updatedAt: r.updated_at };
    return r;
  },
  _toDb(name, item) {
    const base = { user_id: App.user.id };
    if (name === 'schedules') return { ...base, title: item.title, date: item.date, start_time: item.startTime, end_time: item.endTime, description: item.description };
    if (name === 'tasks') return { ...base, title: item.title, priority: item.priority, due_date: item.dueDate || null, description: item.description, done: item.done || false };
    if (name === 'memos') return { ...base, title: item.title, content: item.content };
    if (name === 'ideas') return { ...base, title: item.title, content: item.content, status: 'captured' };
    return item;
  },
  async add(name, item) {
    const row = Store._toDb(name, item);
    const { data, error } = await sb.from(name).insert(row).select().single();
    if (error) { console.error(error); alert('保存に失敗しました: ' + error.message); return null; }
    return Store._fromDb(name, data);
  },
  async update(name, id, updates) {
    const partial = {};
    if (updates.title !== undefined) partial.title = updates.title;
    if (updates.description !== undefined) partial.description = updates.description;
    if (updates.content !== undefined) partial.content = updates.content;
    if (updates.done !== undefined) partial.done = updates.done;
    if (name === 'schedules') {
      if (updates.date !== undefined) partial.date = updates.date;
      if (updates.startTime !== undefined) partial.start_time = updates.startTime;
      if (updates.endTime !== undefined) partial.end_time = updates.endTime;
    }
    if (name === 'tasks') {
      if (updates.priority !== undefined) partial.priority = updates.priority;
      if (updates.dueDate !== undefined) partial.due_date = updates.dueDate || null;
    }
    if (name === 'ideas') {
      if (updates.status !== undefined) partial.status = updates.status;
      if (updates.exportedPath !== undefined) partial.exported_path = updates.exportedPath;
    }
    partial.updated_at = new Date().toISOString();
    const { error } = await sb.from(name).update(partial).eq('id', id);
    if (error) { console.error(error); alert('更新に失敗しました'); return false; }
    return true;
  },
  async remove(name, id) {
    const { error } = await sb.from(name).delete().eq('id', id);
    if (error) { console.error(error); alert('削除に失敗しました'); }
  },
  async find(name, id) {
    const { data, error } = await sb.from(name).select('*').eq('id', id).single();
    if (error) return null;
    return Store._fromDb(name, data);
  },
};

  const email = document.getElementById('auth-email').value.trim();

  errEl.textContent = '';
  if (!email || !password) { errEl.textContent = 'メールアドレスとパスワードを入力してください'; return; }
  if (password.length < 6) { errEl.textContent = 'パスワードは6文字以上にしてください'; return; }

  let result;
  if (mode === 'signup') {
    result = await sb.auth.signUp({ email, password });

      errEl.innerHTML = '<span style="color:var(--success)">登録完了！確認メールを送信しました。メールのリンクをクリックしてからログインしてください。</span>';

  App.user = result.data.user;
  initApp();

// 番号種別ラジオボタンの選択値 → 番号ラベルの対応表（inquiry-number-type-radio-report.md参照）
const INQUIRY_TYPE_LABELS = {
  inquiry: '問合番号',
  repair: '修理番号',
  order: '受注番号',
  reservation: '予約番号',
  loan: '貸出番号',
  purchaseOrder: '発注番号',
};

function generateInquiryNo() {
  const now = new Date();
  const yy = String(now.getFullYear()).slice(2);
  const mm = String(now.getMonth() + 1).padStart(2, '0');
  const dd = String(now.getDate()).padStart(2, '0');
  const hh = String(now.getHours()).padStart(2, '0');
  const mi = String(now.getMinutes()).padStart(2, '0');
  return `${yy}${mm}${dd}${hh}${mi}`;
}

// メールはAIが「件名: ...」を1行目に、空行を挟んで3行目から本文を出力する指示になっているため、
// 件名行と本文を分離する。メール以外は件名行がないため、全体をそのまま本文として扱う。
function splitSubjectAndBody(text, channel) {
  if (channel !== 'メール') return { subjectLine: '', body: text };
  const idx = text.indexOf('\n\n');
  if (idx === -1) return { subjectLine: '', body: text }; // 想定外の形式の場合はそのまま本文として扱う
  return { subjectLine: text.slice(0, idx), body: text.slice(idx + 2) };
}

// customer-reply-subject-addressee-inquiry-tag-fix-report.md参照：
// 件名・本文の最終的な形式はAIの自由出力に依存せず、以下のヘルパー群でコード側から機械的に保証する。

// 件名先頭に付くことがある「件名：」「件名:」ラベルを取り除く
function stripSubjectLabelPrefix(text) {
  return (text || '').replace(/^件名[:：]\s*/, '').trim();
}

// 氏名の末尾にすでに「様」が付いていれば重複させず、なければ付与する。
// 名前未入力時のフォールバック「お客様」はそれ自体が敬称を含む語のため対象外とする。
function ensureHonorific(rawName) {
  const trimmed = (rawName || '').trim();
  if (!trimmed || trimmed === 'お客様') return trimmed || 'お客様';
  return `${trimmed.replace(/\s*様\s*$/, '')} 様`;
}

// 件名末尾の問い合わせ番号表記（ラベル付き・ラベルなし・[ ]の有無を問わず）を検出して取り除く
function stripTrailingInquiryTag(text) {
  const labels = Object.values(INQUIRY_TYPE_LABELS).join('|');
  const pattern = new RegExp(`[\\s　]*[\\[［]?\\s*(?:${labels})?\\s*\\d{6,}\\s*[\\]］]?\\s*$`);
  return (text || '').replace(pattern, '').trim();
}

// 要件テキストの前後にある[ ]（二重括弧を含む）をすべて取り除き、1回だけ囲み直せる状態にする
function stripSurroundingBrackets(text) {
  return (text || '').trim().replace(/^[\[［\s]+/, '').replace(/[\]］\s]+$/, '').trim();
}

// AIがどのような形式で件名を出力しても、コード側で「氏名 様　[要件]　[番号種別+番号]」へ最終整形する
function buildFinalSubjectLine(rawSubjectLine, name, inquiryTag) {
  let text = stripSubjectLabelPrefix(rawSubjectLine);
  text = stripTrailingInquiryTag(text);

  const escapedName = name.trim().replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  if (escapedName) {
    const leadingNamePattern = new RegExp(`^${escapedName}\\s*様?\\s*`);
    text = text.replace(leadingNamePattern, '').trim();
  }

  const requirement = stripSurroundingBrackets(text) || '対応について';
  return `${ensureHonorific(name)}　[${requirement}]　[${inquiryTag}]`;
}

// メールは番号タグを件名末尾にのみ表示するため、本文中に紛れ込んだ番号タグをすべて除去する
function stripInquiryTagsFromBody(body) {
  const labels = Object.values(INQUIRY_TYPE_LABELS).join('|');
  const pattern = new RegExp(`[\\[［]\\s*(?:${labels})?\\s*\\d{6,}\\s*[\\]］]`, 'g');
  return (body || '')
    .replace(pattern, '')
    .replace(/[ \t　]+\n/g, '\n')
    .replace(/\n{3,}/g, '\n\n')
    .trim();
}

// 「NTR-XXXXXX　氏名」形式の宛名入力欄の値から、顧客番号部分だけを取り除く。
// 件名（1行目）には顧客番号を含めるが、本文冒頭の宛名には含めない
// （customer-reply-label-and-duplicate-header-fix-report.md参照。
// 顧客管理からのcmOpenSelected()はreply-nameへ「NTR-XXXXXX　氏名 様」を設定するため、
// これをそのまま本文の宛名に使うと、AIが自分で書いた「氏名 様」の挨拶と別物として扱われ、
// ensureBodyAddressee()が重複して挿入してしまっていた）。
function stripCustomerIdPrefix(rawName) {
  return (rawName || '').replace(/^NTR-\d{6}\s*　?\s*/, '').trim();
}

// 本文冒頭へ「氏名 様」の宛名を1回だけ保証する（AIがすでに書いていた場合は重複させない）
function ensureBodyAddressee(body, subjectName) {
  const trimmed = (body || '').trim();
  if (trimmed.startsWith(subjectName)) return trimmed;
  return `${subjectName}\n\n${trimmed}`;
}

// 「既存の問い合わせ番号」欄の手入力値を正規化する。
// ラベル（問合番号等）が既に付いていればそのまま使い、[ ]は外す。
// 数字だけが入力された場合は、現在選択中の番号種別のラベルを付けて補正する
// （customer-reply-channel-radio-and-inquiry-tag-fix-report.md参照：ここでラベルなしの
// 数字だけの値がそのままinquiryTagとして使われてしまい、件名末尾が[2607111837]のように
// ラベル欠落する不具合の原因になっていた）。
function normalizeExistingInquiryTag(rawValue, inquiryTypeLabel) {
  const trimmed = (rawValue || '').trim();
  if (!trimmed) return '';
  const withoutBrackets = trimmed.replace(/^[\[［]\s*/, '').replace(/\s*[\]］]$/, '').trim();
  const knownLabels = Object.values(INQUIRY_TYPE_LABELS);
  if (knownLabels.some(label => withoutBrackets.startsWith(label))) return withoutBrackets;
  const digitsMatch = withoutBrackets.match(/\d{6,}/);
  if (digitsMatch) return `${inquiryTypeLabel}${digitsMatch[0]}`;
  return withoutBrackets;
}

const NAV_GROUP_STATE_KEY = 'ai-secretary-nav-group-state-v1';

function loadNavGroupState() {
  try {
    const raw = localStorage.getItem(NAV_GROUP_STATE_KEY);
    const parsed = raw ? JSON.parse(raw) : null;
    // 壊れた・想定外の形式のlocalStorage値は空オブジェクトとして扱い、安全に初期化する。
    return (parsed && typeof parsed === 'object' && !Array.isArray(parsed)) ? parsed : {};
  } catch (e) {
    return {};
  }
}

function saveNavGroupState(state) {
  try { localStorage.setItem(NAV_GROUP_STATE_KEY, JSON.stringify(state)); } catch (e) { /* 保存できなくても致命的ではないため無視する */ }
}

// 親メニューの開閉状態は2つのオブジェクトで管理する（navigation-group-collapse-state-fix-report.md参照）。
// ・App._navGroupOpen：実際の開閉状態（描画・localStorage永続化に使う）
// ・App._navGroupUserToggled：ユーザーが一度でも手動でそのグループを開閉したか（true固定・
//   セッション中はリセットしない）。trueになったグループは、以後いかなる自動展開処理の
//   対象からも外れる（=ユーザーが選んだ状態を、それ以降ずっと最優先する）。
//
// 以前の実装は「現在画面を含む親を開く」処理をrenderNav()の毎回の実行時に無条件で行っていたため、
// 顧客対応バッジ・業務管理バッジの非同期更新などrenderNav()だけを再実行する場面のたびに、
// ユーザーが直前に閉じたはずの親メニューが再び開いてしまう不具合があった（ハードリロードでしか
// 直らなかったのは、ページ再読み込みでApp._navGroupOpenがリセットされ、たまたま望む状態に
// 戻っていたに過ぎない）。修正後は、renderNav()自体は状態を一切変更しない「描画専用」関数とし、
// 自動展開はinitNavGroupState()（起動時）とnavigate()（実際に画面が変わったとき）からのみ
// 明示的に呼び出す。

// アプリ起動時に1回だけ呼ぶ。
function initNavGroupState() {
  const saved = loadNavGroupState();
  App._navGroupOpen = {};
  App._navGroupUserToggled = {};
  navStructure.forEach(entry => {
    if (entry.type !== 'group') return;
    // localStorageに真偽値として保存済みの開閉状態がある場合は、それを既存のユーザー選択として
    // 扱い、現在画面を理由にした自動展開の対象から外す。そうしないと、ハードリロード直後に
    // 「保存済みは閉じているが、たまたま今そのグループの画面を見ている」場合、自動展開ロジックが
    // 保存済みの閉じた状態を無視して開いてしまい、要件8（localStorageの状態と矛盾しない）に反する。
    // 保存値が無い（真偽値として存在しない）場合のみ、初回表示として自動展開の対象にする。
    const hasSavedValue = typeof saved[entry.id] === 'boolean';
    App._navGroupOpen[entry.id] = hasSavedValue ? saved[entry.id] : false;
    if (hasSavedValue) App._navGroupUserToggled[entry.id] = true;
  });
  autoOpenNavGroupForView(App.currentView);
}

// 指定したviewを含む親メニューを開く。ただし、そのグループをユーザーが一度でも手動で
// 開閉したことがある場合は何もしない（ユーザーの選択を上書きしない）。冪等な操作のため、
// 同じviewに対して何度呼んでも安全（navigate()から無条件に呼び出せる）。
function autoOpenNavGroupForView(view) {
  if (!App._navGroupOpen) App._navGroupOpen = {};
  if (!App._navGroupUserToggled) App._navGroupUserToggled = {};
  navStructure.forEach(entry => {
    if (entry.type === 'group' && !App._navGroupUserToggled[entry.id] && entry.children.some(c => c.id === view)) {
      App._navGroupOpen[entry.id] = true;
    }
  });
}

function toggleNavGroup(groupId) {
  if (!App._navGroupOpen) App._navGroupOpen = {};
  if (!App._navGroupUserToggled) App._navGroupUserToggled = {};
  App._navGroupOpen[groupId] = !App._navGroupOpen[groupId];
  App._navGroupUserToggled[groupId] = true;
  saveNavGroupState(App._navGroupOpen);
  renderNav();
}

// 描画専用。App._navGroupOpenを読むだけで、一切書き換えない
// （開閉状態の変更はtoggleNavGroup()・autoOpenNavGroupForView()の呼び出し元だけが行う）。
function renderNav() {
  // initNavGroupState()がまだ呼ばれていない場合（テスト等でinitApp()を経由しない場合を含む）でも
  // 安全に動作するよう、未初期化ならここで空オブジェクトにフォールバックする。
  if (!App._navGroupOpen) App._navGroupOpen = {};
  if (!App._navGroupUserToggled) App._navGroupUserToggled = {};

  document.getElementById('nav').innerHTML = navStructure.map(entry => {
    if (entry.type === 'separator') {
      return '<div class="nav-separator"></div>';
    }
    if (entry.type === 'group') {
      const isOpen = !!App._navGroupOpen[entry.id];
      // 親メニューごとのバッジ件数。「顧客」は完了以外で注意が必要な顧客対応案件数、
      // 「業務管理」は本日の予定＋本日期限・期限超過タスク件数（どちらも「確認・対応が必要な件数」）。
      // 子メニュー側には同じ件数を重複表示しない（顧客の子メニューには表示しない。業務管理の
      // スケジュール／タスクの子メニューには、合算前の内訳だけをcountKey経由で個別表示する）。
      // App._correspondenceAlertCount・App._workManagementCountsはどちらも非同期のrefresh関数が
      // 更新するキャッシュ値。renderNav()自体は同期関数のままにするため、ここでは読むだけにする。
      let badgeCount = 0;
      if (entry.id === 'customer') badgeCount = App._correspondenceAlertCount || 0;
      else if (entry.id === 'workManagement') badgeCount = (App._workManagementCounts && App._workManagementCounts.total) || 0;
      const badge = badgeCount > 0 ? ` <span class="nav-badge">${badgeCount}</span>` : '';
      // 子メニューの件数バッジ用の値をまとめて参照できるようにする。App._workManagementCounts
      // （本日の予定・本日期限＋期限超過タスク）に加え、App._scheduleUpcomingCount
      // （今日以降の予定総数。業務管理の「本日確認すべき件数」とは意味が異なる指標のため、
      // 別のApp状態で持つ。schedule-upcoming-list-and-badge-report.md参照）をここで合成する。
      const childCountSources = { ...(App._workManagementCounts || {}), scheduleUpcoming: App._scheduleUpcomingCount || 0 };
      const childrenHtml = entry.children.map(c => {
        const childCount = c.countKey ? (childCountSources[c.countKey] || 0) : 0;
        const childBadge = childCount > 0 ? ` <span class="nav-badge"${c.badgeTitle ? ` title="${esc(c.badgeTitle)}"` : ''}>${childCount}</span>` : '';
        return `<button class="nav-child ${App.currentView === c.id ? 'active' : ''}" onclick="${c.action || `navigate('${c.id}')`}"><span class="icon">${c.icon}</span>${c.label}${childBadge}</button>`;
      }).join('');
      return `
        <div class="nav-group">
          <button class="nav-group-header" onclick="toggleNavGroup('${entry.id}')" aria-expanded="${isOpen}">
            <span class="icon">${entry.icon}</span>
            <span class="nav-group-label">${entry.label}</span>${badge}
            <span class="nav-chevron">${isOpen ? '&#9660;' : '&#9654;'}</span>
          </button>
          <div class="nav-group-children" style="${isOpen ? '' : 'display:none'}">${childrenHtml}</div>
        </div>
      `;
    }
    // トップレベル単独項目のバッジ。今のところ「イベント管理」＝要連絡顧客の総数
    // （event-customer-link-management-phase1-report.md参照）のみが対象。
    const itemBadgeCount = entry.id === 'events' ? (App._eventAlertCount || 0) : 0;
    const itemBadge = itemBadgeCount > 0 ? ` <span class="nav-badge" title="要連絡の顧客数">${itemBadgeCount}</span>` : '';
    return `<button class="${App.currentView === entry.id ? 'active' : ''}" onclick="navigate('${entry.id}')"><span class="icon">${entry.icon}</span>${entry.label}${itemBadge}</button>`;
  }).join('');
}

function navigate(view) {
  App.currentView = view;
  autoOpenNavGroupForView(view);
  renderNav();
  renderMain();
}

function renderMain() {
  const views = { dashboard: renderDashboard, schedule: renderSchedule, tasks: renderTasks, memos: renderMemos, ideas: renderIdeas, editorialAI: renderEditorialAI, editorialLibrary: renderEditorialLibrary, customerReply: renderCustomerReply, correspondenceLibrary: renderCorrespondenceLibrary, customerManagement: renderCustomerManagement, catalogProduction: renderCatalogLibrary, events: renderEventLibrary, colormeCsvConverter: renderColormeCsvConverter, settings: renderSettings };
  (views[App.currentView] || views.dashboard)();
}

function formatDate(d) {
  const dt = new Date(d);
  return `${dt.getFullYear()}/${(dt.getMonth()+1).toString().padStart(2,'0')}/${dt.getDate().toString().padStart(2,'0')}`;
}

// 「YYYY/MM/DD HH:MM」形式（拍手数の最終確認日時表示に使用。formatDate()の日付部分を再利用する）。
function formatDateTime(d) {
  if (!d) return '';
  const dt = new Date(d);
  const hh = String(dt.getHours()).padStart(2, '0');
  const mm = String(dt.getMinutes()).padStart(2, '0');
  return `${formatDate(d)} ${hh}:${mm}`;
}

function formatDateJP(d) {
  const dt = new Date(d);
  const days = ['日','月','火','水','木','金','土'];
  return `${dt.getFullYear()}年${dt.getMonth()+1}月${dt.getDate()}日(${days[dt.getDay()]})`;
}

function dateStr(d) {
  const dt = new Date(d);
  return `${dt.getFullYear()}-${(dt.getMonth()+1).toString().padStart(2,'0')}-${dt.getDate().toString().padStart(2,'0')}`;
}

// 5つ星評価UIの共通描画ヘルパー。商品カタログ（showCatalogProductDetail）・ブログ書庫の
// 両方で同じ塗りつぶし星（&#9733;）／空星の見た目を再利用する（blog-library-rating-implementation-report.md参照）。
// onClickForStar(n) が返す文字列がその星のonclick属性になる（呼び出し元でevent.stopPropagation()等を挟められる）。
// readonly:trueの場合はonclickを付与せず、閲覧専用表示にする。
function renderStarRatingHtml(rating, onClickForStar, opts) {
  const o = { fontSize: 22, padding: 0, readonly: false, ...(opts || {}) };
  const safeRating = Math.max(0, Math.min(5, Number(rating) || 0));
  return [1, 2, 3, 4, 5].map(n => {
    const clickAttr = o.readonly ? '' : ` onclick="${onClickForStar(n)}"`;
    const cursor = o.readonly ? 'default' : 'pointer';
    return `<span style="cursor:${cursor};font-size:${o.fontSize}px;padding:${o.padding}px;color:${safeRating >= n ? '#d4af37' : '#ccc'}"${clickAttr}>&#9733;</span>`;
  }).join('');
}

// 顧客返信履歴をcustomer_repliesへ保存するよう変更する前（saveReply()の旧実装）は、
// 「顧客返信：〇〇様（チャネル）YYYY-MM-DD」という一貫した形式のタイトルでmemosに保存されていた。
// memosテーブル自体には一切書き込まず、タイトルの形式だけで旧ログかどうかを判定する
// （old-reply-memo-cleanup-plan.md 案A）。
const LEGACY_REPLY_MEMO_PATTERN = /^顧客返信：.+（(LINE|メール|SMS|取引先)）\d{4}-\d{2}-\d{2}$/;
function isLegacyReplyLogMemo(memo) {
  return LEGACY_REPLY_MEMO_PATTERN.test((memo?.title || '').trim());
}

async function askAssistant() {

  area.innerHTML = '<div class="ai-result"><div class="loading">考え中...</div></div>';

  const today = dateStr(new Date());
  const schedules = await Store.get('schedules');
  const todaySchedules = schedules.filter(s => s.date === today);
  const upcomingSchedules = schedules.filter(s => s.date >= today).sort((a,b) => a.date.localeCompare(b.date) || a.startTime.localeCompare(b.startTime)).slice(0, 10);
  const tasks = await Store.get('tasks');
  const pendingTasks = tasks.filter(t => !t.done);
  const memos = (await Store.get('memos')).filter(m => !isLegacyReplyLogMemo(m)).slice(-5);

  const context = `今日は${formatDateJP(new Date())}です。

【今日の予定】
${todaySchedules.length ? todaySchedules.map(s => `・${s.startTime}${s.endTime ? '〜'+s.endTime : ''} ${s.title}${s.description ? '（'+s.description+'）' : ''}`).join('\n') : 'なし'}

【今後の予定】
${upcomingSchedules.length ? upcomingSchedules.map(s => `・${s.date} ${s.startTime} ${s.title}`).join('\n') : 'なし'}

【未完了タスク】
${pendingTasks.length ? pendingTasks.map(t => `・[${({high:'高',medium:'中',low:'低'})[t.priority]||'中'}] ${t.title}${t.dueDate ? '（期限:'+t.dueDate+'）' : ''}`).join('\n') : 'なし'}

【最近のメモ】
${memos.length ? memos.map(m => `・${m.title}: ${(m.content||'').slice(0,100)}`).join('\n') : 'なし'}`;

  try {
    const result = await callClaude(
      `あなたは優秀なAI秘書です。以下のユーザーの予定・タスク・メモを確認して、簡潔にアドバイスしてください。
・今日やるべきことの整理
・期限が近いタスクへの注意喚起
・予定の準備に必要なこと
・全体的な優先順位の提案
親しみやすい丁寧な口調で、箇条書きで簡潔に答えてください。

${context}`
    );
    area.innerHTML = `<div class="ai-result"><div style="white-space:pre-wrap;line-height:1.8">${esc(result)}</div></div>`;
  } catch (e) {
    area.innerHTML = `<div class="ai-result" style="border-color:var(--danger)"><h4 style="color:var(--danger)">エラー</h4>${esc(e.message)}</div>`;
  }
}

// Voice
let voiceRecognition = null;
let isRecording = false;

function toggleVoice() {
  if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
    document.getElementById('voice-status').textContent = 'お使いのブラウザは音声認識に対応していません';
    return;
  }
  if (isRecording) {
    voiceRecognition.stop();
    return;
  }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  voiceRecognition = new SR();
  voiceRecognition.lang = 'ja-JP';
  voiceRecognition.continuous = false;
  voiceRecognition.interimResults = true;

  voiceRecognition.onstart = () => {
    isRecording = true;
    document.getElementById('mic-btn').classList.add('recording');
    document.getElementById('voice-status').textContent = '聞いています...';
    document.getElementById('voice-response-area').innerHTML = '';
  };

  voiceRecognition.onresult = (e) => {
    let transcript = '';
    for (let i = 0; i < e.results.length; i++) {
      transcript += e.results[i][0].transcript;
    }
    document.getElementById('voice-transcript-area').innerHTML =
      `<div class="voice-transcript">${esc(transcript)}</div>`;
    if (e.results[0].isFinal) {
      voiceRecognition.stop();
      processVoiceCommand(transcript);
    }
  };

  voiceRecognition.onerror = (e) => {
    isRecording = false;
    document.getElementById('mic-btn').classList.remove('recording');
    document.getElementById('voice-status').textContent =
      e.error === 'not-allowed' ? 'マイクの使用が許可されていません。ブラウザの設定を確認してください。' : 'エラーが発生しました。もう一度お試しください。';
  };

  voiceRecognition.onend = () => {
    isRecording = false;
    document.getElementById('mic-btn').classList.remove('recording');
    if (document.getElementById('voice-status').textContent === '聞いています...') {
      document.getElementById('voice-status').textContent = 'マイクボタンを押して話しかけてください';
    }
  };

  voiceRecognition.start();
}

async function processVoiceCommand(text) {
  document.getElementById('voice-status').textContent = 'AIが処理中...';
  const responseArea = document.getElementById('voice-response-area');
  responseArea.innerHTML = '<div class="voice-response"><div class="loading">考え中...</div></div>';

  const today = dateStr(new Date());
  const schedules = await Store.get('schedules');
  const tasks = (await Store.get('tasks')).filter(t => !t.done);

  const prompt = `あなたはAI秘書です。ユーザーの音声指示に対応してください。
今日は${formatDateJP(new Date())}です。

【現在の予定】
${schedules.filter(s => s.date >= today).sort((a,b) => a.date.localeCompare(b.date)).slice(0,10).map(s => `・[ID:${s.id}] ${s.date} ${s.startTime} ${s.title}`).join('\n') || 'なし'}

【未完了タスク】
${tasks.map(t => `・[ID:${t.id}] [${({high:'高',medium:'中',low:'低'})[t.priority]||'中'}] ${t.title}${t.dueDate ? '（期限:'+t.dueDate+'）' : ''}`).join('\n') || 'なし'}

【メモ】
${(await Store.get('memos')).filter(m => !isLegacyReplyLogMemo(m)).map(m => `・[ID:${m.id}] ${m.title}`).join('\n') || 'なし'}

ユーザーの指示: 「${text}」

以下のルールに従って回答してください：
1. 予定の追加が求められた場合、JSON形式で返してください：
   {"action":"add_schedule","date":"YYYY-MM-DD","startTime":"HH:MM","endTime":"HH:MM","title":"タイトル","description":""}
2. タスクの追加が求められた場合：
   {"action":"add_task","title":"タスク名","priority":"high|medium|low","dueDate":"YYYY-MM-DD"}
3. メモの追加が求められた場合：
   {"action":"add_memo","title":"タイトル","content":"内容"}
4. 予定の削除が求められた場合（タイトルや日付で特定してIDを指定）：
   {"action":"delete_schedule","id":"該当のID","title":"削除する予定のタイトル"}
5. タスクの削除が求められた場合：
   {"action":"delete_task","id":"該当のID","title":"削除するタスクのタイトル"}
6. メモの削除が求められた場合：
   {"action":"delete_memo","id":"該当のID","title":"削除するメモのタイトル"}
7. 「今日の予定を全部削除」のように複数削除の場合は、該当するものすべてを配列で返してください。
8. 複数の操作がある場合は配列で返してください：[{...},{...}]
9. 情報の質問や確認の場合は、普通のテキストで回答してください（JSONなし）。
10. 回答は簡潔に、親しみやすい丁寧語で。`;

  try {
    const result = await callClaude(prompt);
    let actions = [];
    try {
      const jsonMatch = result.match(/\[[\s\S]*\]/) || result.match(/\{[\s\S]*\}/);
      if (jsonMatch) {
        const parsed = JSON.parse(jsonMatch[0]);
        actions = Array.isArray(parsed) ? parsed : [parsed];
      }
    } catch(e) {}

    let messages = [];
    for (const a of actions) {
      if (a.action === 'add_schedule') {
        await Store.add('schedules', { title: a.title, date: a.date, startTime: a.startTime || '', endTime: a.endTime || '', description: a.description || '' });
        messages.push(`予定「${a.title}」を${a.date}に追加しました。`);
      } else if (a.action === 'add_task') {
        await Store.add('tasks', { title: a.title, priority: a.priority || 'medium', dueDate: a.dueDate || '', description: '', done: false });
        messages.push(`タスク「${a.title}」を追加しました。`);
      } else if (a.action === 'add_memo') {
        await Store.add('memos', { title: a.title, content: a.content || '' });
        messages.push(`メモ「${a.title}」を保存しました。`);
      } else if (a.action === 'delete_schedule' && a.id) {
        await Store.remove('schedules', a.id);
        messages.push(`予定「${a.title || ''}」を削除しました。`);
      } else if (a.action === 'delete_task' && a.id) {
        await Store.remove('tasks', a.id);
        messages.push(`タスク「${a.title || ''}」を削除しました。`);
      } else if (a.action === 'delete_memo' && a.id) {
        await Store.remove('memos', a.id);
        messages.push(`メモ「${a.title || ''}」を削除しました。`);
      }
    }

    if (messages.length > 0) {
      responseArea.innerHTML = `<div class="voice-response">${messages.map(m => '&#10003; ' + esc(m)).join('<br>')}</div>`;
      renderDashboard();
    } else {
      const cleanResult = result.replace(/```json[\s\S]*?```/g, '').replace(/\{[\s\S]*?\}/g, '').trim() || result;
      responseArea.innerHTML = `<div class="voice-response">${esc(actions.length ? result : cleanResult)}</div>`;
    }

    document.getElementById('voice-status').textContent = 'マイクボタンを押して話しかけてください';
  } catch (e) {
    responseArea.innerHTML = `<div class="voice-response" style="border-color:var(--danger)">${esc(e.message)}</div>`;
    document.getElementById('voice-status').textContent = 'エラーが発生しました';
  }
}

// Schedule
// スケジュール画面の表示モード（日別／今後1週間／今後1ヶ月）。
// schedule-upcoming-list-and-badge-report.md参照。
const SCHEDULE_VIEW_MODES = ['day', 'week', 'month'];
const SCHEDULE_VIEW_MODE_KEY = 'ai-secretary-schedule-view-mode-v1';
const SCHEDULE_VIEW_MODE_LABELS = { day: '日別', week: '今後1週間', month: '今後1ヶ月' };

function loadScheduleViewMode() {
  try {
    const raw = localStorage.getItem(SCHEDULE_VIEW_MODE_KEY);
    // 不正・未知の値は既定の'day'へ安全に戻す。
    return SCHEDULE_VIEW_MODES.includes(raw) ? raw : 'day';
  } catch (e) {
    return 'day';
  }
}

function saveScheduleViewMode(mode) {
  try { localStorage.setItem(SCHEDULE_VIEW_MODE_KEY, mode); } catch (e) { /* 保存できなくても致命的ではないため無視する */ }
}

function setScheduleViewMode(mode) {
  App._scheduleViewMode = SCHEDULE_VIEW_MODES.includes(mode) ? mode : 'day';
  saveScheduleViewMode(App._scheduleViewMode);
  // App.scheduleDate（日別表示の選択中の日付）には一切触れない。表示切替後・切替から
  // 戻った後も選択中の日付が保持される（要件6・確認項目N）。
  renderSchedule();
}

function addDays(date, n) {
  const d = new Date(date);
  d.setDate(d.getDate() + n);
  return d;
}

// スケジュール1件分のカードHTML。日別・今後1週間・今後1ヶ月のいずれの表示からも共通で使う
// （同じHTML生成処理を重複実装しない。要件4参照）。
function buildScheduleCardHtml(s) {
  const timeLabel = s.startTime ? `${s.startTime}${s.endTime ? ' - ' + s.endTime : ''}` : '終日';
  return `
    <div class="card schedule-item">
      <div class="time">${esc(timeLabel)}</div>
      <div class="content">
        <div class="title">${esc(s.title)}</div>
        ${s.description ? `<div class="desc">${esc(s.description)}</div>` : ''}
      </div>
      <div class="actions">
        <button class="btn-ghost" onclick="showScheduleModal('${s.id}')">&#9998;</button>
        <button class="btn-ghost" onclick="deleteItem('schedules','${s.id}','renderSchedule')">&#10005;</button>
      </div>
    </div>
  `;
}

// 予定を日付ごとにグループ化し、日付見出し＋該当日のカード群を並べる。今後1週間／1ヶ月の
// 両方から呼ぶ共通関数（要件4参照）。schedulesは呼び出し側で対象期間に絞り込み済みのものを渡す。
function buildScheduleGroupedListHtml(schedules, emptyMessage) {
  if (!schedules.length) {
    return `<div class="empty-state"><div class="icon">&#128197;</div><p>${esc(emptyMessage)}</p></div>`;
  }
  const sorted = schedules.slice().sort((a, b) => {
    if (a.date !== b.date) return a.date < b.date ? -1 : 1;
    return (a.startTime || '').localeCompare(b.startTime || '');
  });
  const groups = [];
  let currentDate = null;
  sorted.forEach(s => {
    if (s.date !== currentDate) {
      currentDate = s.date;
      groups.push({ date: s.date, items: [] });
    }
    groups[groups.length - 1].items.push(s);
  });
  return groups.map(g => `
    <div class="schedule-date-group">
      <h3 class="schedule-date-heading">${esc(formatDateJP(g.date))}</h3>
      ${g.items.map(s => buildScheduleCardHtml(s)).join('')}
    </div>
  `).join('');
}

// 今後1週間／1ヶ月表示。今日を含み、今日から7日後／30日後までの範囲（昨日以前は含まない。要件7）。
function buildScheduleRangeViewHtml(allSchedules, mode) {
  const today = dateStr(new Date());
  const endDate = dateStr(addDays(new Date(), mode === 'week' ? 7 : 30));
  const items = allSchedules.filter(s => s.date >= today && s.date <= endDate);
  const emptyMessage = mode === 'week' ? '今後1週間の予定はありません' : '今後1ヶ月の予定はありません';
  return buildScheduleGroupedListHtml(items, emptyMessage);
}

// 日別表示。既存の前日／翌日／今日ボタン・日別カード一覧をそのまま維持する（要件6）。
function buildScheduleDayViewHtml(allSchedules) {
  const d = App.scheduleDate;
  const ds = dateStr(d);
  const items = allSchedules.filter(s => s.date === ds).sort((a, b) => (a.startTime || '').localeCompare(b.startTime || ''));
  return `
    <div class="schedule-date-nav">
      <button onclick="changeDate(-1)">&larr;</button>
      <span>${formatDateJP(d)}</span>
      <button onclick="changeDate(1)">&rarr;</button>
      <button class="btn" style="font-size:13px;margin-left:8px" onclick="App.scheduleDate=new Date();renderSchedule()">今日</button>
    </div>
    ${items.length ? items.map(s => buildScheduleCardHtml(s)).join('') : '<div class="empty-state"><div class="icon">&#128197;</div><p>この日の予定はありません</p></div>'}
  `;
}

async function renderSchedule() {
  document.getElementById('main').innerHTML = '<div class="loading-screen">読み込み中...</div>';
  if (!App._scheduleViewMode) App._scheduleViewMode = loadScheduleViewMode();
  const allSchedules = await Store.get('schedules');
  // 保存・削除・日付移動・タブ再読込のいずれもこの関数の再実行を経由するため、ここに1箇所
  // 仕込むだけで「業務管理」バッジ・「スケジュール」子メニューバッジの更新タイミング要件
  // （保存／削除後・日付移動後・一覧再読込後）をすべて満たせる
  // （navigation-priority-and-work-management-group-report.md、
  // schedule-upcoming-list-and-badge-report.md参照）。全件取得済みのallSchedulesを
  // そのまま渡し、N+1取得を避ける。
  refreshWorkManagementAlertCount(allSchedules);
  refreshScheduleUpcomingCount(allSchedules);

  const mode = App._scheduleViewMode;
  const bodyHtml = mode === 'day' ? buildScheduleDayViewHtml(allSchedules) : buildScheduleRangeViewHtml(allSchedules, mode);

  document.getElementById('main').innerHTML = `
    <div class="section-header">
      <h2>スケジュール</h2>
      <button class="btn btn-primary" onclick="showScheduleModal()">+ 予定を追加</button>
    </div>
    <div class="filter-bar">
      ${SCHEDULE_VIEW_MODES.map(m => `<button class="filter-btn ${mode === m ? 'active' : ''}" onclick="setScheduleViewMode('${m}')">${esc(SCHEDULE_VIEW_MODE_LABELS[m])}</button>`).join('')}
    </div>
    ${bodyHtml}
  `;
}

function changeDate(offset) {
  App.scheduleDate.setDate(App.scheduleDate.getDate() + offset);
  renderSchedule();
}

async function showScheduleModal(editId) {
  const item = editId ? await Store.find('schedules', editId) : null;
  const ds = dateStr(App.scheduleDate);
  showModal(`
    <h3>${item ? '予定を編集' : '予定を追加'}</h3>
    <div class="form-group"><label>タイトル</label><input id="f-title" value="${item ? esc(item.title) : ''}"></div>
    <div class="form-group"><label>日付</label><input id="f-date" type="date" value="${item ? item.date : ds}"></div>
    <div style="display:flex;gap:12px">
      <div class="form-group" style="flex:1"><label>開始時間</label><input id="f-start" type="time" value="${item ? item.startTime : ''}"></div>
      <div class="form-group" style="flex:1"><label>終了時間</label><input id="f-end" type="time" value="${item ? item.endTime||'' : ''}"></div>
    </div>
    <div class="form-group"><label>メモ</label><textarea id="f-desc" rows="3">${item ? esc(item.description||'') : ''}</textarea></div>
    <div class="modal-actions">

      <button class="btn btn-primary" onclick="saveSchedule('${editId||''}')">保存</button>
    </div>
  `);
}

async function saveSchedule(editId) {
  const data = {
    title: document.getElementById('f-title').value.trim(),
    date: document.getElementById('f-date').value,
    startTime: document.getElementById('f-start').value,
    endTime: document.getElementById('f-end').value,
    description: document.getElementById('f-desc').value.trim(),
  };
  if (!data.title || !data.date) return alert('タイトルと日付は必須です');
  if (editId) await Store.update('schedules', editId, data);
  else await Store.add('schedules', data);
  closeModal();
  renderSchedule();
}

// Tasks
async function renderTasks() {
  document.getElementById('main').innerHTML = '<div class="loading-screen">読み込み中...</div>';
  const allTasks = await Store.get('tasks');
  // 保存・完了切替・削除・タブ再読込のいずれもこの関数の再実行を経由するため、ここに1箇所
  // 仕込むだけで「業務管理」バッジの更新タイミング要件をすべて満たせる。件数は現在の
  // App.taskFilter（すべて／未完了／完了）に関わらず全タスクを対象に計算する必要があるため、
  // フィルター適用前のallTasksを渡す（navigation-priority-and-work-management-group-report.md参照）。
  refreshWorkManagementAlertCount(null, allTasks);
  let items = allTasks;
  if (App.taskFilter === 'pending') items = items.filter(t => !t.done);
  else if (App.taskFilter === 'done') items = items.filter(t => t.done);
  items.sort((a,b) => {
    if (a.done !== b.done) return a.done ? 1 : -1;
    const p = {high:0,medium:1,low:2};
    return (p[a.priority]||1) - (p[b.priority]||1);
  });

  document.getElementById('main').innerHTML = `
    <div class="section-header">
      <h2>タスク</h2>
      <button class="btn btn-primary" onclick="showTaskModal()">+ タスクを追加</button>
    </div>
    <div class="filter-bar">
      ${['all','pending','done'].map(f => `<button class="filter-btn ${App.taskFilter===f?'active':''}" onclick="App.taskFilter='${f}';renderTasks()">${{all:'すべて',pending:'未完了',done:'完了'}[f]}</button>`).join('')}
    </div>
    ${items.length ? items.map(t => `
      <div class="card task-item ${t.done?'done':''}">
        <input type="checkbox" ${t.done?'checked':''} onchange="toggleTask('${t.id}')">
        <span class="task-text">${esc(t.title)}</span>
        <span class="task-priority priority-${t.priority}">${{high:'高',medium:'中',low:'低'}[t.priority]||'中'}</span>
        ${t.dueDate ? `<span class="task-due">${formatDate(t.dueDate)}</span>` : ''}
        <button class="btn-ghost" onclick="showTaskModal('${t.id}')">&#9998;</button>
        <button class="btn-ghost" onclick="deleteItem('tasks','${t.id}','renderTasks')">&#10005;</button>
      </div>
    `).join('') : '<div class="empty-state"><div class="icon">&#9745;</div><p>タスクはありません</p></div>'}
  `;
}

async function toggleTask(id) {

async function showAppendModal(id) {
  const idea = await Store.find('ideas', id);
  if (!idea) return;
  showModal(`
    <h3>追記: ${esc(idea.title)}</h3>
    <div class="form-group"><label>追記内容</label><textarea id="idea-append-content" rows="5"></textarea></div>
    <div class="modal-actions">
      <button class="btn" onclick="closeModal()">キャンセル</button>
      <button class="btn btn-primary" id="idea-append-save-btn" onclick="saveIdeaAppend('${id}')">保存</button>
    </div>
  `);

async function saveIdeaAppend(id) {
  const btn = document.getElementById('idea-append-save-btn');
  const text = document.getElementById('idea-append-content').value.trim();
  if (!text) return alert('追記内容を入力してください');

  const idea = await Store.find('ideas', id);
  if (!idea) return;

  const separator = '-'.repeat(40);
  const block = `${separator}\n${dateStr(new Date())} 追記\n\n${text}\n\n${separator}`;
  const newContent = idea.content && idea.content.trim()
    ? `${idea.content.trim()}\n\n${block}`
    : block;

  btn.disabled = true;
  btn.textContent = '保存中...';
  const saved = await Store.update('ideas', id, { content: newContent });
  if (!saved) {
    btn.disabled = false;
    btn.textContent = '保存';
    return;
  }
  closeModal();
  renderIdeas();
}

// 編集部AI記事ライブラリ（Phase1）：editorial_articles専用の軽量ヘルパー。
// 既存のStoreは8フィールドぶんの分岐を増やすと肥大化するため、あえて分離する
// （report-editorial-library-phase1.mdの所見に基づく設計判断）。
const ArticleStore = {
  async add(item) {
    const row = {
      user_id: App.user.id,
      product_name: item.productName || '',
      product_url: item.productUrl || '',
      blog_title: item.blogTitle || '',
      seo_title: item.seoTitle || '',
      description: item.description || '',
      keywords: item.keywords || '',
      blog_html: item.blogHtml || '',
      x_post: item.xPost || '',
      instagram_caption: item.instagramCaption || '',
      // 画像HTML整形の「整形済みHTML」（同期元）をそのまま保存する。統合プロンプト側の
      // 複製欄ではなく同期元を正とする（blog-formatted-image-html-persistence-report.md参照）。
      formatted_image_html: item.formattedImageHtml || '',
      // 新規保存＝ブログ書庫に確定して並ぶ記事のため、常にpublishedとして書き込む
      // （blog-workflow-redesign-report.md参照。draftになるのはupdate()経由の再編集時のみ）。
      workflow_status: 'published',
      // 新規記事は常に未評価（0）で保存する（blog-library-rating-implementation-report.md参照）。
      rating: 0,
      published_url: item.publishedUrl || '',
      thumbnail_path: item.thumbnailPath || '',
      // 新規記事の拍手数は常に0・未確認で保存する（blog-publication-thumbnail-applause-management-report.md参照）。
      applause_count: 0,
      applause_checked_at: null,
    };
    const { data, error } = await sb.from('editorial_articles').insert(row).select().single();
    if (error) { console.error(error); return null; }
    return ArticleStore._fromDb(data);
  },
  // 再編集からの保存専用。INSERTではなくUPDATEで既存行を上書きする（重複記事を作らない）。
  // 保存が完了した時点でブログ書庫への「確定」を意味するため、workflow_statusをpublishedへ戻す。
  // rating・applause_count・applause_checked_atは意図的にUPDATE対象へ含めない：再編集保存のたびに
  // 評価や拍手数が初期化されてしまわないようにするため（blog-library-rating-implementation-report.md、
  // blog-publication-thumbnail-applause-management-report.md参照。評価・拍手数はそれぞれ専用の
  // setRating()・setApplauseCount()の経路でのみ更新する）。
  async update(id, item) {
    const row = {
      product_name: item.productName || '',
      product_url: item.productUrl || '',
      blog_title: item.blogTitle || '',
      seo_title: item.seoTitle || '',
      description: item.description || '',
      keywords: item.keywords || '',
      blog_html: item.blogHtml || '',
      x_post: item.xPost || '',
      instagram_caption: item.instagramCaption || '',
      // 新規保存と同じく、画像HTML整形側の値を正として上書きする
      // （blog-formatted-image-html-persistence-report.md参照）。
      formatted_image_html: item.formattedImageHtml || '',
      workflow_status: 'published',
      published_url: item.publishedUrl || '',
      thumbnail_path: item.thumbnailPath || '',
      updated_at: new Date().toISOString(),
    };
    const { error } = await sb.from('editorial_articles').update(row).eq('id', id);
    if (error) { console.error(error); return false; }
    return true;
  },
  async list() {
    const { data, error } = await sb.from('editorial_articles').select('*').order('created_at', { ascending: false });
    if (error) { console.error(error); return []; }
    return data.map(ArticleStore._fromDb);
  },
  async find(id) {
    const { data, error } = await sb.from('editorial_articles').select('*').eq('id', id).single();
    if (error) return null;
    return ArticleStore._fromDb(data);
  },
  async remove(id) {
    // サムネイル画像がStorage上に孤立して残らないよう、DB行の削除前に実ファイルを削除する
    // （商品カタログのCatalogStore.remove()と同じ責務分担。Storage削除が失敗してもDB削除は続行する。
    // blog-publication-thumbnail-applause-management-report.md参照）。
    // 削除対象DBテーブルはeditorial_articlesのみ。Obsidianの記事データには一切触れない
    // （report-editorial-library-delete.md参照）。
    const { data: existing } = await sb.from('editorial_articles').select('thumbnail_path').eq('id', id).single();
    if (existing && existing.thumbnail_path) {
      const { error: storageError } = await sb.storage.from(EDITORIAL_THUMBNAIL_BUCKET).remove([existing.thumbnail_path]);
      if (storageError) console.error('サムネイルのStorage削除に失敗しました（DB削除は続行します）:', storageError);
    }
    const { error } = await sb.from('editorial_articles').delete().eq('id', id);
    if (error) { console.error(error); return false; }
    return true;
  },
  // ★評価専用の軽量更新。記事全体を上書きせず、ratingだけをUPDATEする
  // （blog-library-rating-implementation-report.md参照）。0未満は0、5を超える値は5、
  // 数値以外は0へ正規化してから保存する。RLSに加え、user_id本人の記事のみを対象にする。
  async setRating(id, rating) {
    const safeRating = Math.max(0, Math.min(5, Number(rating) || 0));
    const { error } = await sb.from('editorial_articles')
      .update({ rating: safeRating, updated_at: new Date().toISOString() })
      .eq('id', id)
      .eq('user_id', App.user.id);
    if (error) { console.error(error); return false; }
    return true;
  },
  // サムネイル専用の軽量更新。新規記事の初回保存（INSERTでIDを採番した直後）に
  // アップロード結果を反映するために使う（blog-publication-thumbnail-applause-management-report.md参照）。
  async setThumbnailPath(id, path) {
    const { error } = await sb.from('editorial_articles')
      .update({ thumbnail_path: path || '', updated_at: new Date().toISOString() })
      .eq('id', id)
      .eq('user_id', App.user.id);
    if (error) { console.error(error); return false; }
    return true;
  },
  // 拍手数専用の軽量更新。記事全体を上書きせず、applause_count・applause_checked_atだけをUPDATEする
  // （blog-publication-thumbnail-applause-management-report.md参照）。countは0以上の整数へ正規化し、
  // RLSに加えuser_id本人の記事のみを対象にする。取得（保存）に失敗した場合は呼び出し側で
  // 既存表示を維持し、このメソッド自体は何も書き換えずfalseを返す。
  async setApplauseCount(id, count, checkedAt) {
    const safeCount = Math.max(0, Math.floor(Number(count) || 0));
    const { error } = await sb.from('editorial_articles')
      .update({ applause_count: safeCount, applause_checked_at: checkedAt || new Date().toISOString(), updated_at: new Date().toISOString() })
      .eq('id', id)
      .eq('user_id', App.user.id);
    if (error) { console.error(error); return false; }
    return true;
  },
  // blog_title専用の軽量更新。公開情報の自動取得でタイトルを反映する際に使う。
  // blog_title以外のフィールド（rating・applause_count・thumbnail_path等）には一切触れない
  // （livedoor-public-metadata-auto-fetch-report.md参照）。
  async setBlogTitle(id, blogTitle) {
    const { error } = await sb.from('editorial_articles')
      .update({ blog_title: blogTitle || '', updated_at: new Date().toISOString() })
      .eq('id', id)
      .eq('user_id', App.user.id);
    if (error) { console.error(error); return false; }
    return true;
  },
  _fromDb(r) {
    return {
      id: r.id,
      productName: r.product_name || '',
      productUrl: r.product_url || '',
      blogTitle: r.blog_title || '',
      seoTitle: r.seo_title || '',
      description: r.description || '',
      keywords: r.keywords || '',
      blogHtml: r.blog_html || '',
      xPost: r.x_post || '',
      instagramCaption: r.instagram_caption || '',
      // 未設定・nullは空文字として扱う（blog-formatted-image-html-persistence-report.md参照）。
      formattedImageHtml: r.formatted_image_html || '',
      // 既存記事との互換性維持：workflow_statusが未設定（null）の記事はpublishedとして扱う
      // （blog-workflow-redesign-report.md参照）。
      workflowStatus: r.workflow_status || 'published',
      // null・未設定・数値以外は0、0未満は0、5を超える値は5へ正規化する
      // （blog-library-rating-implementation-report.md参照）。
      rating: Math.max(0, Math.min(5, Number(r.rating) || 0)),
      publishedUrl: r.published_url || '',
      thumbnailPath: r.thumbnail_path || '',
      // null・未設定・数値以外は0、0未満は0として扱う（blog-publication-thumbnail-applause-management-report.md参照）。
      applauseCount: Math.max(0, Math.floor(Number(r.applause_count) || 0)),
      applauseCheckedAt: r.applause_checked_at || null,
      createdAt: r.created_at,
      updatedAt: r.updated_at,
    };
  },
};

// 顧客返信履歴：customer_replies専用の軽量ヘルパー。ArticleStoreと同じ理由
// （既存Storeを肥大化させない）で分離する（customer-reply-history-implementation-plan.md参照）。
const ReplyHistoryStore = {
  async add(item) {
    const row = {
      user_id: App.user.id,
      ai_secretary_id: item.aiSecretaryId || '',
      customer_name: item.customerName || '',
      channel: item.channel || '',
      content: item.content || '',
    };
    const { data, error } = await sb.from('customer_replies').insert(row).select().single();
    if (error) { console.error(error); return null; }
    return ReplyHistoryStore._fromDb(data);
  },
  async listByCustomer(aiSecretaryId) {
    const { data, error } = await sb.from('customer_replies')
      .select('*')
      .eq('ai_secretary_id', aiSecretaryId)
      .order('created_at', { ascending: false });
    if (error) { console.error(error); return []; }
    return data.map(ReplyHistoryStore._fromDb);
  },
  // 「メール返信」画面の「過去のやり取り」用。顧客IDが判明している場合はID完全一致、
  // 無い場合のみcustomer_name完全一致で、対象顧客の返信ログだけをまとめて取得する
  // （1回のクエリで完結させ、記事・案件ごとの個別取得＝N+1取得を避ける。
  // customer-reply-inline-history-report.md参照）。
  async listByIdentity(identity) {
    if (!identity) return [];
    let query = sb.from('customer_replies').select('*');
    if (identity.id) query = query.eq('ai_secretary_id', identity.id);
    else if (identity.name) query = query.eq('customer_name', identity.name);
    else return [];
    const { data, error } = await query.order('created_at', { ascending: false });
    if (error) { console.error(error); return []; }
    return data.map(ReplyHistoryStore._fromDb);
  },
  // 「過去のやり取り」一覧の個別削除用。id一致・user_id本人分のみを対象とし、
  // 他の返信ログには一切影響しない（customer-reply-inline-history-delete-report.md参照）。
  async remove(id) {
    const { error } = await sb.from('customer_replies').delete().eq('id', id).eq('user_id', App.user.id);
    if (error) { console.error(error); return false; }
    return true;
  },
  _fromDb(r) {
    return {
      id: r.id,
      aiSecretaryId: r.ai_secretary_id || '',
      customerName: r.customer_name || '',
      channel: r.channel || '',
      content: r.content || '',
      createdAt: r.created_at,
      updatedAt: r.updated_at,
    };
  },
};

// 顧客対応案件：customer_correspondences専用の軽量ヘルパー。ReplyHistoryStore/ArticleStoreと
// 同じ理由（既存Storeを肥大化させない）で分離する
// （customer-correspondence-management-phase1-report.md参照）。
// customer_repliesとの違い：customer_repliesは「送った返信文のログ」のみの軽量履歴（変更なし）。
// こちらは対応状況・次回対応日・フォロー期限・長期監視案件まで管理する案件単位のテーブル。
const CorrespondenceStore = {
  async add(item) {
    const row = {
      user_id: App.user.id,
      customer_name: item.customerName || '',
      subject: item.subject || '',
      inquiry_text: item.inquiryText || '',
      reply_text: item.replyText || '',
      status: item.status || 'unhandled',
      next_action_date: item.nextActionDate || null,
      follow_up_deadline: item.followUpDeadline || null,
      target_period: item.targetPeriod || '',
      monitoring_note: item.monitoringNote || '',
      memo: item.memo || '',
      // 顧客IDが判明していれば保存する（「過去のやり取り」のID優先照合に使う。
      // customer-reply-inline-history-report.md参照）。未判明の場合はnullのまま。
      ai_secretary_id: item.aiSecretaryId || null,
      // 新規保存時点でstatusがcompletedの場合のみcompleted_atを入れる（通常はnull）。
      completed_at: item.status === 'completed' ? new Date().toISOString() : null,
    };
    const { data, error } = await sb.from('customer_correspondences').insert(row).select().single();
    if (error) { console.error(error); return null; }
    return CorrespondenceStore._fromDb(data);
  },
  // 再編集からの保存専用。INSERTではなくUPDATEで既存行を上書きする（重複記事を作らない。
  // ArticleStore.update()と同じ考え方）。completed_atは、statusの遷移（previousStatusとの比較）
  // に応じてのみ更新する：
  // - completed以外→completed：現在時刻を設定
  // - completed→completed以外：nullへ戻す
  // - それ以外（遷移なし）：completed_atはUPDATE対象へ含めず、既存の値をそのまま維持する
  // ai_secretary_idも同様に、新しい値が判明した場合のみUPDATE対象へ含める。再編集時に
  // 顧客が未解決（App.selectedCustomerが空）のまま保存しても、既存の紐付けを消さないため
  // （customer-reply-inline-history-report.md参照）。
  async update(id, item, previousStatus) {
    const row = {
      customer_name: item.customerName || '',
      subject: item.subject || '',
      inquiry_text: item.inquiryText || '',
      reply_text: item.replyText || '',
      status: item.status || 'unhandled',
      next_action_date: item.nextActionDate || null,
      follow_up_deadline: item.followUpDeadline || null,
      target_period: item.targetPeriod || '',
      monitoring_note: item.monitoringNote || '',
      memo: item.memo || '',
      updated_at: new Date().toISOString(),
    };
    if (item.aiSecretaryId) row.ai_secretary_id = item.aiSecretaryId;
    if (item.status === 'completed' && previousStatus !== 'completed') {
      row.completed_at = new Date().toISOString();
    } else if (item.status !== 'completed' && previousStatus === 'completed') {
      row.completed_at = null;
    }
    const { error } = await sb.from('customer_correspondences').update(row).eq('id', id).eq('user_id', App.user.id);
    if (error) { console.error(error); return false; }
    return true;
  },
  async list() {
    const { data, error } = await sb.from('customer_correspondences').select('*').order('updated_at', { ascending: false });
    if (error) { console.error(error); return []; }
    return data.map(CorrespondenceStore._fromDb);
  },
  // 「メール返信」画面の「過去のやり取り」用。顧客IDが判明している場合はID完全一致、
  // 無い場合のみcustomer_name完全一致で、対象顧客の案件だけをまとめて取得する
  // （1回のクエリで完結させ、案件ごとの個別取得＝N+1取得を避ける）。
  async listByIdentity(identity) {
    if (!identity) return [];
    let query = sb.from('customer_correspondences').select('*');
    if (identity.id) query = query.eq('ai_secretary_id', identity.id);
    else if (identity.name) query = query.eq('customer_name', identity.name);
    else return [];
    const { data, error } = await query.order('updated_at', { ascending: false });
    if (error) { console.error(error); return []; }
    return data.map(CorrespondenceStore._fromDb);
  },
  async find(id) {
    const { data, error } = await sb.from('customer_correspondences').select('*').eq('id', id).single();
    if (error) return null;
    return CorrespondenceStore._fromDb(data);
  },
  async remove(id) {
    const { error } = await sb.from('customer_correspondences').delete().eq('id', id).eq('user_id', App.user.id);
    if (error) { console.error(error); return false; }
    return true;
  },
  // 顧客対応書庫カードの「完了」ボタン専用の軽量更新。他のフィールドには一切触れず、
  // statusとcompleted_atだけをUPDATEする（update()と同じcompleted_at遷移ルールを適用）。
  async setStatus(id, status, previousStatus) {
    const row = { status, updated_at: new Date().toISOString() };
    if (status === 'completed' && previousStatus !== 'completed') {
      row.completed_at = new Date().toISOString();
    } else if (status !== 'completed' && previousStatus === 'completed') {
      row.completed_at = null;
    }
    const { error } = await sb.from('customer_correspondences').update(row).eq('id', id).eq('user_id', App.user.id);
    if (error) { console.error(error); return false; }
    return true;
  },
  _fromDb(r) {
    return {
      id: r.id,
      customerName: r.customer_name || '',
      subject: r.subject || '',
      inquiryText: r.inquiry_text || '',
      replyText: r.reply_text || '',
      status: r.status || 'unhandled',
      nextActionDate: r.next_action_date || '',
      followUpDeadline: r.follow_up_deadline || '',
      targetPeriod: r.target_period || '',
      monitoringNote: r.monitoring_note || '',
      memo: r.memo || '',
      createdAt: r.created_at,
      updatedAt: r.updated_at,
      completedAt: r.completed_at || null,
      aiSecretaryId: r.ai_secretary_id || '',
    };
  },
};

const EventBrandStore = {
  async listByEvent(eventId) {
    const { data, error } = await sb.from('event_brands').select('*').eq('event_id', eventId).order('created_at', { ascending: true });
    if (error) { console.error(error); return []; }
    return data.map(EventBrandStore._fromDb);
  },
  // 複数イベント分の対象ブランドを1回のクエリでまとめて取得する（イベント一覧のN+1取得を避ける）。
  async listByEventIds(eventIds) {
    if (!eventIds.length) return [];
    const { data, error } = await sb.from('event_brands').select('*').in('event_id', eventIds);
    if (error) { console.error(error); return []; }
    return data.map(EventBrandStore._fromDb);
  },
  // 新規登録画面の複数ブランド入力をそのままINSERTする（新規イベント保存時専用）。
  async addAll(eventId, brandNames) {
    const rows = brandNames.filter(Boolean).map(name => ({ user_id: App.user.id, event_id: eventId, brand_name: name }));
    if (!rows.length) return true;
    const { error } = await sb.from('event_brands').insert(rows);
    if (error) { console.error(error); return false; }
    return true;
  },
  // 再編集保存専用：現在の対象ブランド名リストと差分を取り、追加分のみINSERT・
  // 除外分のみDELETEする（安全な置き換え。要件6「never silently delete related watchers」の
  // 通り、event_watchersにはここから一切触れない）。
  async replaceForEvent(eventId, brandNames) {
    const desired = [...new Set(brandNames.filter(Boolean))];
    const existing = await EventBrandStore.listByEvent(eventId);
    const existingNames = existing.map(b => b.brandName);
    const toAdd = desired.filter(n => !existingNames.includes(n));
    const toRemove = existing.filter(b => !desired.includes(b.brandName));
    if (toAdd.length) {
      const rows = toAdd.map(name => ({ user_id: App.user.id, event_id: eventId, brand_name: name }));
      const { error } = await sb.from('event_brands').insert(rows);
      if (error) { console.error(error); return false; }
    }
    for (const b of toRemove) {
      const { error } = await sb.from('event_brands').delete().eq('id', b.id).eq('user_id', App.user.id);
      if (error) { console.error(error); return false; }
    }
    return true;
  },
  _fromDb(r) {
    return { id: r.id, eventId: r.event_id, brandName: r.brand_name, createdAt: r.created_at };
  },
};

// イベントの開催予定表示：date_modeに応じて表示形式を切り替える（要件5・13参照）。
function formatEventSchedule(ev) {
  if (ev.dateMode === 'fixed' && ev.startDate) {
    return ev.endDate && ev.endDate !== ev.startDate ? `${ev.startDate}〜${ev.endDate}` : ev.startDate;
  }
  if (ev.dateMode === 'approximate') return ev.targetPeriod || '時期未設定';
  return '未定';
}
