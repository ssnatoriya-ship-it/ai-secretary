// ── カラーミーCSV変換（Phase1：読込・結合・プレビューのみ）─────────────────
// 既存の商品カタログ（CatalogStore/CatalogLibrary）・Google Merchant CSV機能とは
// 完全に分離した独立機能。状態も共有しない。Supabaseへは一切アクセスせず、選択した
// ファイルはブラウザのメモリ内だけで処理する（ページを再読み込みするとデータは消える）。
// Merchant形式への変換・size/color判定・availability変換・価格補完・CSVダウンロード・
// DB保存はいずれもPhase1のスコープ外（colorme-csv-converter-phase1-report.md参照）。
// 値の推測・補完・変換は一切行わない（読み込んだ値をそのまま集計・表示するのみ）。

const COLORME_CSV_PREVIEW_LIMIT = 50;

const ColormeCsvConverter = {
  productFile: null,
  optionFile: null,
  result: null, // 両ファイル処理後に { summary, previewRows, warnings, errors, full } を保持
  isProcessing: false,
  merchantResult: null, // Phase3：集計・理由別件数（{ summary, noteReasonCounts, rejectReasonCounts }）
  merchantRows: null, // Phase3：全行（TSV/監査CSV生成・重複id検出・プレビューフィルターに使用）
  merchantPreviewFilter: 'all',
  merchantPreviewPage: 1, // Merchant変換プレビューの商品単位ページネーション（1始まり）
  isMerchantProcessing: false,
  includeSoldOutProducts: false, // 全サイズ完売商品もTSVへ含めるか（初期値OFF＝除外する）
};

function resetColormeCsvConverter() {
  ColormeCsvConverter.productFile = null;
  ColormeCsvConverter.optionFile = null;
  ColormeCsvConverter.result = null;
  ColormeCsvConverter.isProcessing = false;
  ColormeCsvConverter.merchantResult = null;
  ColormeCsvConverter.merchantRows = null;
  ColormeCsvConverter.merchantPreviewFilter = 'all';
  ColormeCsvConverter.merchantPreviewPage = 1;
  ColormeCsvConverter.isMerchantProcessing = false;
  ColormeCsvConverter.includeSoldOutProducts = false;
  renderColormeCsvConverter();
}

function renderColormeCsvConverter() {
  const r = ColormeCsvConverter.result;
  document.getElementById('main').innerHTML = `
    <div class="section-header">
      <h2>カラーミーCSV変換</h2>
    </div>
    <div class="card">
      <p class="idea-plan-note">商品カタログ・Google Merchant CSV出力とは独立した機能です（Phase1：読込・結合・件数集計・先頭${COLORME_CSV_PREVIEW_LIMIT}件のプレビューのみ。Merchant形式への変換・CSVダウンロード・保存はまだ行いません）。選択したファイルはブラウザ内でのみ処理し、Supabaseへは送信されません。ページを再読み込みすると消去されます。</p>
      <div class="form-group">
        <label>商品CSV（product.csv、CP932）</label>
        <input type="file" id="colorme-product-file" accept=".csv" onchange="handleColormeProductFileSelect(event)">
      </div>
      <div class="form-group">
        <label>商品オプションCSV（option_csv_download_*.csv、CP932）</label>
        <input type="file" id="colorme-option-file" accept=".csv" onchange="handleColormeOptionFileSelect(event)">
      </div>
      <div style="margin-top:12px">
        <button class="btn" onclick="resetColormeCsvConverter()">ファイルを再選択（リセット）</button>
      </div>
      ${ColormeCsvConverter.isProcessing ? '<p class="idea-plan-note" style="margin-top:12px">読み込み中...</p>' : ''}
    </div>
    ${r ? renderColormeCsvSummary(r) : ''}
    ${r ? renderColormeCsvPreviewTable(r) : ''}
    ${(r && r.summary && r.summary.errorCount === 0) ? renderColormeMerchantConvertSection() : ''}
    ${ColormeCsvConverter.merchantResult ? renderColormeMerchantSummary(ColormeCsvConverter.merchantResult) : ''}
    ${ColormeCsvConverter.merchantResult ? renderColormeMerchantPreviewTable() : ''}
  `;
}

function renderColormeMerchantConvertSection() {
  return `
    <div class="card" style="margin-top:20px">
      <p class="idea-plan-note">Phase3：結合済みデータをGoogle Merchant形式へ変換し、判定（掲載可能／注意あり・掲載可能／掲載不可）付きでプレビューします。AI秘書の商品カタログ（CatalogStore/Supabase）とは一切照合しません。既存の商品カタログ・既存Google Merchant CSV機能は変更しません。</p>
      <div style="margin-top:12px">
        <button class="btn" onclick="runColormeMerchantConversion()">Google Merchant形式へ変換（プレビュー）</button>
      </div>
      ${ColormeCsvConverter.isMerchantProcessing ? '<p class="idea-plan-note" style="margin-top:12px">変換中...</p>' : ''}
    </div>
  `;
}

async function handleColormeProductFileSelect(event) {
  const file = event.target.files && event.target.files[0];
  if (!file) return;
  ColormeCsvConverter.productFile = file;
  await tryRunColormeCsvJoin();
}

async function handleColormeOptionFileSelect(event) {
  const file = event.target.files && event.target.files[0];
  if (!file) return;
  ColormeCsvConverter.optionFile = file;
  await tryRunColormeCsvJoin();
}

// 両方のファイルが選択されるまでは処理を確定しない（要件「読み込んだ時点では何も更新しない」
// 「ユーザーがCSV生成を実行するまで処理を確定しない」の趣旨に沿い、Phase1では
// 「2ファイル揃った時点で読込・結合・プレビューまでは自動実行し、それ以上（変換・保存）は
// 一切行わない」設計とする）。
async function tryRunColormeCsvJoin() {
  if (!ColormeCsvConverter.productFile || !ColormeCsvConverter.optionFile) return;
  ColormeCsvConverter.isProcessing = true;
  ColormeCsvConverter.result = null;
  renderColormeCsvConverter();

  try {
    const [productText, optionText] = await Promise.all([
      decodeCp932File(ColormeCsvConverter.productFile),
      decodeCp932File(ColormeCsvConverter.optionFile),
    ]);
    const productParse = parseColormeCsv(productText);
    const optionParse = parseColormeCsv(optionText);
    ColormeCsvConverter.result = joinColormeProductsWithOptions(productParse, optionParse);
  } catch (e) {
    console.error(e);
    ColormeCsvConverter.result = {
      summary: null,
      previewRows: [],
      warnings: [],
      errors: [`読み込み中にエラーが発生しました：${e && e.message ? e.message : e}`],
    };
  }
  ColormeCsvConverter.isProcessing = false;
  renderColormeCsvConverter();
}

// CP932（Shift_JISの上位互換）をブラウザ標準のTextDecoderで読み取る。外部ライブラリは不要
// （WHATWG Encoding Standardで'shift_jis'・'cp932'とも同一デコーダとして扱われる）。
async function decodeCp932File(file) {
  const buffer = await file.arrayBuffer();
  const decoder = new TextDecoder('shift_jis');
  return decoder.decode(buffer);
}

// PapaParseでCSVを解析する（ヘッダー行あり）。商品説明等に引用符内改行を含む実データのため、
// 単純なsplit('\n')ではなくRFC4180準拠のパーサー（PapaParse）を使用する。
function parseColormeCsv(text) {
  return Papa.parse(text, { header: true, skipEmptyLines: true });
}

// 商品CSVとオプションCSVを商品IDで結合する。値の推測・補完・変換は一切行わない。
function joinColormeProductsWithOptions(productParse, optionParse) {
  const warnings = [];
  const errors = [];

  (productParse.errors || []).forEach(e => errors.push(`商品CSV解析エラー（行${e.row}）：${e.message}`));
  (optionParse.errors || []).forEach(e => errors.push(`オプションCSV解析エラー（行${e.row}）：${e.message}`));

  const products = productParse.data || [];
  const optionRows = optionParse.data || [];
  const productIds = new Set(products.map(p => p['商品ID']));

  // オプションCSVを商品IDごとにグルーピングする。name行は見出し、item行は明細として扱う。
  const optionsByProductId = {};
  const seenOptionIds = new Set();

  optionRows.forEach((row, idx) => {
    const csvLineNo = idx + 2; // ヘッダー行を1行目として数える
    const productId = row['商品ID'];
    const kind = row['登録種別'];

    if (kind !== 'name' && kind !== 'item') {
      warnings.push(`オプションCSV ${csvLineNo}行目：登録種別が不明です（"${kind}"）`);
      return;
    }
    if (productId && !productIds.has(productId)) {
      warnings.push(`オプションCSV ${csvLineNo}行目：商品CSVに存在しない商品ID「${productId}」`);
    }
    if (!optionsByProductId[productId]) {
      optionsByProductId[productId] = { heading1: '', heading2: '', items: [] };
    }
    if (kind === 'name') {
      optionsByProductId[productId].heading1 = row['オプション名１'] || '';
      optionsByProductId[productId].heading2 = row['オプション名２'] || '';
    } else {
      const optionId = row['オプションID'];
      if (!optionId) {
        warnings.push(`オプションCSV ${csvLineNo}行目：オプションIDが空欄です（商品ID「${productId}」）`);
      } else if (seenOptionIds.has(optionId)) {
        warnings.push(`オプションCSV ${csvLineNo}行目：オプションID「${optionId}」が重複しています`);
      } else {
        seenOptionIds.add(optionId);
      }
      optionsByProductId[productId].items.push(row);
    }
  });

  let withOptionsCount = 0;
  let withoutOptionsCount = 0;
  const joined = products.map(p => {
    const productId = p['商品ID'];
    const opt = optionsByProductId[productId];
    const hasOptions = !!(opt && opt.items.length);
    if (hasOptions) withOptionsCount++; else withoutOptionsCount++;
    return {
      productId,
      productName: p['商品名'] || '',
      publishSetting: p['掲載設定'] || '',
      price: p['販売価格'] || '',
      stockManagement: p['在庫管理'] || '',
      heading1: opt ? opt.heading1 : '',
      heading2: opt ? opt.heading2 : '',
      optionCount: opt ? opt.items.length : 0,
    };
  });

  const nameRowCount = optionRows.filter(r => r['登録種別'] === 'name').length;
  const itemRowCount = optionRows.filter(r => r['登録種別'] === 'item').length;

  const summary = {
    productCount: products.length,
    withOptionsCount,
    withoutOptionsCount,
    nameRowCount,
    itemRowCount,
    joinedCount: joined.length,
    warningCount: warnings.length,
    errorCount: errors.length,
  };

  return {
    summary,
    previewRows: joined.slice(0, COLORME_CSV_PREVIEW_LIMIT),
    warnings,
    errors,
    // Phase2（Merchant形式変換）で使用する、全件・未加工の結合結果。
    // Phase1のプレビュー用previewRows（先頭50件・要約フィールドのみ）とは別に保持する。
    full: { products, optionsByProductId },
  };
}

function renderColormeCsvSummary(r) {
  const s = r.summary;
  if (!s) {
    return `<div class="card" style="margin-top:20px"><p style="color:var(--danger)">読み込みに失敗しました。</p>${r.errors.map(e => `<p class="idea-plan-note">${esc(e)}</p>`).join('')}</div>`;
  }
  return `
    <div class="card" style="margin-top:20px">
      <h3 style="margin-bottom:12px">件数集計</h3>
      <p>商品CSV件数：${s.productCount}件</p>
      <p>オプションあり商品数：${s.withOptionsCount}件</p>
      <p>オプションなし商品数：${s.withoutOptionsCount}件</p>
      <p>name行件数：${s.nameRowCount}件</p>
      <p>item行件数：${s.itemRowCount}件</p>
      <p>結合成功件数：${s.joinedCount}件</p>
      <p>警告件数：${s.warningCount}件</p>
      <p>エラー件数：${s.errorCount}件</p>
      ${r.warnings.length ? `
        <details style="margin-top:12px">
          <summary style="cursor:pointer;font-weight:600">警告一覧（${r.warnings.length}件）</summary>
          <div style="max-height:240px;overflow-y:auto;margin-top:8px">
            ${r.warnings.slice(0, 200).map(w => `<p class="idea-plan-note" style="margin:2px 0">${esc(w)}</p>`).join('')}
            ${r.warnings.length > 200 ? `<p class="idea-plan-note">…他${r.warnings.length - 200}件</p>` : ''}
          </div>
        </details>
      ` : ''}
      ${r.errors.length ? `
        <details open style="margin-top:12px">
          <summary style="cursor:pointer;font-weight:600;color:var(--danger)">エラー一覧（${r.errors.length}件）</summary>
          <div style="max-height:240px;overflow-y:auto;margin-top:8px">
            ${r.errors.map(e => `<p class="idea-plan-note" style="margin:2px 0;color:var(--danger)">${esc(e)}</p>`).join('')}
          </div>
        </details>
      ` : ''}
    </div>
  `;
}

// 先頭COLORME_CSV_PREVIEW_LIMIT件のみDOMへ描画する（数千件規模の全件描画を避けるため。
// 商品説明等の長文フィールドはここでは一切表示しない）。
function renderColormeCsvPreviewTable(r) {
  if (!r.summary || !r.previewRows.length) return '';
  return `
    <div class="card" style="margin-top:20px">
      <h3 style="margin-bottom:12px">結合結果プレビュー（先頭${r.previewRows.length}件 / 全${r.summary.joinedCount}件）</h3>
      <div style="overflow-x:auto">
        <table style="width:100%;border-collapse:collapse;font-size:13px;white-space:nowrap">
          <thead>

// 示す語のみに限定して登録する。実データの未解決16商品を確認した結果、いずれも修理・送料・
// イベント予約等の非商品行、またはGoogle公式Taxonomy上に対応する適切なカテゴリが見当たらない
// 商品群（マルチケース・トレー・ニット/セーター・ハンガー等）であり、商品名からの安全な補助
// 判定は該当なしと判断した（無理に割り当てず空欄のままとする）。
const COLORME_GOOGLE_CATEGORY_NAME_HINT_RULES = [];

// 判定優先順位：①大カテゴリー＋小カテゴリーの完全一致 → ②小カテゴリー単独で明確に判定できる場合
// → ③商品名による限定的な補助判定 → ④判定不能なら空欄。
function resolveColormeGoogleProductCategory(majorCategory, minorCategory, productName) {
  const major = (majorCategory || '').trim();
  const minor = (minorCategory || '').trim();
  const comboKey = `${major}|${minor}`;
  if (COLORME_GOOGLE_CATEGORY_MAP[comboKey]) {
    return { id: COLORME_GOOGLE_CATEGORY_MAP[comboKey], matchType: 'exact_combo' };
  }
  if (minor && COLORME_GOOGLE_CATEGORY_MINOR_ONLY_MAP[minor]) {
    return { id: COLORME_GOOGLE_CATEGORY_MINOR_ONLY_MAP[minor], matchType: 'minor_only' };
  }
  const name = productName || '';
  for (const rule of COLORME_GOOGLE_CATEGORY_NAME_HINT_RULES) {
    if (name.includes(rule.keyword)) {
      return { id: rule.id, matchType: 'product_name_hint' };
    }
  }
  return { id: '', matchType: 'unresolved' };
}

};

// 「必須項目不足件数」集計に含める理由（非商品オプション／重複ID／出力を壊す値は別カテゴリとして除く）。
const COLORME_REQUIRED_FIELD_REJECT_REASONS = new Set([
  COLORME_REJECT_REASON.OPTION_ID_BLANK,
  COLORME_REJECT_REASON.ID_BLANK,
  COLORME_REJECT_REASON.TITLE_BLANK,
  COLORME_REJECT_REASON.DESCRIPTION_BLANK,
  COLORME_REJECT_REASON.LINK_UNAVAILABLE,
  COLORME_REJECT_REASON.IMAGE_LINK_INVALID,
  COLORME_REJECT_REASON.PRICE_INVALID,
  COLORME_REJECT_REASON.STOCK_UNDETERMINED,
  COLORME_REJECT_REASON.STOCK_MANAGEMENT_UNKNOWN,
  COLORME_REJECT_REASON.BRAND_BLANK_NEW,
  COLORME_REJECT_REASON.BRAND_TOO_LONG,
]);
function isColormeRequiredFieldMissingReason(reason) {
  return COLORME_REQUIRED_FIELD_REJECT_REASONS.has(reason) || reason.startsWith(COLORME_REJECT_REASON.CONDITION_UNCONVERTIBLE_PREFIX);
}

// 既存カタログのHTML除去処理とは接続せず、Colorme機能内で独立して保持する。
// HTMLタグ除去→HTMLエンティティ復元→タブ/改行を空白へ→制御文字除去→連続空白整理→前後空白除去。
function stripColormeHtmlTags(text) {
  if (!text) return '';
  let s = String(text).replace(/<[^>]*>/g, ' ');
  s = decodeColormeHtmlEntities(s);
  s = s.replace(/[\x00-\x08\x0B\x0C\x0E-\x1F\x7F]/g, '');
  s = s.replace(/\s+/g, ' ');
  return s.trim();
}

// ブラウザのHTMLパーサーを利用してエンティティ（&amp;等の名前付き参照・数値参照）を復元する。
function decodeColormeHtmlEntities(text) {
  if (!text) return '';
  const el = document.createElement('textarea');
  el.innerHTML = text;
  return el.value;
}

// image_link/additional_image_linkはHTTPS必須（httpは不可）。前方一致ではなくURLとして
// 正常に解析できること・protocolがhttps:であること・hostnameが空でないことまで確認する。
// new URL()はホスト名中の空白等をパーセントエンコードして受理してしまう（例："https://not valid"を
// hostname="not%20valid"として通してしまう）ため、hostnameが素直なホスト名文字のみで構成されている
// ことも合わせて検証する。
function isColormeHttpsUrl(url) {
  const u = (url || '').trim();
  if (!u) return false;
  try {
    const parsed = new URL(u);
    if (parsed.protocol !== 'https:') return false;
    if (!parsed.hostname) return false;
    return /^[a-z0-9.-]+$/i.test(parsed.hostname);
  } catch (e) {
    return false;
  }
}

// カラーミーの「状態」値をGoogle Merchant許可値（new/used/refurbished）へ正規化する。
// 完全一致のみ（日本語：新品/中古/再生品、英字：大文字小文字問わずnew/used/refurbished）。
// 空欄は'new'。該当しない値はnullを返す（呼び出し側で掲載不可として扱う。推測変換はしない）。
function normalizeColormeCondition(value) {
  const trimmed = (value || '').trim();
  if (!trimmed) return 'new';
  if (COLORME_CONDITION_JA_TO_EN[trimmed]) return COLORME_CONDITION_JA_TO_EN[trimmed];
  const lower = trimmed.toLowerCase();
  if (COLORME_ALLOWED_CONDITIONS.includes(lower)) return lower;
  return null;
}

// GTINのGS1標準チェックデジット検証（8/12/13/14桁共通：右端の桁の左隣から3,1を交互に乗算）。
function isValidColormeGtinChecksum(digits) {
  const nums = digits.split('').map(Number);
  const checkDigit = nums[nums.length - 1];
  const payload = nums.slice(0, -1).reverse();
  let sum = 0;
  payload.forEach((d, i) => { sum += d * (i % 2 === 0 ? 3 : 1); });
  const calculated = (10 - (sum % 10)) % 10;
  return calculated === checkDigit;
}

// GTINを検証・正規化する。空白・ハイフン除去後、数字のみ・8/12/13/14桁・チェックデジット一致が
// すべて必要。無効な場合はvalueを空欄にしてnoteを返す（掲載不可にはしない。推測・桁埋めはしない）。
function validateAndNormalizeColormeGtin(rawValue) {
  const trimmed = (rawValue || '').trim();
  if (!trimmed) return { value: '', note: null };
  const cleaned = trimmed.replace(/[\s-]/g, '');
  const isValid = /^\d+$/.test(cleaned) && [8, 12, 13, 14].includes(cleaned.length) && isValidColormeGtinChecksum(cleaned);
  if (isValid) return { value: cleaned, note: null };
  return { value: '', note: 'GTIN形式不正のため未出力' };
}

// 販促文言（送料込み／送料無料）を除去してからキーワード照合できるようにする。
// 通常商品の商品名にこれらの文言だけが含まれるケースを誤除外しないための前処理。
function maskColormeSafePromotionalPhrases(text) {
  let s = text || '';
  COLORME_NON_PRODUCT_SAFE_PHRASES.forEach(phrase => { s = s.split(phrase).join(''); });
  return s;
}

// 商品名・オプション見出し・オプション値（実際の選択値）を総合して、送料・配送・手数料関連の
// 非商品オプションであることが明示的な語句で判定できる場合に理由文字列を返す（該当なしはnull）。
// 曖昧な文章推測はしない。部分一致だが、販促文言（送料込み／送料無料）はマスクしてから照合する。
function findColormeNonProductOptionReason(productName, heading1, heading2, optionItems) {
  const h1 = (heading1 || '').trim();
  const h2 = (heading2 || '').trim();
  const headingSet = new Set([h1, h2].filter(Boolean));
  const isShippingHeadingPair = headingSet.size === 2 &&
    COLORME_NON_PRODUCT_HEADING_PAIR.every(h => headingSet.has(h));
  if (isShippingHeadingPair) {
    return `オプション見出しが「${COLORME_NON_PRODUCT_HEADING_PAIR.join('」「')}」の組み合わせ`;
  }

  const maskedName = maskColormeSafePromotionalPhrases(productName);
  const nameMatch = COLORME_NON_PRODUCT_KEYWORDS.find(k => maskedName.includes(k));
  if (nameMatch) return `商品名に「${nameMatch}」を含む`;

  const maskedH1 = maskColormeSafePromotionalPhrases(h1);
  const maskedH2 = maskColormeSafePromotionalPhrases(h2);
  const headingMatch = COLORME_NON_PRODUCT_KEYWORDS.find(k => maskedH1.includes(k) || maskedH2.includes(k));
  if (headingMatch) return `オプション見出しに「${headingMatch}」を含む`;

  for (const item of (optionItems || [])) {
    const v1 = maskColormeSafePromotionalPhrases((item['オプション名１'] || '').trim());
    const v2 = maskColormeSafePromotionalPhrases((item['オプション名２'] || '').trim());
    const valueMatch = COLORME_NON_PRODUCT_KEYWORDS.find(k => v1.includes(k) || v2.includes(k));
    if (valueMatch) return `オプション値に「${valueMatch}」を含む`;
  }

  return null;
}

// 1語（term）のテキスト中での一致位置を返す（一致しなければ-1）。英字のみの語は単語境界
// （\b）付き・大文字小文字を無視して照合し、"RED"が"PREFERRED"等に部分一致するのを防ぐ。
// さらに、一致直後が「-数字」（例："BG-03"）の場合は型番の一部とみなし、その出現はスキップして
// 同じ語の他の出現を探す（実データで"BG-03"/"BG-04"というバングル型番がBeigeへ誤補完される
// 事例を確認したための対策）。
// 日本語を含む語は\bが\w=英数字との境界にしか反応せず、日本語の複合語（例："925シルバーリング"）
// で右側の境界判定に失敗するため、単純な部分一致（indexOf）で照合する（既存のブランド辞書
// findColormeBrandMatchesInTextと同じ方針）。
function colormeFindColorTermIndex(raw, term) {
  const isAsciiTerm = /^[\x00-\x7F]+$/.test(term);
  if (isAsciiTerm) {
    const re = new RegExp(`\\b${colormeEscapeRegExp(term)}\\b`, 'ig');
    let m;
    while ((m = re.exec(raw)) !== null) {
      const after = raw.slice(m.index + term.length, m.index + term.length + 2);
      const looksLikeModelNumberSuffix = /^-\d/.test(after);
      if (!looksLikeModelNumberSuffix) return m.index;
      re.lastIndex = m.index + 1;
    }
    return -1;
  }
  return raw.indexOf(term);
}

// テキスト中の色一致箇所を検出し、テキスト中に最初に現れた順にcanonical表記（重複なし）の
// 配列を返す。順序は複数色を「/」結合する際に、商品名・値中の記載順
// （例："NAVY TAN BROWN"→Navy/Tan/Brown）を保つために使用する。
function findColormeColorMatchesInText(text) {
  const raw = text || '';
  const found = [];
  COLORME_COLOR_TERM_GROUPS.forEach(group => {
    let bestIndex = -1;
    [...group.terms, ...group.shortTerms].forEach(term => {
      const idx = colormeFindColorTermIndex(raw, term);
      if (idx !== -1 && (bestIndex === -1 || idx < bestIndex)) bestIndex = idx;
    });
    if (bestIndex !== -1) found.push({ canonical: group.canonical, index: bestIndex });
  });
  found.sort((a, b) => a.index - b.index);
  return found.map(f => f.canonical);
}

// color自動取得 優先順位2：商品CSVの色列。'/'区切りの複数値（例："brown/gray"）はセグメント
// ごとに照合し、一致した全canonicalを出現順に重複なく「/」結合して返す（複数色を維持する）。
function resolveColormeColorFromProductColumn(rawValue) {
  const trimmed = (rawValue || '').trim();
  if (!trimmed) return { color: '', candidates: [] };
  const seen = new Set();
  const ordered = [];
  trimmed.split('/').forEach(segment => {
    findColormeColorMatchesInText(segment.trim()).forEach(c => {
      if (!seen.has(c)) { seen.add(c); ordered.push(c); }
    });
  });
  return { color: ordered.join('/'), candidates: ordered };
}

// color自動取得 優先順位3：商品名からの辞書抽出（ブランド固有色・略称も同一辞書に統合済み）。
// 一致した全canonicalを商品名中の出現順で重複なく「/」結合して返す（複数色を維持する。
// 例：「BLK×DBR」→"Black/Brown"、「NERO×ROSSO」→"Black/Red"）。
function resolveColormeColorFromName(name) {
  const candidates = findColormeColorMatchesInText(name || '');
  return { color: candidates.join('/'), candidates };
}

function colormeEscapeRegExp(s) {
  return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

// テキスト中のブランド辞書一致を返す（{ canonical, term }の配列。1グループにつき最初に
// 一致した語のみを採用）。英字のみの語は単語境界(\b)付き・大文字小文字を無視して照合し、
// 「JOHN LOBBY」が「JOHN LOBB」に誤って部分一致することを防ぐ。日本語を含む語は単語境界の
// 概念が働かないため（\bは\w=英数字との境界にのみ反応する）部分一致で照合する
// （既存のcolor辞書と同じ方針。AIによる自由推測は行わない）。
function findColormeBrandMatchesInText(text) {
  const raw = text || '';
  const matches = [];
  COLORME_BRAND_TERM_GROUPS.forEach(group => {
    for (const term of group.terms) {
      const isAsciiTerm = /^[\x00-\x7F]+$/.test(term);
      const hit = isAsciiTerm
        ? new RegExp(`\\b${colormeEscapeRegExp(term)}\\b`, 'i').test(raw)
        : raw.includes(term);
      if (hit) { matches.push({ canonical: group.canonical, term }); break; }
    }
  });
  return matches;
}

// ── ブランド名の衝突・派生ブランド対応（MOTO/MOTOR、chausser系）──────────────────
// 実データ調査により、これらは商品名を最優先（CSVブランド列より上位）で判定する必要がある
// 例外ブランドと判明している。理由：
// ・MOTOとMOTORが同一商品のキーワード列に混在するケースがある（例：キーワードに"MOTO,MOTOR"両方）
// ・chausser系の派生ブランド（plus by chausser／Sublime by chausser）が、CSVブランド列では
//   親ブランド名"Chausser"のまま登録されている実商品が多数確認された（38件の矛盾商品で確認済み）
// キーワード列はいずれの判定にも使用しない（ALDENが他ブランドのクロスセル文言に登場、
// NATORIYAがSEO定型文としてほぼ全商品のキーワードに登場する等、誤補完の実例を複数確認したため）。
// HIDEO MOTOIKEは実在デザイナー名であり、MOTO/MOTORの判定条件には一切使用しない
// （MOTO/MOTOR両ブランドの一致条件はproduct['ブランド']の完全一致またはproduct名の語のみで、
// "HIDEO MOTOIKE"という文字列はこの一致条件のどこにも登場しない＝判定に使われない）。
const COLORME_MOTO_NAME_RE = /\bMOTO\b/i;
const COLORME_MOTO_KATAKANA_RE = /モト/;
const COLORME_MOTOR_NAME_RE = /\bMOTOR\b/i;
const COLORME_MOTOR_KATAKANA_RE = /モーター/;

const COLORME_PLUS_BY_CHAUSSER_RE = /plus\s+by\s+chausser/i;
const COLORME_SUBLIME_BY_CHAUSSER_RE = /Sublime\s+by\s+chausser/i;
const COLORME_CHAUSSER_NAME_RE = /\bchausser\b/i;
const COLORME_SHOSE_KATAKANA_RE = /ショセ/;

// chausser系：CSVブランド列の既知の短縮値・旧表記 → Google Merchant正式表記への正規化テーブル。
// 大文字小文字を区別せず比較し（英字のみの値）、出力は必ず正式表記に統一する。
const COLORME_CHAUSSER_CSV_NORMALIZATION = [
  { from: 'TRAVEL SHOES', to: 'TRAVEL SHOES by chausser' },
  { from: 'TRAVEL', to: 'TRAVEL SHOES by chausser' },
  { from: 'トラベルシューズ', to: 'TRAVEL SHOES by chausser' },
  { from: 'Plus by chausser', to: 'plus by chausser' },
  { from: 'プリュス バイ ショセ', to: 'plus by chausser' },
  { from: 'Sublime', to: 'Sublime by chausser' },
  { from: 'サブライム バイ ショセ', to: 'Sublime by chausser' },
  { from: 'chausser', to: 'chausser' },
];

function colormeFindChausserCsvNormalization(rawCsvBrand) {
  const trimmed = (rawCsvBrand || '').trim();
  if (!trimmed) return null;
  return COLORME_CHAUSSER_CSV_NORMALIZATION.find(m =>
    m.from === trimmed || (/^[\x00-\x7F]+$/.test(m.from) && m.from.toLowerCase() === trimmed.toLowerCase())
  ) || null;
}

// MOTO/MOTOR・chausser系の例外解決（商品名優先）。該当しない商品にはnullを返し、
// 呼び出し側（resolveColormeBrand）が通常のCSV優先ロジックへフォールバックする。
function resolveColormeExceptionBrand(product) {
  const name = (product['商品名'] || '').trim();
  const rawCsv = (product['ブランド'] || '').trim();

  // MOTO/MOTOR：商品名に両方のトークンが同時に存在する場合は自動補完せずambiguousとする。
  const hasMotorInName = COLORME_MOTOR_NAME_RE.test(name) || COLORME_MOTOR_KATAKANA_RE.test(name);
  const hasMotoInName = COLORME_MOTO_NAME_RE.test(name) || COLORME_MOTO_KATAKANA_RE.test(name);
  if (hasMotorInName && hasMotoInName) {
    return { brand: '', source: 'none', matchedTerm: '', normalizedFrom: '', ambiguous: true, resolutionStatus: 'ambiguous_multiple_brand_tokens' };
  }
  if (hasMotorInName) {
    return { brand: 'MOTOR', source: 'product_name', matchedTerm: COLORME_MOTOR_NAME_RE.test(name) ? 'MOTOR' : 'モーター', normalizedFrom: '', ambiguous: false, resolutionStatus: 'product_name' };
  }
  if (hasMotoInName) {
    return { brand: 'MOTO', source: 'product_name', matchedTerm: COLORME_MOTO_NAME_RE.test(name) ? 'MOTO' : 'モト', normalizedFrom: '', ambiguous: false, resolutionStatus: 'product_name' };
  }
  // 商品名にMOTO/MOTORが無い場合のみ、CSVブランド列の完全一致値を採用する。
  if (/^MOTOR$/i.test(rawCsv)) return { brand: 'MOTOR', source: 'csv', matchedTerm: '', normalizedFrom: '', ambiguous: false, resolutionStatus: 'csv' };
  if (/^MOTO$/i.test(rawCsv)) return { brand: 'MOTO', source: 'csv', matchedTerm: '', normalizedFrom: '', ambiguous: false, resolutionStatus: 'csv' };

  // chausser系：長い派生ブランド名を優先して商品名から判定する（plus→Sublime→CSV正規化→chausserの順）。
  if (COLORME_PLUS_BY_CHAUSSER_RE.test(name)) {
    return { brand: 'plus by chausser', source: 'product_name', matchedTerm: 'plus by chausser', normalizedFrom: '', ambiguous: false, resolutionStatus: 'product_name' };
  }
  if (COLORME_SUBLIME_BY_CHAUSSER_RE.test(name)) {
    return { brand: 'Sublime by chausser', source: 'product_name', matchedTerm: 'Sublime by chausser', normalizedFrom: '', ambiguous: false, resolutionStatus: 'product_name' };
  }
  const csvNorm = colormeFindChausserCsvNormalization(rawCsv);
  if (csvNorm) {
    const changed = rawCsv !== csvNorm.to;
    return { brand: csvNorm.to, source: 'csv', matchedTerm: '', normalizedFrom: changed ? rawCsv : '', ambiguous: false, resolutionStatus: changed ? 'normalized_csv' : 'csv' };
  }
  if (COLORME_CHAUSSER_NAME_RE.test(name) || COLORME_SHOSE_KATAKANA_RE.test(name)) {
    return { brand: 'chausser', source: 'product_name', matchedTerm: '', normalizedFrom: '', ambiguous: false, resolutionStatus: 'product_name' };
  }

  return null; // MOTO/MOTOR・chausser系のいずれにも該当しない
}

// CSVブランド列の既知の大文字小文字表記ゆれ→正式表記への正規化（商品名優先の例外ブランド
// 〈MOTO/MOTOR・chausser系〉とは独立。ALDEN／Alden／aldenのように、正式表記と大文字小文字
// のみが異なる値をここに列挙する。前後の空白を除去したうえで大文字小文字を区別せず比較する。
const COLORME_BRAND_CSV_CASE_NORMALIZATION_TARGETS = ['ALDEN'];

function colormeNormalizeBrandCsvCase(rawCsvBrand) {
  const trimmed = (rawCsvBrand || '').trim();
  if (!trimmed) return null;
  return COLORME_BRAND_CSV_CASE_NORMALIZATION_TARGETS.find(canonical => canonical.toLowerCase() === trimmed.toLowerCase()) || null;
}

// brand解決：0) MOTO/MOTOR・chausser系は商品名優先の例外ロジックへ（resolveColormeExceptionBrand）。
// 1) それ以外はproduct['ブランド']（既知の大文字小文字表記ゆれのみ正規化し、それ以外は
// 辞書による上書きを行わない） 2) 商品名からブランド辞書抽出 3) 取得できなければ空欄。
// キーワード列はいずれの判定にも使用しない。商品名の内部で複数ブランドに一致した場合は、
// 誤補完を避けるため空欄のまま返す（ambiguous:trueで通知、呼び出し側が注意理由へ記録する）。
function resolveColormeBrand(product) {
  const exceptionResult = resolveColormeExceptionBrand(product);
  if (exceptionResult) return exceptionResult;

  const csvBrand = (product['ブランド'] || '').trim();
  if (csvBrand) {
    const normalizedCanonical = colormeNormalizeBrandCsvCase(csvBrand);
    if (normalizedCanonical) {
      const changed = csvBrand !== normalizedCanonical;
      return {
        brand: normalizedCanonical, source: 'csv', matchedTerm: '',
        normalizedFrom: changed ? csvBrand : '', ambiguous: false,
        resolutionStatus: changed ? 'normalized_csv' : 'csv',
      };
    }
    return { brand: csvBrand, source: 'csv', matchedTerm: '', normalizedFrom: '', ambiguous: false, resolutionStatus: 'csv' };
  }

  const productName = (product['商品名'] || '').trim();
  const nameMatches = findColormeBrandMatchesInText(productName);
  const nameCanonicals = [...new Set(nameMatches.map(m => m.canonical))];

  if (nameCanonicals.length > 1) {
    return { brand: '', source: 'none', matchedTerm: '', normalizedFrom: '', ambiguous: true, resolutionStatus: 'ambiguous' };
  }
  if (nameCanonicals.length === 1) {
    const m = nameMatches.find(x => x.canonical === nameCanonicals[0]);
    return { brand: nameCanonicals[0], source: 'product_name', matchedTerm: m.term, normalizedFrom: '', ambiguous: false, resolutionStatus: 'product_name' };
  }
  return { brand: '', source: 'none', matchedTerm: '', normalizedFrom: '', ambiguous: false, resolutionStatus: 'none' };
}

// 商品1件（オプションなし）またはオプション明細1件を、Merchant形式の1行へ変換する。
// rejectReasons（1件以上あれば「掲載不可」）とnoteReasons（掲載不可でなければ「注意あり・掲載可能」）
// を分けて積む。掲載不可判定時も他フィールドの計算は継続する（プレビュー・監査CSVで理由を確認できるように）。
function buildColormeMerchantRow(product, optionItem, headings, nonProductOptionReason) {
  const rejectReasons = [];
  const noteReasons = [];
  const hasOption = !!optionItem;

  const productId = String(product['商品ID'] || '').trim();
  const optionId = hasOption ? String(optionItem['オプションID'] || '').trim() : '';
  const productName = (product['商品名'] || '').trim();
  const publishSetting = (product['掲載設定'] || '').trim();

  if (nonProductOptionReason) {
    rejectReasons.push(`${COLORME_REJECT_REASON.NON_PRODUCT_OPTION_PREFIX}${nonProductOptionReason}`);
  }

  // id / item_group_id
  let id = '';
  if (hasOption) {
    if (!optionId) {
      rejectReasons.push(COLORME_REJECT_REASON.OPTION_ID_BLANK);
    } else {
      id = `${productId}-${optionId}`;
    }
  } else {
    id = productId;
  }
  if (!id) rejectReasons.push(COLORME_REJECT_REASON.ID_BLANK);
  const itemGroupId = hasOption ? productId : '';

  // title
  const csvTitle = (product['タイトル'] || '').trim();
  const title = csvTitle || productName;
  if (!title) rejectReasons.push(COLORME_REJECT_REASON.TITLE_BLANK);

  // description（優先順位：ページ概要→簡易説明→商品説明。HTML除去・エンティティ復元・空白整理はstripColormeHtmlTags内で実施）
  const descSources = [product['ページ概要'], product['簡易説明'], product['商品説明']];
  let description = '';
  for (const src of descSources) {
    const stripped = stripColormeHtmlTags(src);
    if (stripped) { description = stripped; break; }
  }
  if (!description) rejectReasons.push(COLORME_REJECT_REASON.DESCRIPTION_BLANK);

  // link（商品IDをURLエンコード。オプションごとに同一の親商品ページへリンクして構わない）
  const link = productId ? `${COLORME_SHOP_DOMAIN}/?pid=${encodeURIComponent(productId)}` : '';
  if (!link) rejectReasons.push(COLORME_REJECT_REASON.LINK_UNAVAILABLE);

  // image_link（HTTPS必須）
  const imageLinkRaw = (product['商品画像URL'] || '').trim();
  const imageLink = isColormeHttpsUrl(imageLinkRaw) ? imageLinkRaw : '';
  if (!imageLink) rejectReasons.push(COLORME_REJECT_REASON.IMAGE_LINK_INVALID);

  // additional_image_link（HTTPS必須。0件なら注意）
  const additionalImageLink = COLORME_ADDITIONAL_IMAGE_FIELDS
    .map(f => (product[f] || '').trim())
    .filter(u => isColormeHttpsUrl(u))
    .join(',');
  if (!additionalImageLink) noteReasons.push('追加画像がありません');

  // availability（在庫管理する＋数値確定できない場合は掲載不可。在庫管理しないはin_stock＋注意）
  const stockManagement = product['在庫管理'] || '';
  let availability = '';
  if (stockManagement === '在庫管理しない') {
    availability = 'in_stock';
    noteReasons.push('在庫管理しないためin_stock');
  } else if (stockManagement === '在庫管理する') {
    const stockRaw = hasOption ? optionItem['在庫数'] : product['在庫数'];
    const stockTrimmed = (stockRaw || '').trim();
    const stockNum = Number(stockTrimmed);
    if (stockTrimmed === '' || !Number.isFinite(stockNum)) {
      rejectReasons.push(COLORME_REJECT_REASON.STOCK_UNDETERMINED);
    } else if (stockNum > 0) {
      availability = 'in_stock';
    } else {
      availability = 'out_of_stock';
    }
  } else {
    rejectReasons.push(COLORME_REJECT_REASON.STOCK_MANAGEMENT_UNKNOWN);
  }

  // price（オプションあり：オプション販売価格→親価格の順。会員価格は使用しない。
  // オプション販売価格はそのバリエーションの完成価格であり、親価格への加算ではないため置換のみ行う）
  let priceRaw = '';
  let priceSource = 'none';
  if (hasOption) {
    const optionPrice = (optionItem['販売価格'] || '').trim();
    if (optionPrice) {
      priceRaw = optionPrice;
      priceSource = 'option';
    } else {
      priceRaw = (product['販売価格'] || '').trim();
      priceSource = 'product';
    }
  } else {
    priceRaw = (product['販売価格'] || '').trim();
    priceSource = 'product';
  }
  const priceNum = Number(priceRaw);
  let price = '';
  let priceTaxStatus = 'none';
  let priceTaxRate = '';
  let priceNormalized = '';
  let priceRoundingMethod = '';
  let priceUnresolvedReason = '';
  const reducedTaxSetting = (product['軽減税率設定'] || '').trim();
  if (!priceRaw || !Number.isFinite(priceNum) || priceNum <= 0) {
    rejectReasons.push(COLORME_REJECT_REASON.PRICE_INVALID);
    priceUnresolvedReason = !priceRaw ? 'price_blank' : (priceNum < 0 ? 'price_negative' : 'price_zero_or_invalid');
  } else if (reducedTaxSetting && reducedTaxSetting !== '軽減税率設定しない') {
    // 軽減税率（8%）が設定された行は実データで一件も確認できておらず、税率を推測しない
    // （推測による価格補完の禁止）。price自体は空欄にせず監査対象として記録する。
    priceUnresolvedReason = 'reduced_tax_rate_unconfirmed';
    noteReasons.push('軽減税率設定のため税込価格を自動算出していません（要確認）');
  } else {
    // 商品CSV・オプションCSVのいずれにも税込価格列が存在しないため、税別価格（販売価格）から
    // 標準税率10%で税込価格を算出する（実データ・実店舗ページで販売価格×1.10＝税込表示価格を確認済み）。
    const taxResult = resolveColormeTaxInclusivePrice(priceNum);
    price = `${taxResult.amount} JPY`;
    priceTaxStatus = 'tax_exclusive_converted';
    priceTaxRate = String(COLORME_STANDARD_TAX_RATE);
    priceNormalized = String(taxResult.amount);
    priceRoundingMethod = taxResult.roundingMethod;
    if (taxResult.amount > COLORME_ABNORMAL_PRICE_THRESHOLD_JPY) {
      priceUnresolvedReason = 'abnormally_large_price';
    }
  }

  // condition（新品/中古/再生品等の完全一致変換のみ。推測変換はしない）
  const conditionRaw = (product['状態'] || '').trim();
  const normalizedCondition = normalizeColormeCondition(conditionRaw);
  let condition = '';
  if (normalizedCondition) {
    condition = normalizedCondition;
  } else {
    rejectReasons.push(`${COLORME_REJECT_REASON.CONDITION_UNCONVERTIBLE_PREFIX}${conditionRaw}`);
  }

  // brand（辞書登録済みの明示的な一致語のみで補完。AIによる自由推測は行わない。
  // MOTO/MOTOR・chausser系は商品名優先の例外ロジック、それ以外はproduct['ブランド']に値が
  // あれば辞書による上書きを行わない＝resolveColormeBrand内で保証。キーワード列は使用しない）
  const brandResolution = resolveColormeBrand(product);
  let brand = brandResolution.brand;
  if (brandResolution.resolutionStatus === 'ambiguous_multiple_brand_tokens') {
    noteReasons.push('商品名に複数のブランド名（MOTO・MOTOR等）が同時に見つかったため自動補完しませんでした');
  } else if (brandResolution.ambiguous) {
    noteReasons.push('商品名に複数のブランド候補が見つかったため自動補完しませんでした');
  }
  if (brand.length > COLORME_BRAND_MAX_LENGTH) {
    rejectReasons.push(COLORME_REJECT_REASON.BRAND_TOO_LONG);
  }
  // 新品でbrandが空欄かどうかの判定は、fields構築後にfields.brand（TSVへ実際に出力される
  // 最終値）を使って行う（下記「brand空欄判定（最終値使用）」を参照。途中変数のズレを避けるため）。

  // gtin（形式検証。無効値は空欄化し注意理由へ。推測・桁埋めはしない）
  const gtinResult = validateAndNormalizeColormeGtin(product['JAN/ISBN(GTIN)']);
  const gtin = gtinResult.value;
  if (gtinResult.note) {
    noteReasons.push(gtinResult.note);
  } else if (!gtin) {
    noteReasons.push('GTINが空欄です');
  }

  // mpn（製品番号(MPN)→オプション明細の型番→親商品の型番の順。商品IDの自動使用・生成はしない）
  const productMpn = (product['製品番号(MPN)'] || '').trim();
  const optionMpn = hasOption ? (optionItem['型番'] || '').trim() : '';
  const parentModelNumber = (product['型番'] || '').trim();
  let mpn = productMpn || optionMpn || parentModelNumber;
  if (mpn.length > COLORME_MPN_MAX_LENGTH) {
    mpn = '';
    noteReasons.push(`MPNが${COLORME_MPN_MAX_LENGTH}文字を超えるため空欄にしました`);
  } else if (!mpn) {
    noteReasons.push('MPNが空欄です');
  }

  if (!gtin && !mpn) noteReasons.push('GTINとMPNの両方が空欄です');

  // identifier_exists（GTINあり、またはGTINなしでもbrand・MPNが両方あれば空欄。それ以外はno。推測はしない）
  let identifierExists = '';
  if (gtin) {
    identifierExists = '';
  } else if (brand && mpn) {
    identifierExists = '';
  } else {
    identifierExists = 'no';
  }

  // google_product_category（カラーミー「広告用カテゴリーID」は使用しない。商品CSVの
  // 大カテゴリー・小カテゴリーからGoogle公式Product Taxonomy IDへ変換する。推測補完はしない。
  // 判定不能な場合は空欄のままとし、空欄であることを理由にTSVから除外しない）
  const categoryRaw = product['広告用カテゴリーID'] || '';
  const categoryMajor = (product['大カテゴリー'] || '').trim();
  const categoryMinor = (product['小カテゴリー'] || '').trim();
  const categoryResolution = resolveColormeGoogleProductCategory(categoryMajor, categoryMinor, productName);
  const googleProductCategory = categoryResolution.id;
  const categorySource = googleProductCategory ? 'major_minor_category' : 'none';
  const categoryMatchType = categoryResolution.matchType;
  let categoryUnresolvedReason = '';
  if (!googleProductCategory) {
    categoryUnresolvedReason = 'category_combination_not_mapped';
    noteReasons.push('Google商品カテゴリが判定できず空欄です（大カテゴリー・小カテゴリーの組み合わせが未登録）');
  }

  // size / color（オプション見出しラベルの完全一致でのみ判定。部分一致・文章推測は禁止）
  // color優先順位1：オプションの色系見出し
  let size = '';
  let color = '';
  let colorRaw = '';
  let colorSource = 'none';
  let colorConfidence = 'none';
  let colorUnresolvedReason = '';
  const colorExempt = isColormeColorExemptProduct(productName, product['大カテゴリー'], product['小カテゴリー']);

  if (hasOption) {
    const headingPairs = [
      { label: (headings.heading1 || '').trim(), value: (optionItem['オプション名１'] || '').trim() },
      { label: (headings.heading2 || '').trim(), value: (optionItem['オプション名２'] || '').trim() },
    ];
    headingPairs.forEach(({ label, value }) => {
      if (!label) return;
      if (COLORME_SIZE_LABELS.includes(label)) { size = value; return; }
      if (COLORME_COLOR_LABELS.includes(label)) {
        color = value;
        colorRaw = value;
        colorSource = 'option';
        colorConfidence = 'high';
        return;
      }
      if (COLORME_NON_VARIANT_OPTION_LABELS.includes(label)) return;
      noteReasons.push(`オプション見出し「${label}」の用途が不明です（size/colorには割り当てていません）`);
    });
  }

  // color優先順位2：商品CSVの色列。優先順位3：商品名からの辞書抽出（ブランド固有色・略称も
  // 統合済み）。いずれも一致した色は複数維持する（例："Black/Brown"）。明示色優先設計：
  // colorExemptであっても解決自体は行い、明示色が見つかればそれを採用する。exempt判定は
  // 「色が最終的に空欄だった場合のみ」の空欄理由付けにのみ使う（下記）。
  if (!color) {
    const fromProductColumn = resolveColormeColorFromProductColumn(product['色']);
    if (fromProductColumn.color) {
      color = fromProductColumn.color;
      colorRaw = (product['色'] || '').trim();
      colorSource = 'csv_column';
      colorConfidence = 'high';
    } else {
      const fromName = resolveColormeColorFromName(productName);
      if (fromName.color) {
        color = fromName.color;
        colorRaw = productName;
        colorSource = 'product_name';
        colorConfidence = 'medium';
      }
    }
  }

  if (!color) {
    colorUnresolvedReason = colorExempt ? 'no_color_attribute_required' : 'no_match_found';
  }

  if (hasOption && !size && !color && !colorExempt) {
    const headingText = [headings.heading1, headings.heading2].filter(Boolean).join('／');
    noteReasons.push(`size・colorのいずれも取得できません（見出し：${headingText || 'なし'}）`);
  }

  const fields = {
    id, title, description, link,
    image_link: imageLink,
    additional_image_link: additionalImageLink,
    availability, price, condition, brand, gtin, mpn,
    identifier_exists: identifierExists,
    google_product_category: googleProductCategory,
    item_group_id: itemGroupId,
    color, size,
  };

  // brand空欄判定（最終値使用）：表示用の商品名・元CSV列・途中変数ではなく、TSVへ実際に出力される
  // fields.brand（最終値）とfields.condition（最終値）を使って判定する。brandが70文字超過で
  // 既にBRAND_TOO_LONGにより除外済みの場合はfields.brandが非空のため、ここでは対象にならない。
  if (fields.condition === 'new' && fields.brand.trim() === '') {
    rejectReasons.push(COLORME_REJECT_REASON.BRAND_BLANK_NEW);
  } else if (fields.brand.trim() === '') {
    noteReasons.push('ブランドが未設定です');
  }

  // 必須列にタブ・改行・制御文字など出力を壊す値が残っていないか、全17列を検査する。
  const hasBreakingChars = Object.values(fields).some(v => typeof v === 'string' && /[\t\r\n\x00-\x08\x0B\x0C\x0E-\x1F\x7F]/.test(v));
  if (hasBreakingChars) rejectReasons.push(COLORME_REJECT_REASON.BREAKING_CHARS);

  const tier = rejectReasons.length ? '掲載不可' : (noteReasons.length ? '注意あり・掲載可能' : '掲載可能');
  return {
    fields, tier, rejectReasons, noteReasons, productId, optionId, productName, publishSetting,
    brandSource: brandResolution.source, brandMatchedTerm: brandResolution.matchedTerm,
    brandNormalizedFrom: brandResolution.normalizedFrom, brandResolutionStatus: brandResolution.resolutionStatus,
    colorRaw, colorNormalized: color, colorSource, colorConfidence, colorUnresolvedReason,
    categoryRaw, categoryMajor, categoryMiddle: '', categoryMinor,
    categoryNormalized: googleProductCategory, categorySource, categoryMatchType, categoryUnresolvedReason,
    priceRaw, priceSource, priceTaxStatus, priceTaxRate, priceNormalized, priceRoundingMethod, priceUnresolvedReason,
  };
}

// Phase1の結合結果（result.full）を入力に、全件をMerchant形式へ変換して集計する。
// 重複id検出・商品単位集計・TSV/監査CSV生成のため、全行をColormeCsvConverter.merchantRowsに
// 保持する（DOM描画は先頭50件のみ・getColormeMerchantPreviewRows()参照）。
async function runColormeMerchantConversion() {
  const r = ColormeCsvConverter.result;
  if (!r || !r.full) return;
  ColormeCsvConverter.isMerchantProcessing = true;
  ColormeCsvConverter.merchantResult = null;
  ColormeCsvConverter.merchantRows = null;
  renderColormeCsvConverter();

  const { products, optionsByProductId } = r.full;

  let publishTargetCount = 0;
  const publishExclusion = { total: 0, byReason: {} };
  const allRows = [];
  const nonProductExcludedProducts = [];
  const nonProductExcludedProductIds = new Set(); // productId単位の重複排除用（空productIdは対象外）

  products.forEach(product => {
    const publishSetting = (product['掲載設定'] || '').trim();
    if (publishSetting !== COLORME_PUBLISH_SETTING_TARGET) {
      publishExclusion.total++;
      publishExclusion.byReason[publishSetting] = (publishExclusion.byReason[publishSetting] || 0) + 1;
      return;
    }
    publishTargetCount++;

    const productId = product['商品ID'];
    const opt = optionsByProductId[productId];
    const hasOptions = !!(opt && opt.items.length);
    const headings = { heading1: opt ? opt.heading1 : '', heading2: opt ? opt.heading2 : '' };
    const nonProductOptionReason = findColormeNonProductOptionReason(
      product['商品名'], headings.heading1, headings.heading2, hasOptions ? opt.items : []
    );
    if (nonProductOptionReason && (!productId || !nonProductExcludedProductIds.has(productId))) {
      if (productId) nonProductExcludedProductIds.add(productId);
      nonProductExcludedProducts.push({ productId, productName: (product['商品名'] || '').trim(), reason: nonProductOptionReason });
    }

    const optionItemsOrNull = hasOptions ? opt.items : [null];
    optionItemsOrNull.forEach(optionItem => {
      allRows.push(buildColormeMerchantRow(product, optionItem, headings, nonProductOptionReason));
    });
  });

  // 重複id検出：掲載不可行は対象外（出力対象になり得る行同士でのみidの一意性を確認する）。
  const idCounts = {};
  allRows.forEach(row => {
    if (row.tier === '掲載不可' || !row.fields.id) return;
    idCounts[row.fields.id] = (idCounts[row.fields.id] || 0) + 1;
  });
  allRows.forEach(row => {
    if (row.tier === '掲載不可' || !row.fields.id) return;
    if (idCounts[row.fields.id] > 1) {
      row.rejectReasons.push(`${COLORME_REJECT_REASON.DUPLICATE_ID_PREFIX}${row.fields.id}）`);
      row.tier = '掲載不可';
    }
  });

  // 行単位・理由別の集計
  const rowSummary = { candidateRowCount: allRows.length, okRowCount: 0, okWithNotesRowCount: 0, rejectedRowCount: 0 };
  const noteReasonCounts = {};
  const rejectReasonCounts = {};
  const perProduct = {};
  const categoryMissingProducts = [];
  const categoryMissingProductIds = new Set(); // productId単位の重複排除用（空productIdは対象外）

  allRows.forEach(row => {
    if (row.tier === '掲載可能') rowSummary.okRowCount++;
    else if (row.tier === '注意あり・掲載可能') rowSummary.okWithNotesRowCount++;
    else rowSummary.rejectedRowCount++;

    if (row.tier === '注意あり・掲載可能') {
      row.noteReasons.forEach(n => { noteReasonCounts[n] = (noteReasonCounts[n] || 0) + 1; });
      // Google商品カテゴリ未設定商品の一覧（出力対象＝注意あり・掲載可能の行のみ、商品ID単位で重複排除）
      if (!row.fields.google_product_category && (!row.productId || !categoryMissingProductIds.has(row.productId))) {
        if (row.productId) categoryMissingProductIds.add(row.productId);
        categoryMissingProducts.push({
          productId: row.productId,
          productName: row.productName,
          brand: row.fields.brand,
          link: row.fields.link,
          googleProductCategory: row.fields.google_product_category,
          reason: '大カテゴリー・小カテゴリーからGoogle公式カテゴリIDを判定できませんでした',
        });
      }
    }
    row.rejectReasons.forEach(rs => { rejectReasonCounts[rs] = (rejectReasonCounts[rs] || 0) + 1; });

    if (!perProduct[row.productId]) perProduct[row.productId] = { total: 0, rejected: 0 };
    perProduct[row.productId].total++;
    if (row.tier === '掲載不可') perProduct[row.productId].rejected++;
  });

  // 商品単位の集計（1行以上出力される商品／全行掲載不可／一部バリエーションのみ掲載不可）
  let productsWithOutput = 0;
  let productsAllRejected = 0;
  let productsPartialRejected = 0;
  Object.values(perProduct).forEach(p => {
    if (p.rejected === 0) {
      productsWithOutput++;
    } else if (p.rejected === p.total) {
      productsAllRejected++;
    } else {
      productsWithOutput++;
      productsPartialRejected++;
    }
  });

  const requiredFieldMissingCount = allRows.filter(row =>
    row.tier === '掲載不可' && row.rejectReasons.some(isColormeRequiredFieldMissingReason)
  ).length;
  const duplicateIdRowCount = allRows.filter(row =>
    row.rejectReasons.some(rs => rs.startsWith(COLORME_REJECT_REASON.DUPLICATE_ID_PREFIX))
  ).length;

  // 在庫ベースのGoogle Merchant出力除外（商品ID単位）：
  // TSV出力候補行（掲載不可以外）の中でavailabilityがin_stockの行が1件も無い商品は
  // 「全サイズ完売」としてTSVから除外する対象とする。row.tier（判定ロジック）自体は変更せず、
  // 掲載不可とは別カテゴリとして扱う（掲載不可件数へは含めない）。
  const outputCandidateRows = allRows.filter(row => row.tier !== '掲載不可');
  const outputCandidateGroups = colormeGroupRowsByProductId(outputCandidateRows);
  const soldOutExcludedGroups = outputCandidateGroups.filter(group =>
    !group.some(row => row.fields.availability === 'in_stock')
  );
  const soldOutExcludedProductIds = new Set(soldOutExcludedGroups.map(group => group[0].productId));
  const soldOutExcludedProducts = soldOutExcludedGroups.map(group => ({
    productId: group[0].productId,
    productName: group[0].productName,
    brand: group[0].fields.brand,
    variantCount: group.length,
  }));

  // 「在庫あり・掲載不可」：商品ID単位で、(1)掲載不可の行が存在し、かつ(2)商品内のいずれかの行で
  // availabilityがin_stockのものが1件以上存在する商品（全サイズ完売の商品は除く）。
  // 掲載不可判定ロジック（row.tier）自体は変更しない。行のtier全体（掲載不可以外も含む）を見る必要が
  // あるため、allRowsを商品ID単位でグループ化して判定する。
  const allProductGroups = colormeGroupRowsByProductId(allRows);
  const inStockRejectedProducts = [];
  allProductGroups.forEach(group => {
    const productId = group[0].productId;
    if (soldOutExcludedProductIds.has(productId)) return; // 全サイズ完売の商品は含めない
    if (nonProductExcludedProductIds.has(productId)) return; // 送料・配送費・手数料等の非商品オプションは含めない（既存の判定・集合を再利用）
    const hasRejected = group.some(row => row.tier === '掲載不可');
    const hasInStock = group.some(row => row.fields.availability === 'in_stock');
    if (hasRejected && hasInStock) {
      inStockRejectedProducts.push({
        productId,
        productName: group[0].productName,
        brand: group[0].fields.brand,
        variantCount: group.length,
      });
    }
  });
  const inStockRejectedProductIds = new Set(inStockRejectedProducts.map(p => p.productId));
  const inStockRejectedRowCount = allRows.filter(row =>
    row.tier === '掲載不可' && inStockRejectedProductIds.has(row.productId)
  ).length;

  const summary = {
    originalProductCount: products.length,
    publishTargetProductCount: publishTargetCount,
    publishExclusion,
    row: rowSummary,
    outputTsvRowCount: rowSummary.okRowCount + rowSummary.okWithNotesRowCount,
    product: {
      publishTargetProductCount: publishTargetCount,
      productsWithOutput,
      productsAllRejected,
      productsPartialRejected,
      soldOutExcludedProductCount: soldOutExcludedProducts.length,
      inStockRejectedProductCount: inStockRejectedProducts.length,
    },
    duplicateIdRowCount,
    requiredFieldMissingCount,
    nonProductExcludedProductCount: nonProductExcludedProducts.length,
    categoryMissingProductCount: categoryMissingProducts.length,
    inStockRejectedRowCount,
  };

  ColormeCsvConverter.merchantRows = allRows;
  ColormeCsvConverter.merchantResult = {
    summary, noteReasonCounts, rejectReasonCounts, nonProductExcludedProducts, categoryMissingProducts,
    soldOutExcludedProductIds, soldOutExcludedProducts,
    inStockRejectedProductIds, inStockRejectedProducts,
  };
  ColormeCsvConverter.merchantPreviewFilter = ColormeCsvConverter.merchantPreviewFilter || 'all';
  ColormeCsvConverter.merchantPreviewPage = 1; // 新しい変換結果では常に1ページ目から表示する
  ColormeCsvConverter.isMerchantProcessing = false;
  renderColormeCsvConverter();
}

// フィルターの内部値（英語）と表示ラベル・対応するtier群（TSV生成等で使う最終判定値）を
// 1箇所で対応付ける。表示文字列そのものを比較条件には使わない。tiers: nullは「すべて」を意味する。
// 「TSV出力対象すべて」は掲載可能・注意あり・掲載可能の両方（TSVへ実際に出力される行）を指す。
const COLORME_PREVIEW_FILTER_OPTIONS = [
  { value: 'all', label: 'すべて', tiers: null },
  { value: 'output_all', label: 'TSV出力対象すべて', tiers: ['掲載可能', '注意あり・掲載可能'] },
  { value: 'publishable', label: '警告なし・掲載可能', tiers: ['掲載可能'] },
  { value: 'warning', label: '警告あり・掲載可能', tiers: ['注意あり・掲載可能'] },
  // 全サイズ完売（除外）：tiersでの絞り込み後にproductId単位でさらに絞り込む（soldOutOnly）。
  // 掲載不可とは別カテゴリのため、掲載不可のtiersには含めない。
  { value: 'sold_out_excluded', label: '全サイズ完売（除外）', tiers: ['掲載可能', '注意あり・掲載可能'], soldOutOnly: true },
  { value: 'rejected', label: '掲載不可', tiers: ['掲載不可'] },
  // 在庫あり・掲載不可：掲載不可のうち、商品内に1件以上在庫あり(in_stock)のバリエーションが
  // 存在する商品（全サイズ完売の商品を除く）に絞り込む。表示する行は掲載不可の行のみ。
  { value: 'in_stock_rejected', label: '在庫あり・掲載不可', tiers: ['掲載不可'], inStockRejectedOnly: true },
];

function colormeResolveTiersForFilterValue(value) {
  const opt = COLORME_PREVIEW_FILTER_OPTIONS.find(o => o.value === value);
  return opt ? opt.tiers : null;
}

// 現在のフィルターに一致する全行（ページング前）。TSV生成が参照するrow.tierと同じ値で
// 判定するため、コード上ずれることがない。
function getColormeMerchantFilteredRows() {
  const rows = ColormeCsvConverter.merchantRows || [];
  const filterValue = ColormeCsvConverter.merchantPreviewFilter || 'all';
  const opt = COLORME_PREVIEW_FILTER_OPTIONS.find(o => o.value === filterValue);
  if (!opt) return rows;
  let result = opt.tiers === null ? rows : rows.filter(row => opt.tiers.includes(row.tier));
  if (opt.soldOutOnly) {
    const soldOutIds = (ColormeCsvConverter.merchantResult && ColormeCsvConverter.merchantResult.soldOutExcludedProductIds) || new Set();
    result = result.filter(row => soldOutIds.has(row.productId));
  }
  if (opt.inStockRejectedOnly) {
    const inStockRejectedIds = (ColormeCsvConverter.merchantResult && ColormeCsvConverter.merchantResult.inStockRejectedProductIds) || new Set();
    result = result.filter(row => inStockRejectedIds.has(row.productId));
  }
  return result;
}

function colormeSetMerchantPreviewFilter(value) {
  ColormeCsvConverter.merchantPreviewFilter = value;
  ColormeCsvConverter.merchantPreviewPage = 1; // フィルター変更時は1ページ目へ戻す
  renderColormeCsvConverter();
}

// ── 商品ID単位のページネーション（Merchant変換プレビューのみ。TSV/監査CSVには無関係）──
const COLORME_MERCHANT_GROUPS_PER_PAGE = 20;

function colormeGetMerchantPreviewTotalPages(groupCount) {
  return Math.max(1, Math.ceil(groupCount / COLORME_MERCHANT_GROUPS_PER_PAGE));
}

function colormeClampMerchantPreviewPage(page, totalPages) {
  if (page < 1) return 1;
  if (page > totalPages) return totalPages;
  return page;
}

function colormeSetMerchantPreviewPage(page) {
  const groups = colormeGroupRowsByProductId(getColormeMerchantFilteredRows());
  const totalPages = colormeGetMerchantPreviewTotalPages(groups.length);
  ColormeCsvConverter.merchantPreviewPage = colormeClampMerchantPreviewPage(page, totalPages);
  renderColormeCsvConverter();
}

// ── TSV生成（Google Merchant Center正式アップロード形式：タブ区切り・UTF-8 BOM・CRLF）──
// soldOutExcludedProductIds／includeSoldOutProductsは「全サイズ完売商品の除外」機能用の引数。
// Google商品カテゴリ（google_product_category）が空欄であることを理由にTSVから除外する処理は
// 2026-07-25に廃止した（カテゴリが判定できないことと、他の掲載条件を満たすことは別問題であるため。
// 判定ロジック＝row.tierは変更しない）。
function buildColormeMerchantTsv(rows, soldOutExcludedProductIds, includeSoldOutProducts) {
  const excludedIds = soldOutExcludedProductIds || new Set();
  const outputRows = rows.filter(row => {
    if (row.tier === '掲載不可') return false;
    if (!includeSoldOutProducts && excludedIds.has(row.productId)) return false;
    return true;
  });
  const header = COLORME_MERCHANT_FIELD_ORDER.join('\t');
  const lines = outputRows.map(row =>
    COLORME_MERCHANT_FIELD_ORDER.map(key => row.fields[key] != null ? row.fields[key] : '').join('\t')
  );
  return '﻿' + [header, ...lines].join('\r\n') + '\r\n';
}

// 現在の商品行・全サイズ完売除外設定・チェックボックス状態から、実際にTSVへ出力される
// 行・商品の集合を求める共通ヘルパー（集計表示とダウンロードの両方から参照し、値のずれを防ぐ）。
// Google商品カテゴリが空欄でもTSV対象から除外しない（2026-07-25廃止。判定ロジック＝row.tierは変更しない）。
function colormeGetTsvEligibleRowsBeforeCategoryFilter() {
  const rows = ColormeCsvConverter.merchantRows || [];
  const soldOutExcludedProductIds = (ColormeCsvConverter.merchantResult && ColormeCsvConverter.merchantResult.soldOutExcludedProductIds) || new Set();
  const includeSoldOutProducts = !!ColormeCsvConverter.includeSoldOutProducts;
  return rows.filter(row => {
    if (row.tier === '掲載不可') return false;
    if (!includeSoldOutProducts && soldOutExcludedProductIds.has(row.productId)) return false;
    return true;
  });
}

function colormeGetTsvOutputRows() {
  return colormeGetTsvEligibleRowsBeforeCategoryFilter();
}

// Google商品カテゴリが空欄の行（TSVには引き続き含まれる。監視・確認用の一覧表示にのみ使用）。
function colormeGetCategoryMissingExcludedRows() {
  return colormeGetTsvEligibleRowsBeforeCategoryFilter().filter(row => !row.fields.google_product_category);
}

function colormeTimestampForFilename() {
  const d = new Date();
  const pad = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`;
}

function colormeMerchantTsvFilename() {
  return `google-merchant-products-${colormeTimestampForFilename()}.tsv`;
}

function colormeSetIncludeSoldOutProducts(checked) {
  ColormeCsvConverter.includeSoldOutProducts = !!checked;
  renderColormeCsvConverter();
}

function downloadColormeMerchantTsv() {
  const rows = ColormeCsvConverter.merchantRows;
  if (!rows || !rows.length) return;
  const soldOutExcludedProductIds = (ColormeCsvConverter.merchantResult && ColormeCsvConverter.merchantResult.soldOutExcludedProductIds) || new Set();
  const includeSoldOutProducts = !!ColormeCsvConverter.includeSoldOutProducts;
  const content = buildColormeMerchantTsv(rows, soldOutExcludedProductIds, includeSoldOutProducts);
  const blob = new Blob([content], { type: 'text/tab-separated-values;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = colormeMerchantTsvFilename();
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// ── 監査CSV生成（掲載不可・注意あり・掲載可能の行のみ。UTF-8 BOM・カンマ区切り）──
function colormeEscapeCsvValue(value) {
  const s = (value === undefined || value === null) ? '' : String(value);
  if (/[",\r\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
  return s;
}

function buildColormeAuditCsv(rows) {
  const targetRows = rows.filter(row => row.tier !== '掲載可能');
  const lines = targetRows.map(row => {
    const reasonText = row.rejectReasons.concat(row.noteReasons).join('／');
    return [
      row.productId, row.optionId || '', row.fields.id, row.productName, row.tier, reasonText, row.publishSetting,
      row.brandSource || '', row.brandMatchedTerm || '', row.brandNormalizedFrom || '', row.brandResolutionStatus || '',
      row.colorRaw || '', row.colorNormalized || '', row.colorSource || '', row.colorConfidence || '', row.colorUnresolvedReason || '',
      row.categoryRaw || '', row.categoryMajor || '', row.categoryMiddle || '', row.categoryMinor || '',
      row.categoryNormalized || '', row.categorySource || '', row.categoryMatchType || '', row.categoryUnresolvedReason || '',
      row.priceRaw || '', row.priceSource || '', row.priceTaxStatus || '', row.priceTaxRate || '',
      row.priceNormalized || '', row.priceRoundingMethod || '', row.priceUnresolvedReason || '',
    ].map(colormeEscapeCsvValue).join(',');
  });
  const header = COLORME_AUDIT_CSV_HEADERS.map(colormeEscapeCsvValue).join(',');
  return '﻿' + [header, ...lines].join('\r\n') + '\r\n';
}

function colormeAuditCsvFilename() {
  return `google-merchant-audit-${colormeTimestampForFilename()}.csv`;
}

function downloadColormeAuditCsv() {
  const rows = ColormeCsvConverter.merchantRows;
  if (!rows || !rows.length) return;
  const content = buildColormeAuditCsv(rows);
  const blob = new Blob([content], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = colormeAuditCsvFilename();
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// ── Google商品カテゴリ未設定商品一覧CSV（商品ID単位で重複なし。UTF-8 BOM・カンマ区切り）──
const COLORME_CATEGORY_MISSING_CSV_HEADERS = ['product_id', 'title', 'brand', 'link', 'google_product_category', 'reason'];

function buildColormeCategoryMissingCsv(products) {
  const lines = products.map(p =>
    [p.productId, p.productName, p.brand, p.link, p.googleProductCategory, p.reason]
      .map(colormeEscapeCsvValue).join(',')
  );
  const header = COLORME_CATEGORY_MISSING_CSV_HEADERS.map(colormeEscapeCsvValue).join(',');
  return '﻿' + [header, ...lines].join('\r\n') + '\r\n';
}

function colormeCategoryMissingCsvFilename() {
  return `google-category-missing-products-${colormeTimestampForFilename()}.csv`;
}

function downloadColormeCategoryMissingCsv() {
  const products = ColormeCsvConverter.merchantResult && ColormeCsvConverter.merchantResult.categoryMissingProducts;
  if (!products || !products.length) return;
  const content = buildColormeCategoryMissingCsv(products);
  const blob = new Blob([content], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = colormeCategoryMissingCsvFilename();
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function renderColormeReasonCountList(countsMap) {
  const entries = Object.entries(countsMap).sort((a, b) => b[1] - a[1]);
  if (!entries.length) return '<p class="idea-plan-note">該当なし</p>';
  return entries.map(([reason, count]) => `<p class="idea-plan-note" style="margin:2px 0">${esc(reason)}：${count}件</p>`).join('');
}

  { prefix: COLORME_REJECT_REASON.NON_PRODUCT_OPTION_PREFIX, label: '非商品除外' },

  { prefix: '商品名から複数の色候補', label: 'color複数候補' },
];

function colormeShortenReasonLabel(reason) {
  if (COLORME_REASON_SHORT_LABEL_EXACT[reason]) return COLORME_REASON_SHORT_LABEL_EXACT[reason];
  const prefixMatch = COLORME_REASON_SHORT_LABEL_PREFIX.find(p => reason.startsWith(p.prefix));
  if (prefixMatch) return prefixMatch.label;
  return reason.length > 10 ? `${reason.slice(0, 10)}…` : reason;
}

function colormeShortenReasonList(reasons) {
  const labels = reasons.map(colormeShortenReasonLabel);
  return [...new Set(labels)].join('・');
}

function colormeVerdictColor(tier) {
  if (tier === '掲載不可') return 'var(--danger)';

  return 'inherit';
}

      <h3 style="margin-bottom:12px">Google商品カテゴリ未設定商品：${categoryMissingProducts.length}件</h3>
      <p class="idea-plan-note">出力対象（掲載可能・注意あり・掲載可能）の行のうち、大カテゴリー・小カテゴリーからGoogle公式カテゴリIDを判定できなかった商品を商品ID単位で重複なく一覧化しています（これらの商品もTSVには出力されます）。</p>
      <div style="margin-top:12px">
        <button class="btn" onclick="downloadColormeCategoryMissingCsv()" ${canDownload ? '' : 'disabled'}>Google商品カテゴリ未設定一覧をCSVでダウンロード</button>
      </div>
      ${categoryMissingProducts.length ? `
        <div style="overflow-x:auto;margin-top:12px">
          <table style="width:100%;border-collapse:collapse;font-size:13px">
            <thead>
              <tr style="text-align:left;border-bottom:1px solid var(--border)">
                <th style="padding:6px 8px">商品ID</th>
                <th style="padding:6px 8px">商品名</th>
                <th style="padding:6px 8px">ブランド</th>
                <th style="padding:6px 8px">商品URL</th>
                <th style="padding:6px 8px">理由</th>
              </tr>
            </thead>
            <tbody>
              ${categoryMissingProducts.map(p => `
                <tr style="border-bottom:1px solid var(--border)">
                  <td style="padding:6px 8px"><a href="${esc(colormeAdminProductEditUrl(p.productId))}" target="_blank" rel="noopener noreferrer">${esc(p.productId)}</a></td>
                  <td style="padding:6px 8px">${esc(p.productName)}</td>
                  <td style="padding:6px 8px">${esc(p.brand)}</td>
                  <td style="padding:6px 8px">${esc(p.link)}</td>
                  <td style="padding:6px 8px;white-space:normal;max-width:320px">${esc(p.reason)}</td>
                </tr>

            </tbody>
          </table>
        </div>

  `;
}

function renderColormeExcludedProductsList(excludedProducts) {
  if (!excludedProducts || !excludedProducts.length) return '';
  const shown = excludedProducts.slice(0, COLORME_MERCHANT_PREVIEW_LIMIT);
  return `
    <div class="card" style="margin-top:20px">
      <h3 style="margin-bottom:12px">除外された商品（非商品オプション・先頭${shown.length}件 / 全${excludedProducts.length}件）</h3>
      <div style="overflow-x:auto">
        <table style="width:100%;border-collapse:collapse;font-size:13px">
          <thead>
            <tr style="text-align:left;border-bottom:1px solid var(--border)">
              <th style="padding:6px 8px">商品ID</th>
              <th style="padding:6px 8px">商品名</th>
              <th style="padding:6px 8px">除外理由</th>
            </tr>
          </thead>
          <tbody>
            ${shown.map(p => `
              <tr style="border-bottom:1px solid var(--border)">
                <td style="padding:6px 8px">${esc(p.productId)}</td>
                <td style="padding:6px 8px">${esc(p.productName)}</td>
                <td style="padding:6px 8px;white-space:normal;max-width:360px">${esc(p.reason)}</td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      </div>
    </div>
  `;
}

// previewRows（フィルター適用後・先頭50件）をrow.productId単位でグループ化する。
// 表示順は元の並び順を保持する。productIdが空の行は他行と誤って同一グループに
// ならないよう、行ごとに一意なキーを割り当てる（画面表示のみに影響、TSV/監査CSVは無関係）。
function colormeGroupRowsByProductId(rows) {
  const order = [];
  const map = new Map();
  rows.forEach((row, idx) => {
    const key = row.productId ? row.productId : `__no_id_${idx}`;
    if (!map.has(key)) {
      map.set(key, []);
      order.push(key);
    }
    map.get(key).push(row);
  });
  return order.map(key => map.get(key));
}

function colormeMerchantPreviewDetailRowHtml(row) {
  const f = row.fields;
  const allReasons = row.rejectReasons.concat(row.noteReasons);
  const reasonFullText = allReasons.join('／');
  const reasonShortText = colormeShortenReasonList(allReasons);
  const cellBase = 'padding:8px 10px;line-height:1.3;vertical-align:middle';
  const ellipsisCell = `${cellBase};white-space:nowrap;overflow:hidden;text-overflow:ellipsis`;
  return `
    <tr style="border-bottom:1px solid var(--border)">
      <td style="${ellipsisCell};padding-left:28px">${row.productId ? `<a href="${esc(colormeAdminProductEditUrl(row.productId))}" target="_blank" rel="noopener noreferrer">${esc(f.id)}</a>` : esc(f.id)}</td>
      <td style="${ellipsisCell}" title="${esc(f.title)}">${esc(f.title)}</td>
      <td style="${ellipsisCell}">${esc(f.availability)}</td>
      <td style="${ellipsisCell}">${esc(f.price)}</td>
      <td style="${ellipsisCell}">${esc(f.condition)}</td>
      <td style="${ellipsisCell}" title="${esc(f.brand)}">${esc(f.brand)}</td>
      <td style="${ellipsisCell}">${esc(f.gtin)}</td>
      <td style="${ellipsisCell}" title="${esc(f.mpn)}">${esc(f.mpn)}</td>
      <td style="${ellipsisCell}">${esc(f.identifier_exists)}</td>
      <td style="${ellipsisCell}">${esc(f.google_product_category)}</td>
      <td style="${ellipsisCell}">${esc(f.color)}</td>
      <td style="${ellipsisCell}">${esc(f.size)}</td>
      <td style="${ellipsisCell};color:${colormeVerdictColor(row.tier)}">${esc(row.tier)}</td>
      <td style="${ellipsisCell}" title="${esc(reasonFullText)}">${esc(reasonShortText)}</td>
    </tr>
  `;
}

function colormeMerchantPreviewGroupHtml(group, groupIndex) {
  const first = group[0];
  const productId = first.productId;
  const productName = first.productName;
  const brand = first.fields.brand;
  const tiers = [...new Set(group.map(r => r.tier))];
  const verdictDisplay = tiers.length === 1 ? tiers[0] : '混在';
  const verdictColor = tiers.length === 1 ? colormeVerdictColor(tiers[0]) : 'inherit';
  const verdictTitle = tiers.length > 1
    ? tiers.map(t => `${t}：${group.filter(r => r.tier === t).length}件`).join('／')
    : '';
  const idHtml = productId
    ? `<a href="${esc(colormeAdminProductEditUrl(productId))}" target="_blank" rel="noopener noreferrer" onclick="event.stopPropagation()">${esc(productId)}</a>`
    : esc(productId);
  const headerCellStyle = 'padding:8px 10px;line-height:1.3;vertical-align:middle;white-space:nowrap;overflow:hidden;text-overflow:ellipsis';
  return `
    <tbody>
      <tr style="border-bottom:1px solid var(--border);background:var(--hover-bg, rgba(127,127,127,0.08));cursor:pointer" onclick="colormeToggleMerchantPreviewGroup(${groupIndex})">
        <td colspan="14" style="${headerCellStyle}">
          <span id="colorme-group-arrow-${groupIndex}" style="display:inline-block;width:14px">▶</span>
          <strong>${idHtml}</strong>
          <span style="margin-left:10px" title="${esc(productName)}">${esc(productName)}</span>
          <span style="margin-left:10px;color:var(--muted-fg, #666)">${esc(brand)}</span>
          <span style="margin-left:10px">バリエーション${group.length}件</span>
          <span style="margin-left:10px;color:${verdictColor}" title="${esc(verdictTitle)}">${esc(verdictDisplay)}</span>
        </td>
      </tr>
    </tbody>
    <tbody id="colorme-group-body-${groupIndex}" style="display:none">
      ${group.map(colormeMerchantPreviewDetailRowHtml).join('')}
    </tbody>
  `;
}

function colormeToggleMerchantPreviewGroup(groupIndex) {
  const body = document.getElementById(`colorme-group-body-${groupIndex}`);
  const arrow = document.getElementById(`colorme-group-arrow-${groupIndex}`);
  if (!body) return;
  const isHidden = body.style.display === 'none';
  body.style.display = isHidden ? 'table-row-group' : 'none';
  if (arrow) arrow.textContent = isHidden ? '▼' : '▶';
}

function colormeMerchantPreviewPaginationControlsHtml(page, totalPages) {
  const atFirst = page <= 1;
  const atLast = page >= totalPages;
  return `
    <div style="display:flex;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap">
      <button class="btn" onclick="colormeSetMerchantPreviewPage(1)" ${atFirst ? 'disabled' : ''}>≪ 先頭</button>
      <button class="btn" onclick="colormeSetMerchantPreviewPage(${page - 1})" ${atFirst ? 'disabled' : ''}>◀ 前へ</button>
      <span>${page} / ${totalPages}ページ</span>
      <button class="btn" onclick="colormeSetMerchantPreviewPage(${page + 1})" ${atLast ? 'disabled' : ''}>次へ ▶</button>
      <button class="btn" onclick="colormeSetMerchantPreviewPage(${totalPages})" ${atLast ? 'disabled' : ''}>最終 ≫</button>
    </div>
  `;
}

function renderColormeMerchantPreviewTable() {
  const rows = ColormeCsvConverter.merchantRows;
  if (!rows || !rows.length) return '';
  const filteredRows = getColormeMerchantFilteredRows();
  const filter = ColormeCsvConverter.merchantPreviewFilter || 'all';
  const allGroups = colormeGroupRowsByProductId(filteredRows);
  const totalPages = colormeGetMerchantPreviewTotalPages(allGroups.length);
  const page = colormeClampMerchantPreviewPage(ColormeCsvConverter.merchantPreviewPage || 1, totalPages);
  if (page !== ColormeCsvConverter.merchantPreviewPage) ColormeCsvConverter.merchantPreviewPage = page;
  const startIndex = (page - 1) * COLORME_MERCHANT_GROUPS_PER_PAGE;
  const pageGroups = allGroups.slice(startIndex, startIndex + COLORME_MERCHANT_GROUPS_PER_PAGE);
  const paginationHtml = colormeMerchantPreviewPaginationControlsHtml(page, totalPages);
  return `
    <div class="card" style="margin-top:20px">
      <h3 style="margin-bottom:12px">Merchant変換プレビュー（表示${pageGroups.length}商品 / 該当${allGroups.length}商品 / 該当${filteredRows.length}行 / 変換候補${rows.length}行）</h3>
      <p class="idea-plan-note">商品ID単位でグループ化・ページネーションしています（1ページ${COLORME_MERCHANT_GROUPS_PER_PAGE}商品）。見出し行をクリックすると各バリエーション行を展開・折りたたみできます。</p>
      <div class="form-group" style="max-width:280px">
        <label>フィルター</label>
        <select onchange="colormeSetMerchantPreviewFilter(this.value)">
          ${COLORME_PREVIEW_FILTER_OPTIONS.map(o => `<option value="${o.value}" ${o.value === filter ? 'selected' : ''}>${o.label}</option>`).join('')}
        </select>
      </div>
      ${paginationHtml}
      <div style="overflow-x:auto">
        <table style="width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed">
          <thead>
            <tr style="text-align:left;border-bottom:1px solid var(--border)">
              <th style="padding:8px 10px;line-height:1.3;vertical-align:middle;width:150px">id</th>
              <th style="padding:8px 10px;line-height:1.3;vertical-align:middle;width:300px">title</th>
              <th style="padding:8px 10px;line-height:1.3;vertical-align:middle;width:80px">availability</th>
              <th style="padding:8px 10px;line-height:1.3;vertical-align:middle;width:90px">price</th>
              <th style="padding:8px 10px;line-height:1.3;vertical-align:middle;width:70px">condition</th>
              <th style="padding:8px 10px;line-height:1.3;vertical-align:middle;width:110px">brand</th>
              <th style="padding:8px 10px;line-height:1.3;vertical-align:middle;width:70px">gtin</th>
              <th style="padding:8px 10px;line-height:1.3;vertical-align:middle;width:90px">mpn</th>
              <th style="padding:8px 10px;line-height:1.3;vertical-align:middle;width:90px">identifier_exists</th>
              <th style="padding:8px 10px;line-height:1.3;vertical-align:middle;width:90px">google_product_category</th>
              <th style="padding:8px 10px;line-height:1.3;vertical-align:middle;width:80px">color</th>
              <th style="padding:8px 10px;line-height:1.3;vertical-align:middle;width:80px">size</th>
              <th style="padding:8px 10px;line-height:1.3;vertical-align:middle;width:70px">判定</th>
              <th style="padding:8px 10px;line-height:1.3;vertical-align:middle;width:220px">理由</th>
            </tr>
          </thead>
          ${pageGroups.map((group, i) => colormeMerchantPreviewGroupHtml(group, i)).join('')}
        </table>
      </div>
      ${paginationHtml}
    </div>
  `;
}

(async () => {
  const { data: { session } } = await sb.auth.getSession();
  if (session) {
    App.user = session.user;
    initApp();
  } else {
    renderAuth();
  }
  sb.auth.onAuthStateChange((event, session) => {
    if (event === 'PASSWORD_RECOVERY') {
      showUpdatePassword();
    } else if (event === 'SIGNED_IN' && session) {
      // Supabase Authはタブのフォーカス復帰時などに、実際には再ログインしていなくても
      // 'SIGNED_IN' を再度発火させることがある（report-editorial-result-loss.md参照）。
      // 同じユーザーで既にログイン済みの場合はinitApp()を呼ばず、画面の再描画（＝入力中の
      // フォームや生成結果の消失）を防ぐ。ユーザーが変わった場合・初回ログイン時のみ再初期化する。
      const isSameUserAlreadySignedIn = App.user && App.user.id === session.user.id;
      App.user = session.user;
      if (!isSameUserAlreadySignedIn) {
        initApp();
      }
    } else if (event === 'SIGNED_OUT') {
      App.user = null;
      document.getElementById('user-info').innerHTML = '';
      renderAuth();
    }
  });
})();
</script>
</body>
</html>
