// ような別テーブルは持たず、editorial_articles.thumbnail_pathへ直接1パスだけを保存する
// （blog-publication-thumbnail-applause-management-report.md参照。バケット自体はまだ作成されて
// いないため、実際に使用する前にsupabase/editorial_thumbnails_bucket.sqlの内容をSupabaseダッシュ
// ボードで手動実行する必要がある）。
const EDITORIAL_THUMBNAIL_BUCKET = 'editorial-thumbnails';
const EDITORIAL_THUMBNAIL_SIGNED_URL_EXPIRY = CATALOG_PHOTO_SIGNED_URL_EXPIRY;

async function uploadEditorialThumbnail(articleId, processed) {
  const path = `${App.user.id}/${articleId}/${crypto.randomUUID()}.jpg`;
  const { error } = await sb.storage.from(EDITORIAL_THUMBNAIL_BUCKET)
    .upload(path, processed.blob, { contentType: 'image/jpeg' });
  if (error) {
    console.error('[editorial thumbnail upload error]', error);
    throw new Error(`サムネイルのアップロードに失敗しました：${error.message}`);
  }
  return path;
}

async function deleteEditorialThumbnailFile(path) {
  if (!path) return;
  const { error } = await sb.storage.from(EDITORIAL_THUMBNAIL_BUCKET).remove([path]);
  if (error) console.error('[editorial thumbnail delete error]', error);
}

async function getEditorialThumbnailSignedUrl(path) {
  if (!path) return null;
  const { data, error } = await sb.storage.from(EDITORIAL_THUMBNAIL_BUCKET).createSignedUrls([path], EDITORIAL_THUMBNAIL_SIGNED_URL_EXPIRY);
  if (error || !data || !data[0]) return null;
  return data[0].signedUrl || null;
}

// ブログ書庫一覧のサムネイル用：登録済みの全記事分のthumbnail_pathをまとめて
// createSignedUrls()に渡し、1回のAPI呼び出しで署名付きURLを取得する（N+1回避。
// catalog-library-thumbnail-implementation-report.mdと同じ設計）。
async function loadEditorialLibraryThumbnails(items) {
  App._editorialLibraryThumbnails = {};
  const paths = items.filter(a => a.thumbnailPath).map(a => a.thumbnailPath);
  if (!paths.length) return;
  const { data, error } = await sb.storage.from(EDITORIAL_THUMBNAIL_BUCKET).createSignedUrls(paths, EDITORIAL_THUMBNAIL_SIGNED_URL_EXPIRY);
  if (error) { console.error('ブログ書庫サムネイルの署名付きURL取得に失敗しました:', error); return; }
  const urlByPath = {};
  (data || []).forEach((s, i) => { urlByPath[paths[i]] = s.signedUrl || ''; });
  items.forEach(a => {
    if (a.thumbnailPath && urlByPath[a.thumbnailPath]) App._editorialLibraryThumbnails[a.id] = urlByPath[a.thumbnailPath];
  });
}

// 複数ファイルを1枚ずつ順番に処理する（同時並列処理による負荷集中を避けるため。
// catalog-production-phase3a-photo-readiness.md 19章「大容量画像でブラウザ停止」参照）。
async function handleCatalogPhotoFiles(catalogProductId, fileList) {
  const files = Array.from(fileList);
  const statusEl = document.getElementById('catalog-photo-upload-status');
  const existing = await CatalogPhotoStore.list(catalogProductId);
  const remainingSlots = CATALOG_PHOTO_MAX_COUNT - existing.length;
  if (remainingSlots <= 0) {
    if (statusEl) statusEl.textContent = `既に上限（${CATALOG_PHOTO_MAX_COUNT}枚）に達しています。追加するには先に削除してください。`;
    return;
  }
  const toUpload = files.slice(0, remainingSlots);
  const skipped = files.length - toUpload.length;

  let nextSortOrder = existing.length ? Math.max(...existing.map(p => p.sortOrder)) + 1 : 0;
  let hasPrimary = existing.some(p => p.isPrimary);
  let failedCount = 0;

  for (const file of toUpload) {
    if (statusEl) statusEl.textContent = `アップロード中... (${file.name})`;
    try {
      await uploadCatalogPhoto(catalogProductId, file, nextSortOrder, !hasPrimary);
      hasPrimary = true;
      nextSortOrder++;
    } catch (e) {
      failedCount++;
      console.error(e);
      if (statusEl) statusEl.textContent = `エラー：${e.message}`;
    }
  }

  if (statusEl && failedCount === 0) {
    statusEl.textContent = skipped > 0
      ? `上限（${CATALOG_PHOTO_MAX_COUNT}枚）を超えるため、${toUpload.length}枚のみアップロードしました。`
      : '';
  }
  await renderCatalogPhotoList(catalogProductId);
}

function catalogPhotoFileSelected(event, catalogProductId) {
  const files = event.target.files;
  if (files && files.length) handleCatalogPhotoFiles(catalogProductId, files);
  event.target.value = '';
}

function catalogPhotoDragOver(event) {
  event.preventDefault();
  event.currentTarget.classList.add('drag-over');
}
function catalogPhotoDragLeave(event) {
  event.currentTarget.classList.remove('drag-over');
}
function catalogPhotoDrop(event, catalogProductId) {
  event.preventDefault();
  event.currentTarget.classList.remove('drag-over');
  const files = event.dataTransfer.files;
  if (files && files.length) handleCatalogPhotoFiles(catalogProductId, files);
}

async function renderCatalogPhotoList(catalogProductId) {
  const listEl = document.getElementById('catalog-photo-list');
  if (!listEl) return;
  const photos = await CatalogPhotoStore.list(catalogProductId);

  // 写真解析ボタンは、写真が1枚もない間は無効化する（Phase3-A3参照）。
  // 写真の追加・削除のたびにこの関数が呼ばれるため、ここで都度状態を同期しておけば、
  // 別途ボタン専用の再描画処理を用意しなくてもよい。
  const analyzeBtn = document.getElementById('catalog-photo-analyze-btn');
  if (analyzeBtn) analyzeBtn.disabled = photos.length === 0;

  if (!photos.length) {
    listEl.innerHTML = '<p class="idea-plan-note">写真はまだ登録されていません。</p>';
    return;
  }

  const paths = photos.map(p => p.storagePath);
  const { data: signedUrls, error } = await sb.storage.from(CATALOG_PHOTO_BUCKET).createSignedUrls(paths, CATALOG_PHOTO_SIGNED_URL_EXPIRY);
  if (error) console.error('署名付きURLの取得に失敗しました:', error);
  const urlMap = {};
  (signedUrls || []).forEach((s, i) => { urlMap[paths[i]] = s.signedUrl || ''; });

  listEl.innerHTML = photos.map(p => `
    <div class="catalog-photo-item${p.isPrimary ? ' is-primary' : ''}" data-photo-id="${p.id}">
      <img src="${urlMap[p.storagePath] || ''}" alt="${esc(p.fileName)}" loading="lazy">
      ${p.isPrimary ? '<span class="catalog-photo-primary-badge">メイン</span>' : ''}
      <div class="catalog-photo-item-actions">
        ${!p.isPrimary ? `<button class="btn" onclick="setCatalogPhotoPrimary('${catalogProductId}','${p.id}')">メインにする</button>` : ''}
        <button class="btn" onclick="deleteCatalogPhoto('${catalogProductId}','${p.id}')">削除</button>
      </div>
    </div>
  `).join('');
}

async function setCatalogPhotoPrimary(catalogProductId, photoId) {
  await CatalogPhotoStore.setPrimary(catalogProductId, photoId);
  await renderCatalogPhotoList(catalogProductId);
}

async function deleteCatalogPhoto(catalogProductId, photoId) {
  if (!confirm('この写真を削除しますか？')) return;
  const photos = await CatalogPhotoStore.list(catalogProductId);
  const target = photos.find(p => p.id === photoId);
  if (!target) return;

  const { error: storageError } = await sb.storage.from(CATALOG_PHOTO_BUCKET).remove([target.storagePath]);
  if (storageError) console.error('写真のStorage削除に失敗しました（DB削除は続行します）:', storageError);
  await CatalogPhotoStore.remove(photoId);

  // 削除した写真がメインだった場合、残りの写真のうち先頭（sort_order最小）を自動的にメインへ昇格させる。
  // これにより「写真はあるがメインが存在しない」という状態を避ける。
  if (target.isPrimary) {
    const remaining = photos.filter(p => p.id !== photoId).sort((a, b) => a.sortOrder - b.sortOrder);
    if (remaining.length) await CatalogPhotoStore.setPrimary(catalogProductId, remaining[0].id);
  }

  await renderCatalogPhotoList(catalogProductId);
}

// ── Phase3-A2続き：新規登録時の一時写真キュー ──
// 新規登録画面では商品がまだ保存されておらずcatalog_product_idが存在しないため、
// Storageへは送らずブラウザ内メモリ（App._catalogPendingPhotos）にのみ保持する。
// リサイズ・圧縮は選択時点で行い、実際のStorage/DBへの保存は商品保存成功後（saveCatalogProduct内）で行う。
// （catalog-production-phase3a2-new-product-photo-flow-report.md参照）

function resetCatalogPendingPhotos() {
  (App._catalogPendingPhotos || []).forEach(p => URL.revokeObjectURL(p.objectUrl));
  App._catalogPendingPhotos = [];
}

function confirmDiscardPendingCatalogPhotos() {
  if (!App._catalogPendingPhotos || !App._catalogPendingPhotos.length) return true;
  return confirm(`保存前の写真（${App._catalogPendingPhotos.length}枚）が失われます。よろしいですか？`);
}

// ブラウザの再読み込み・タブを閉じる操作から、未保存の一時写真が無言で失われることを防ぐ
window.addEventListener('beforeunload', (e) => {
  if (App._catalogPendingPhotos && App._catalogPendingPhotos.length) {
    e.preventDefault();
    e.returnValue = '';
  }
});

function catalogBackToLibrary() {
  if (!confirmDiscardPendingCatalogPhotos()) return;
  resetCatalogPendingPhotos();
  renderCatalogLibrary();
}

async function handleCatalogPendingPhotoFiles(fileList) {
  const files = Array.from(fileList);
  const statusEl = document.getElementById('catalog-photo-upload-status');
  const remainingSlots = CATALOG_PHOTO_MAX_COUNT - App._catalogPendingPhotos.length;
  if (remainingSlots <= 0) {
    if (statusEl) statusEl.textContent = `既に上限（${CATALOG_PHOTO_MAX_COUNT}枚）に達しています。追加するには先に選択解除してください。`;
    return;
  }
  const toProcess = files.slice(0, remainingSlots);
  const skipped = files.length - toProcess.length;
  let failedCount = 0;

  for (const file of toProcess) {
    if (statusEl) statusEl.textContent = `処理中... (${file.name})`;
    try {
      const processed = await processCatalogPhotoFile(file);
      const objectUrl = URL.createObjectURL(processed.blob);
      App._catalogPendingPhotos.push({ tempId: crypto.randomUUID(), processed, objectUrl });
    } catch (e) {
      failedCount++;
      console.error(e);
      if (statusEl) statusEl.textContent = `エラー：${e.message}`;
    }
  }

  if (statusEl && failedCount === 0) {
    statusEl.textContent = skipped > 0
      ? `上限（${CATALOG_PHOTO_MAX_COUNT}枚）を超えるため、${toProcess.length}枚のみ選択しました。`
      : '';
  }
  renderCatalogPendingPhotoList();
}

function catalogPendingPhotoFileSelected(event) {
  const files = event.target.files;
  if (files && files.length) handleCatalogPendingPhotoFiles(files);
  event.target.value = '';
}

function catalogPendingPhotoDrop(event) {
  event.preventDefault();
  event.currentTarget.classList.remove('drag-over');
  const files = event.dataTransfer.files;
  if (files && files.length) handleCatalogPendingPhotoFiles(files);
}

function removeCatalogPendingPhoto(tempId) {
  const target = App._catalogPendingPhotos.find(p => p.tempId === tempId);
  if (!target) return;
  URL.revokeObjectURL(target.objectUrl);
  App._catalogPendingPhotos = App._catalogPendingPhotos.filter(p => p.tempId !== tempId);
  renderCatalogPendingPhotoList();
}

function renderCatalogPendingPhotoList() {
  const listEl = document.getElementById('catalog-photo-list');
  if (!listEl) return;
  if (!App._catalogPendingPhotos.length) {
    listEl.innerHTML = '<p class="idea-plan-note">写真はまだ選択されていません。</p>';
    return;
  }
  listEl.innerHTML = App._catalogPendingPhotos.map((p, i) => `
    <div class="catalog-photo-item${i === 0 ? ' is-primary' : ''}" data-temp-id="${p.tempId}">
      <img src="${p.objectUrl}" alt="${esc(p.processed.fileName)}" loading="lazy">
      ${i === 0 ? '<span class="catalog-photo-primary-badge">メイン予定</span>' : ''}
      <div class="catalog-photo-item-actions">
        <button class="btn" onclick="removeCatalogPendingPhoto('${p.tempId}')">選択解除</button>
      </div>
    </div>
  `).join('');
}

// ── Phase3-A3：写真の画像解析（catalog-production-phase3a3-image-analysis-report.md参照） ──
// 写真から視認できる情報のみを「写真から確認」「写真から推定」「要検証」に整理して表示する。
// spec_data・商品解説・SEOへの自動反映は行わない。既存callClaude()は変更しない。

// カテゴリー別の写真確認候補（店舗入力ベースのCATALOG_SPEC_CANDIDATESとは別の、写真専用のリスト）
const CATALOG_PHOTO_ANALYSIS_CANDIDATES = {
  '革靴・シューズ': ['デザイン', 'トゥ形状', '羽根形状', 'ステッチ', 'ウエルト形状', 'ソール形状', 'ヒール形状', '靴紐', '金具', 'ライニング', 'インソール表記', '色', '革の表情'],
  'バッグ': ['形状', 'ハンドル', 'ストラップ', '開閉', 'ポケット', '金具', 'マチ', '内装', '色', '革の表情'],
  '財布・革小物': ['収納構造', 'カード段', '小銭入れ', 'ファスナー', '金具', '内装', '色', '革の表情'],
  '衣類': ['シルエット', '襟', 'ポケット', 'ボタン', 'ファスナー', '裏地', '色', '生地表情'],
  'アクセサリー': ['モチーフ', '金属色', '表面仕上げ', '石', '刻印', 'サイズ感'],
};

// 写真だけでは正確に断定できない項目（値・項目名のいずれかに含まれていれば除外する）。
// 「サイズ感」はアクセサリーの写真確認候補としても使うため、あえて含めていない
// （断定禁止はプロンプト側の指示で「実寸ではなく見た目の印象にとどめる」よう対応する）。
const CATALOG_PHOTO_FORBIDDEN_ITEM_PATTERN = /素材名|木型|製法|生産国|重量|ソール品番|金属素材|色名|公式名称|耐久性/;

async function blobToBase64(blob) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result).split(',')[1] || '');
    reader.onerror = reject;
    reader.readAsDataURL(blob);
  });
}

// 既存のcallClaude()はテキスト専用のため変更せず、画像対応は完全に独立した関数として新設する。
async function callClaudeWithImages(prompt, images, maxTokens = 2048) {
  const apiKey = getApiKey();
  if (!apiKey) {
    throw new Error('APIキーが設定されていません。設定タブからClaude APIキーを入力してください。');
  }
  const content = [];
  images.forEach((img, i) => {
    content.push({ type: 'text', text: `[写真${i + 1}${img.label ? `：${img.label}` : ''}]` });
    content.push({ type: 'image', source: { type: 'base64', media_type: img.mediaType, data: img.base64 } });
  });
  content.push({ type: 'text', text: prompt });

  const res = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': apiKey,
      'anthropic-version': '2023-06-01',
      'anthropic-dangerous-direct-browser-access': 'true',
    },
    body: JSON.stringify({
      model: 'claude-sonnet-4-6',
      max_tokens: maxTokens,
      messages: [{ role: 'user', content }],
    }),
  });
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(err.error?.message || `API error: ${res.status}`);
  }
  const data = await res.json();
  return data.content[0].text;
}

// 署名付きURLをそのままAnthropicへ渡さず、Storageから直接ダウンロードしてbase64化する。
// 1枚読み込みに失敗しても、その写真だけ除外して残りを解析対象にする。
async function loadCatalogPhotosForAnalysis(catalogProductId) {
  const photos = await CatalogPhotoStore.list(catalogProductId); // sort_order順
  const images = [];
  const failedPhotos = [];
  for (const photo of photos) {
    try {
      const { data: blob, error } = await sb.storage.from(CATALOG_PHOTO_BUCKET).download(photo.storagePath);
      if (error || !blob) throw error || new Error('ダウンロードに失敗しました');
      const base64 = await blobToBase64(blob);
      images.push({ photo, mediaType: photo.mimeType || 'image/jpeg', base64, label: photo.role || '' });
    } catch (e) {
      console.error('[Photo download error]', photo.storagePath, e);
      failedPhotos.push(photo.fileName || photo.storagePath);
    }
  }
  return { images, failedPhotos };
}

function buildCatalogPhotoAnalysisPrompt(item, images) {
  const candidates = CATALOG_PHOTO_ANALYSIS_CANDIDATES[item.category];
  const candidateSection = candidates
    ? `このカテゴリー（${item.category}）で写真から確認できる可能性がある項目の例は以下です。\n${candidates.map(c => `・${c}`).join('\n')}`
    : `カテゴリー「${item.category}」について、写真から確認できる項目を判断してください。`;
  const photoList = images.map((img, i) => `写真${i + 1}${img.label ? `（${img.label}）` : ''}`).join('、');

  return `あなたは「シューズサロンなとりや」の商品カタログ制作担当です。
添付された商品写真（${photoList}）だけを根拠に、写真から視認できる情報を整理してください。

【最重要の安全ルール】
- 写真に写っていない内容を、一般知識や推測で補完してはいけません。
- 次の項目は、写真だけでは正確に断定できないため、断定的に出力しないでください：素材名（正確な種類）、木型、製法、生産国、重量、ソール品番、金属素材（正確な種類）、正確な色名、公式名称、耐久性。これらが入力情報に明記されている場合も、写真からの確認としては扱わないでください（店舗提供情報としては別に扱われるため、ここでは触れなくてよいです）。
- 「サイズ感」に言及する場合は、実寸や着用感を断定せず、見た目の印象（例：華奢、大ぶり）にとどめてください。
- 複数の写真の間で内容が矛盾する場合（例：色味が写真によって異なって見える）は、「確認」ではなく「要検証」に分類してください。
- 写真に人物・伝票・住所・電話番号・その他の個人情報が写り込んでいる場合は、必ずPRIVACY_WARNINGSに明記してください。

【入力情報（店舗側の登録内容。写真と矛盾する場合は照合してください）】
ブランド名: ${item.brand}
商品名: ${item.productName}
品番: ${item.modelNumber || '（未入力）'}
カテゴリー: ${item.category}
既知スペック:
---
${item.knownSpecs || '（入力なし）'}
---
補足情報:
---
${item.supplementaryInfo || '（入力なし）'}
---

${candidateSection}

【出力形式】
以下のマーカー形式で、指定した順番通りに出力してください。マーカー自体は改変しないでください。

===CONFIRMED_ITEMS===
（写真から明確に確認できた項目。1行1項目、「項目名|内容」の形式。曖昧な場合はここに含めずESTIMATED_ITEMSかNEEDS_VERIFICATION_ITEMSへ）
===ESTIMATED_ITEMS===
（写真から推定した項目。断定は避けた表現にすること。1行1項目、「項目名|内容」の形式）
===NEEDS_VERIFICATION_ITEMS===
（複数写真で矛盾する、または判断に迷う項目。1行1項目、「項目名|内容」の形式。特になければ「特になし」）
===PHOTO_OBSERVATIONS===
（写真ごとの観察結果。1行1項目、「写真番号（例：写真1）|観察内容」の形式）
===CONTRADICTION_WARNINGS===
（入力情報と写真内容が矛盾する場合の警告。1行1項目。特になければ「特になし」）
===PRIVACY_WARNINGS===
（人物・伝票・住所・電話番号等が写り込んでいる場合の警告。1行1項目。特になければ「特になし」）
===NOTES===
（その他の注意事項。特になければ「特になし」）
===END===`;
}

const CATALOG_PHOTO_ANALYSIS_MARKERS = [
  ['confirmedRaw', '===CONFIRMED_ITEMS==='],
  ['estimatedRaw', '===ESTIMATED_ITEMS==='],
  ['needsVerificationRaw', '===NEEDS_VERIFICATION_ITEMS==='],
  ['photoObservationsRaw', '===PHOTO_OBSERVATIONS==='],
  ['contradictionWarningsRaw', '===CONTRADICTION_WARNINGS==='],
  ['privacyWarningsRaw', '===PRIVACY_WARNINGS==='],
  ['notesRaw', '===NOTES==='],
];
const CATALOG_PHOTO_ANALYSIS_END_MARKER = '===END===';

// 既存のparseCatalogGenerationSections()と同じマーカー方式のパーサー（JSON直接解析には依存しない）。
function parseCatalogPhotoAnalysis(text) {
  const plan = {};
  for (let i = 0; i < CATALOG_PHOTO_ANALYSIS_MARKERS.length; i++) {
    const [key, marker] = CATALOG_PHOTO_ANALYSIS_MARKERS[i];
    const nextMarker = i + 1 < CATALOG_PHOTO_ANALYSIS_MARKERS.length
      ? CATALOG_PHOTO_ANALYSIS_MARKERS[i + 1][1]
      : CATALOG_PHOTO_ANALYSIS_END_MARKER;
    const start = text.indexOf(marker);
    if (start === -1) continue;
    const contentStart = start + marker.length;
    const endIdx = text.indexOf(nextMarker, contentStart);
    plan[key] = (endIdx === -1 ? text.slice(contentStart) : text.slice(contentStart, endIdx)).trim();
  }
  if (Object.keys(plan).length === 0) {
    throw new Error('項目の区切りマーカーが見つかりません');
  }
  return plan;
}

// 「項目名|内容」形式の行をパースする。confidenceはAIの自己申告に頼らず、
// どのマーカー（確認／推定／要検証）に属していたかで機械的に決定する。
// status（採用/却下/保留の管理、catalog-production-photo-analysis-adoption-implementation-report.md参照）は
// 初期値として常に'pending'を持たせる。
function parseCatalogPhotoAnalysisRows(raw, confidence) {
  const lines = (raw || '').split('\n').map(l => l.trim()).filter(Boolean);
  const rows = [];
  for (const line of lines) {
    const idx = line.indexOf('|');
    if (idx === -1) continue;
    const item = line.slice(0, idx).trim();
    const value = line.slice(idx + 1).trim();
    if (!item || !value) continue;
    rows.push({ item, value, confidence, status: 'pending' });
  }
  return rows;
}

// 過去（statusフィールド導入前）に保存された解析結果を復元する際、statusが欠けている行を
// 'pending'へフォールバックさせる（既存データとの後方互換性）。
function normalizePhotoAnalysisRowStatus(rows) {
  return (Array.isArray(rows) ? rows : []).map(r => ({ ...r, status: r.status || 'pending' }));
}

function parseCatalogPhotoObservations(raw) {
  const lines = (raw || '').split('\n').map(l => l.trim()).filter(Boolean);
  return lines.map(line => {
    const idx = line.indexOf('|');
    if (idx === -1) return { label: '', observation: line };
    return { label: line.slice(0, idx).trim(), observation: line.slice(idx + 1).trim() };
  });
}

// 写真だけでは断定できない項目（CATALOG_PHOTO_FORBIDDEN_ITEM_PATTERN）が
// 項目名・値のいずれかに含まれる行を除外する（プロンプト指示への「コード側の保険」）。
function filterForbiddenPhotoClaims(rows) {
  const kept = [];
  let rejectedCount = 0;
  for (const row of rows) {
    if (CATALOG_PHOTO_FORBIDDEN_ITEM_PATTERN.test(row.item) || CATALOG_PHOTO_FORBIDDEN_ITEM_PATTERN.test(row.value)) {
      rejectedCount++;
      continue;
    }
    kept.push(row);
  }
  return { rows: kept, rejectedCount };
}

async function analyzeCatalogPhotos(catalogProductId) {
  const btn = document.getElementById('catalog-photo-analyze-btn');
  const resultArea = document.getElementById('catalog-photo-analysis-result');
  if (!btn || btn.disabled) return; // 二重送信防止
  btn.disabled = true;
  btn.textContent = '写真を解析中...';
  resultArea.innerHTML = '<div class="ai-result"><div class="loading">写真を解析しています...</div></div>';

  try {
    const item = await CatalogStore.find(catalogProductId);
    if (!item) throw new Error('商品が見つかりませんでした。');

    const { images, failedPhotos } = await loadCatalogPhotosForAnalysis(catalogProductId);
    if (!images.length) {
      throw new Error('解析可能な写真がありません。');
    }

    const prompt = buildCatalogPhotoAnalysisPrompt(item, images);
    const imagePayload = images.map(({ mediaType, base64, label }) => ({ mediaType, base64, label }));
    const raw = await callClaudeWithImages(prompt, imagePayload, 3000);
    const parsed = parseCatalogPhotoAnalysis(raw);

    const confirmed = filterForbiddenPhotoClaims(parseCatalogPhotoAnalysisRows(parsed.confirmedRaw, '高'));
    const estimated = filterForbiddenPhotoClaims(parseCatalogPhotoAnalysisRows(parsed.estimatedRaw, '中'));
    const needsVerificationRows = parseCatalogPhotoAnalysisRows(parsed.needsVerificationRaw, '要検証');
    const photoObservations = parseCatalogPhotoObservations(parsed.photoObservationsRaw);
    const contradictionWarnings = parseCatalogListLines(parsed.contradictionWarningsRaw, ['特になし']);
    const privacyWarnings = parseCatalogListLines(parsed.privacyWarningsRaw, ['特になし']);
    const notes = parseCatalogListLines(parsed.notesRaw, ['特になし']);

    const analyzedAt = new Date().toISOString();
    const analysisResult = {
      confirmedRows: confirmed.rows,
      estimatedRows: estimated.rows,
      needsVerificationRows,
      rejectedCount: confirmed.rejectedCount + estimated.rejectedCount,
      photoObservations,
      contradictionWarnings,
      privacyWarnings,
      notes,
      failedPhotos,
      analyzedPhotoCount: images.length,
      analyzedAt,
    };

    // photo_analysis_result（catalog_products）へ保存し、編集画面を開き直しても再表示できるようにする。
    // 保存自体が失敗しても、解析結果は表示する（saveFailedで警告を出す。解析成功をなかったことにしない）。
    const saveOk = await CatalogStore.savePhotoAnalysisResult(catalogProductId, analysisResult);
    if (!saveOk) console.error('[Photo analysis save error] photo_analysis_resultへの保存に失敗しました');

    App._catalogPhotoAnalysis = { catalogProductId, ...analysisResult, isSaved: false, saveFailed: !saveOk };

    // 解析に使われた写真のみ、analysis_statusをanalyzedへ更新する（既存列のためスキーマ変更不要）。
    for (const { photo } of images) {
      await CatalogPhotoStore.updateAnalysisStatus(photo.id, 'analyzed');
    }
    // 写真一覧の再描画（サムネイル表示の更新）はこの解析結果表示とは独立した処理のため、
    // ここで失敗しても解析自体は成功として扱う（renderCatalogPhotoListの失敗で
    // 解析結果表示が誤って上書きされないようにする）。
    try {
      await renderCatalogPhotoList(catalogProductId);
    } catch (renderError) {
      console.error('[Photo list refresh error]', renderError);
    }

    btn.disabled = false;
    btn.textContent = '\u{1F50D} 写真を解析';
    renderCatalogPhotoAnalysisResult();
  } catch (e) {
    console.error('[Photo analysis error]', e);
    btn.disabled = false;
    btn.textContent = '\u{1F50D} 写真を解析';
    resultArea.innerHTML = `<div class="ai-result" style="border-color:var(--danger)">写真の解析に失敗しました。${esc(e.message)}</div>`;
  }
}

// 写真解析結果1件をcatalog_productsへ保存する共通処理（採用/却下/取り消しのいずれからも呼ぶ）。
// analyzeCatalogPhotos()が組み立てるanalysisResultと同じ形へ詰め直すだけの薄いヘルパー。
function buildPhotoAnalysisResultPayload(a) {
  return {
    confirmedRows: a.confirmedRows,
    estimatedRows: a.estimatedRows,
    needsVerificationRows: a.needsVerificationRows,
    rejectedCount: a.rejectedCount,
    photoObservations: a.photoObservations,
    contradictionWarnings: a.contradictionWarnings,
    privacyWarnings: a.privacyWarnings,
    notes: a.notes,
    failedPhotos: a.failedPhotos,
    analyzedPhotoCount: a.analyzedPhotoCount,
    analyzedAt: a.analyzedAt,
  };
}
async function savePhotoAnalysisStatusChange(a) {
  return CatalogStore.savePhotoAnalysisResult(a.catalogProductId, buildPhotoAnalysisResultPayload(a));
}

function getCatalogPhotoAnalysisRows(a, sourceType) {
  if (sourceType === 'confirmed') return a.confirmedRows;
  if (sourceType === 'estimated') return a.estimatedRows;
  return a.needsVerificationRows;
}

// 採用：写真から確認／推定した項目をspec_dataへ反映する（要検証項目は対象外・呼び出し側でボタン自体を出さない）。
// 推定項目（confidence:中）は断定リスクがあるため、採用前にconfirm()で確認する。
async function adoptCatalogPhotoAnalysisItem(sourceType, index) {
  // 要検証項目は採用不可（UIにボタンを出さないだけでなく、ここでも明示的に拒否する。
  // 「指示＋コード側の保険」という既存の方針を踏襲）。
  if (sourceType !== 'confirmed' && sourceType !== 'estimated') return;

  const a = App._catalogPhotoAnalysis;
  if (!a) return;
  const rows = getCatalogPhotoAnalysisRows(a, sourceType);
  const row = rows && rows[index];
  if (!row || row.status === 'adopted') return;

  if (sourceType === 'estimated') {
    if (!confirm(`「${row.item}」は写真からの推定情報（確信度：中）です。断定的な内容としてスペック表へ採用しますか？`)) return;
  }

  const g = App._catalogGeneration;
  if (!g) {
    alert('先にカタログ原稿を生成してください。');
    return;
  }

  // 手動編集済みフィールド（manual-edit-protection）と同様に、写真由来である目印としてphotoDerivedを付与する。
  // sourceItem（採用元の写真解析項目名）・sourceType（出所種別）も記録し、後から項目名を編集しても
  // 採用元との対応関係を追跡できるようにする（catalog-spec-row-edit-delete-implementation-report.md参照）。
  // 同一item名の既存行があれば置き換える（重複行を作らない）。
  const category = row.confidence === '中' ? '写真から推定' : '写真から確認';
  const newSpecRow = {
    item: row.item, value: row.value, category, confidence: row.confidence, status: 'unreviewed',
    photoDerived: true, sourceItem: row.item, sourceType: 'photo_analysis',
  };
  const existingIndex = g.specRows.findIndex(r => r.item === row.item);
  if (existingIndex >= 0) {
    g.specRows[existingIndex] = newSpecRow;
  } else {
    g.specRows.push(newSpecRow);
  }
  g.specHtml = buildCatalogSpecHtml(g.parsed, g.item, g.specRows, g.specId);
  g.htmlIssues = validateCatalogSpecHtml(g.specHtml);

  row.status = 'adopted';

  const specSaveOk = await CatalogStore.updateSpecData(g.id, g.specRows, g.specHtml, '写真解析結果からスペック項目を採用');
  const analysisSaveOk = await savePhotoAnalysisStatusChange(a);
  if (!specSaveOk || !analysisSaveOk) console.error('[Photo analysis adopt] 保存に失敗しました', { specSaveOk, analysisSaveOk });

  renderCatalogGenerationResult();
  renderCatalogPhotoAnalysisResult();
}

// 却下：spec_dataには一切触れない（採用済みの項目は却下できない。取り消しを使う）。
async function rejectCatalogPhotoAnalysisItem(sourceType, index) {
  const a = App._catalogPhotoAnalysis;
  if (!a) return;
  const rows = getCatalogPhotoAnalysisRows(a, sourceType);
  const row = rows && rows[index];
  if (!row || row.status === 'adopted') return;

  row.status = 'rejected';
  const ok = await savePhotoAnalysisStatusChange(a);
  if (!ok) console.error('[Photo analysis reject] 保存に失敗しました');

  renderCatalogPhotoAnalysisResult();
}

// 共通コア：spec_data配列から指定行（オブジェクト参照）を削除し、specHtmlを再構築・保存する。
// 「取り消す」（写真解析結果パネル）と「削除」（管理用一覧）の両方がこの処理を共有する。
// indexOf()でオブジェクト参照を探すため、既に削除済みの行に対して呼ばれた場合は何もしない
// （二重実行防御。catalog-spec-row-edit-delete-implementation-report.md参照）。
async function removeSpecRowFromGeneration(specRow, summary) {
  const g = App._catalogGeneration;
  if (!g) return false;
  const idx = g.specRows.indexOf(specRow);
  if (idx === -1) return false;
  g.specRows.splice(idx, 1);
  g.specHtml = buildCatalogSpecHtml(g.parsed, g.item, g.specRows, g.specId);
  g.htmlIssues = validateCatalogSpecHtml(g.specHtml);
  return CatalogStore.updateSpecData(g.id, g.specRows, g.specHtml, summary);
}

// 採用取り消し：spec_dataから該当行を削除し、statusはrejectedではなくpendingへ戻す（再採用可能にするため）。
async function undoCatalogPhotoAnalysisAdoption(sourceType, index) {
  if (sourceType !== 'confirmed' && sourceType !== 'estimated') return; // 要検証項目は採用され得ないため対象外
  const a = App._catalogPhotoAnalysis;
  if (!a) return;
  const rows = getCatalogPhotoAnalysisRows(a, sourceType);
  const row = rows && rows[index];
  if (!row || row.status !== 'adopted') return; // 既にpending/rejectedなら何もしない（二重実行防御）

  const g = App._catalogGeneration;
  if (g) {
    // sourceItemで対応するspec_data行を探す。sourceItemがない旧データはitem名で探す（後方互換）。
    const specRow = g.specRows.find(r => r.photoDerived && (r.sourceItem ? r.sourceItem === row.item : r.item === row.item));
    if (specRow) {
      await removeSpecRowFromGeneration(specRow, '写真由来のスペック項目の採用を取り消し');
    }
  }

  row.status = 'pending';
  await savePhotoAnalysisStatusChange(a);

  renderCatalogGenerationResult();
  renderCatalogPhotoAnalysisResult();
}

// 管理用一覧からの削除：AI生成行は対象外（photoDerivedでない行は関数レベルで拒否）。
// 対応する写真解析結果側のstatusは、sourceItemが分かればベストエフォートでpendingへ戻す
// （見つからなくてもエラーにしない。旧データ・解析結果未読み込み時にも安全）。
async function deleteCatalogSpecRow(index) {
  const g = App._catalogGeneration;
  if (!g) return;
  const specRow = g.specRows[index];
  if (!specRow || !specRow.photoDerived) return;

  if (!confirm(`「${specRow.item}」を削除しますか？`)) return;

  const ok = await removeSpecRowFromGeneration(specRow, '写真由来のスペック項目を削除');
  if (!ok) console.error('[Spec row delete] 保存に失敗しました');

  const a = App._catalogPhotoAnalysis;
  if (a && specRow.sourceItem) {
    const analysisRow = [...a.confirmedRows, ...a.estimatedRows].find(r => r.item === specRow.sourceItem);
    if (analysisRow && analysisRow.status !== 'pending') {
      analysisRow.status = 'pending';
      await savePhotoAnalysisStatusChange(a);
    }
  }

  App._catalogSpecRowEditIndex = null;
  renderCatalogGenerationResult();
  renderCatalogPhotoAnalysisResult();
}

// インライン編集：写真由来行のitem/valueのみを編集する。sourceItem・sourceType・category・
// confidence・photoDerivedは一切変更しない。
function editCatalogSpecRow(index) {
  const g = App._catalogGeneration;
  if (!g || !g.specRows[index] || !g.specRows[index].photoDerived) return;
  App._catalogSpecRowEditIndex = index;
  renderCatalogGenerationResult();
}

function cancelCatalogSpecRowEdit() {
  App._catalogSpecRowEditIndex = null;
  renderCatalogGenerationResult();
}

async function saveCatalogSpecRowEdit(index) {
  const g = App._catalogGeneration;
  if (!g) return;
  const row = g.specRows[index];
  if (!row || !row.photoDerived) return;

  const itemEl = document.getElementById(`catalog-spec-edit-item-${index}`);
  const valueEl = document.getElementById(`catalog-spec-edit-value-${index}`);
  const newItem = itemEl ? itemEl.value.trim() : '';
  const newValue = valueEl ? valueEl.value.trim() : '';

  if (!newItem || !newValue) {
    alert('項目名・値のいずれも空にはできません。');
    return;
  }
  const isDuplicate = g.specRows.some((r, i) => i !== index && r.item === newItem);
  if (isDuplicate) {
    alert('この項目名は既に使用されています。別の項目名にしてください。');
    return;
  }

  row.item = newItem;
  row.value = newValue;

  g.specHtml = buildCatalogSpecHtml(g.parsed, g.item, g.specRows, g.specId);
  g.htmlIssues = validateCatalogSpecHtml(g.specHtml);
  const ok = await CatalogStore.updateSpecData(g.id, g.specRows, g.specHtml, 'スペック項目を編集');
  if (!ok) console.error('[Spec row edit] 保存に失敗しました');

  App._catalogSpecRowEditIndex = null;
  renderCatalogGenerationResult();
}

function renderCatalogPhotoAnalysisResult() {
  const a = App._catalogPhotoAnalysis;
  const area = document.getElementById('catalog-photo-analysis-result');
  if (!a || !area) return;

  const confidenceColorMap = { '高': 'var(--success)', '中': '#2563eb', '要検証': 'var(--warning)' };
  const badge = (level) => `<span class="idea-plan-badge" style="background:${confidenceColorMap[level] || 'var(--text-muted)'}">${esc(level)}</span>`;

  // sourceType: 'confirmed' | 'estimated' | 'needsVerification'。allowAdoptがfalseの場合は採用ボタンを出さない（要検証項目）。
  // confidence表記はnormalizeCatalogConfidenceDisplay()を通し、管理用一覧と表記を統一する
  // （この画面の行は元々高/中/要検証のみのため実質的には無変換だが、表示ロジックを一箇所に集約するため）。
  const renderActionableRows = (rows, sourceType, allowAdopt) => rows.length
    ? `<ul style="margin:6px 0 6px 20px">${rows.map((r, i) => {
        const base = `${esc(r.item)}：${esc(r.value)} ${badge(normalizeCatalogConfidenceDisplay(r.confidence))}`;
        let actions;
        if (r.status === 'adopted') {
          actions = `<span class="idea-plan-badge" style="background:var(--success)">&#10003; 採用済み</span> <button class="btn" onclick="undoCatalogPhotoAnalysisAdoption('${sourceType}', ${i})">取り消す</button>`;
        } else if (r.status === 'rejected') {
          actions = `<span class="idea-plan-badge" style="background:var(--text-muted)">&#10005; 却下済み</span>`;
        } else {
          actions = (allowAdopt ? `<button class="btn" onclick="adoptCatalogPhotoAnalysisItem('${sourceType}', ${i})">採用</button> ` : '')
            + `<button class="btn" onclick="rejectCatalogPhotoAnalysisItem('${sourceType}', ${i})">却下</button>`;
        }
        return `<li>${base}　${actions}</li>`;
      }).join('')}</ul>`
    : '<p class="idea-plan-note">該当なし</p>';

  const warnings = [];
  if (a.saveFailed) warnings.push('解析結果の保存に失敗しました。画面を離れると今回の結果が失われる可能性があります。');
  if (a.contradictionWarnings.length) warnings.push(`入力情報との矛盾：${a.contradictionWarnings.join('、')}`);
  if (a.privacyWarnings.length) warnings.push(`写り込みに関する注意：${a.privacyWarnings.join('、')}`);
  if (a.failedPhotos.length) warnings.push(`読み込みに失敗した写真：${a.failedPhotos.join('、')}（解析対象から除外されています）`);
  if (a.rejectedCount > 0) warnings.push(`写真だけでは断定できない内容として、${a.rejectedCount}件の項目を除外しました。`);

  const analyzedAtText = a.analyzedAt ? new Date(a.analyzedAt).toLocaleString('ja-JP') : '';
  const noteText = a.isSaved
    ? `前回保存した解析結果を表示しています（解析日時：${analyzedAtText}）。写真を追加・変更した場合は再解析してください。`
    : `解析対象：${a.analyzedPhotoCount}枚（解析日時：${analyzedAtText}）。`;

  area.innerHTML = `
    <div class="ai-result">
      <h4>&#128269; ${a.isSaved ? '保存済みの写真解析結果' : '写真解析結果'}<span class="idea-plan-badge">AI下書き・自動反映なし</span></h4>
      <p class="idea-plan-note">${noteText}この内容は自動反映されません。「採用」を押した項目のみ、スペック表へ個別に反映されます（商品解説・SEOへの反映は今回未対応）。</p>
      ${warnings.length ? `<p class="idea-plan-note" style="color:var(--danger)">${warnings.map(esc).join('<br>')}</p>` : ''}

      <div class="form-group">
        <label>写真から確認できた項目</label>
        ${renderActionableRows(a.confirmedRows, 'confirmed', true)}
      </div>
      <div class="form-group">
        <label>写真から推定した項目</label>
        ${renderActionableRows(a.estimatedRows, 'estimated', true)}
      </div>
      <div class="form-group">
        <label>要検証項目（写真だけでは断定できないため採用できません）</label>
        ${renderActionableRows(a.needsVerificationRows, 'needsVerification', false)}
      </div>
      <div class="form-group">
        <label>写真ごとの観察結果</label>
        ${a.photoObservations.length ? `<ul style="margin:6px 0 6px 20px">${a.photoObservations.map(o => `<li>${esc(o.label)}：${esc(o.observation)}</li>`).join('')}</ul>` : '<p class="idea-plan-note">該当なし</p>'}
      </div>
      ${a.notes.length ? `<div class="form-group"><label>注意事項</label><p class="idea-plan-note">${a.notes.map(esc).join('<br>')}</p></div>` : ''}
    </div>
  `;
}

// 一覧・検索の状態
const CatalogLibrary = {
  list: [],
  filtered: [],
  query: '',
  isComposing: false, // IME変換中フラグ（customer-search-bug-report.mdの方式を踏襲）
  thumbnails: {}, // catalogProductId -> 署名付きURL（取得できなかった商品は未登録のまま＝プレースホルダー表示）
  // 'all' | 'unpublished' | 'google_scheduled' | 'google_published' | 'google_error'。
  // EventLibrary.statusFilter／CorrespondenceLibrary.filterと同じく、このオブジェクト上の
  // 状態としてのみ保持する（localStorageへは永続化しない）。画面遷移中は維持され、F5では
  // 初期値'all'に戻る＝この一覧の既存フィルターと同じ挙動に揃える
  // （catalog-unpublished-highlight-and-filter-report.md参照）。
  publicationFilter: 'all',
  // ソート条件。publicationFilter／queryと同じくこのオブジェクト上の状態としてのみ保持し、
  // localStorageへは永続化しない（F5では初期値'updated_desc'に戻る。既存の状態保持方針と
  // 揃える。catalog-sort-function-report.md参照）。
  sort: 'updated_desc',
  // ブランドフィルター。'all'（すべてのブランド）またはブランド名の完全一致。他の状態と
  // 同じくこのオブジェクト上でのみ保持する（catalog-brand-filter-report.md参照）。
  brand: 'all',
  // 「Google掲載対象」チェックボックスの保存中商品ID集合。DOM要素のdisabled属性だけに頼ると
  // 検索・フィルター変更等による再描画（catalogRenderList()の再実行）でDOMが作り直され、
  // 保存中状態の見た目が失われてしまう（Codexレビュー指摘）。商品ID単位でこのSetに
  // 保持することで、再描画のたびにcatalogRenderList()側がこのSetを見てdisabled／
  // 「保存中…」表示を復元できるようにする（catalog-library-google-target-toggle-report.md参照）。
  pendingGooglePublishIds: new Set(),
};

// フィルタータブの一覧・表示順。「Google掲載済」「Googleエラー」はGoogle Merchant Centerとの
// 実連携（フィード送信・同期）をまだ実装していないため対応する実データが存在せず、現時点では
// 常に0件になる（catalog-google-merchant-center-phase1-report.md参照）。連携実装時に
// catalogApplyFilter()の対応する条件だけを差し替えれば済むよう、タブの枠は今から用意しておく。
const CATALOG_PUBLICATION_FILTER_TABS = [
  ['all', 'すべて'],
  ['unpublished', '未掲載'],
  ['google_scheduled', 'Google掲載予定'],
  ['google_published', 'Google掲載済'],
  ['google_error', 'Googleエラー'],
];

// 不正な値が渡された場合は安全に'updated_desc'へフォールバックする。
function catalogSetSort(value) {
  const isValid = CATALOG_SORT_OPTIONS.some(([v]) => v === value);
  CatalogLibrary.sort = isValid ? value : 'updated_desc';
  catalogApplyFilter();
}

// ブランド選択肢は固定値ではなく商品データから動的に生成されるため、'all'または
// 現時点で実在するブランド名以外が渡された場合は安全に'all'へフォールバックする。
function catalogSetBrand(value) {
  const options = getCatalogBrandOptions(CatalogLibrary.list);
  CatalogLibrary.brand = (value === 'all' || options.includes(value)) ? value : 'all';
  catalogApplyFilter();
}

// 不正な値が渡された場合は安全に'all'へフォールバックする。
function catalogSetPublicationFilter(value) {
  const isValid = CATALOG_PUBLICATION_FILTER_TABS.some(([v]) => v === value);
  CatalogLibrary.publicationFilter = isValid ? value : 'all';
  catalogApplyFilter();
}

// フィルタータブの件数（ボタンのラベルに表示する）。「すべて」を含む全タブで件数を表示する
// （catalog-google-status-badges-and-layout-report.md参照）。判定はmatchesCatalogStatusFilter()の
// 1箇所だけを経由し、ここで判定ロジックを重複実装しない。検索文字列の有無によって値が
// 変動しないよう、常にCatalogLibrary.list（全商品）を対象に数える。
function catalogFilterTabCount(filterValue) {
  if (filterValue === 'all') return CatalogLibrary.list.length;
  return CatalogLibrary.list.filter(c => matchesCatalogStatusFilter(c, filterValue)).length;
}

// フィルター該当0件時のメッセージ。「未掲載」は既存の文言（catalog-unpublished-highlight-and-filter-report.md
// で確認済み）をそのまま維持し、新設したGoogle系フィルターにも同じ組み立て方を適用する。
function catalogPublicationEmptyMessage() {
  const filter = CatalogLibrary.publicationFilter;
  const hasQuery = !!CatalogLibrary.query;
  if (filter === 'all') return '登録された商品はまだありません';
  if (filter === 'unpublished') return hasQuery ? '条件に一致する未掲載商品はありません' : '未掲載の商品はありません';
  const label = (CATALOG_PUBLICATION_FILTER_TABS.find(([v]) => v === filter) || ['', ''])[1];
  return hasQuery ? `条件に一致する${label}の商品はありません` : `${label}の商品はありません`;
}

async function renderCatalogLibrary() {
  document.getElementById('main').innerHTML = '<div class="loading-screen">読み込み中...</div>';
  CatalogLibrary.list = await CatalogStore.list();
  await loadCatalogLibraryThumbnails();
  catalogApplyFilter();
}

// 一覧の各商品のサムネイル（メイン優先・なければsort_order最小の1枚）をまとめて取得する。
// 検索はクライアント側フィルタのみで再取得しないため、ここで一度取得しておけば検索後も画像を維持できる。
async function loadCatalogLibraryThumbnails() {
  CatalogLibrary.thumbnails = {};
  const ids = CatalogLibrary.list.map(c => c.id);
  if (!ids.length) return;
  const pathByProduct = await CatalogPhotoStore.primaryOrFirstPathsForProducts(ids);
  const paths = Object.values(pathByProduct);
  if (!paths.length) return;
  const { data: signedUrls, error } = await sb.storage.from(CATALOG_PHOTO_BUCKET).createSignedUrls(paths, CATALOG_PHOTO_SIGNED_URL_EXPIRY);
  if (error) { console.error('カタログ一覧サムネイルの署名付きURL取得に失敗しました:', error); return; }
  const urlByPath = {};
  (signedUrls || []).forEach((s, i) => { urlByPath[paths[i]] = s.signedUrl || ''; });
  Object.keys(pathByProduct).forEach(pid => {
    const url = urlByPath[pathByProduct[pid]];
    if (url) CatalogLibrary.thumbnails[pid] = url;
  });
}

// 責務を分離する：全商品データ→状態フィルター適用後→検索適用後、の2段階に分ける
// （catalog-google-status-badges-and-layout-report.md参照）。状態フィルターを切り替えても
// 検索文字列は消さない。判定は両方ともmatchesCatalogStatusFilter()／matchesCatalogSearch()の
// 共通関数だけを経由し、ここで判定ロジックを重複実装しない。
// 処理順：1.全商品データ→2.状態フィルター→3.検索→4.ソート→5.描画（catalog-sort-function-report.md参照）。
// フィルタータブ・サマリーの件数はcatalogFilterTabCount()がCatalogLibrary.list（全商品）を
// 直接見るため、ここでの並び替えの影響を受けない。
function catalogApplyFilter() {
  const q = CatalogLibrary.query.normalize('NFKC').toLowerCase();
  const statusFilteredProducts = CatalogLibrary.list.filter(c => matchesCatalogStatusFilter(c, CatalogLibrary.publicationFilter));
  const brandFilteredProducts = statusFilteredProducts.filter(c => matchesCatalogBrand(c, CatalogLibrary.brand));
  const searchedProducts = brandFilteredProducts.filter(c => matchesCatalogSearch(c, q));
  CatalogLibrary.filtered = sortCatalogProducts(searchedProducts, CatalogLibrary.sort);
  catalogRenderList();
}

function catalogOnSearch(val) {
  CatalogLibrary.query = val.trim();
  // IME変換中はcatalogApplyFilter()→catalogRenderList()を走らせない
  // （顧客管理検索の不具合修正パターンをそのまま踏襲。customer-search-fix-report.md参照）。
  if (CatalogLibrary.isComposing) return;
  catalogApplyFilter();
}

function catalogOnCompositionStart() {
  CatalogLibrary.isComposing = true;
}

function catalogOnCompositionEnd(val) {
  CatalogLibrary.isComposing = false;
  catalogOnSearch(val);
}

function catalogRenderList() {

  // （catalog-brand-filter-report.md参照）。
  const brandOptions = getCatalogBrandOptions(CatalogLibrary.list);
  // サマリー・フィルタータブの件数は検索条件に関わらず全商品を対象に数える。
  // catalogFilterTabCount()を1箇所だけ経由して使い回し、判定ロジックを重複させない。
  const unpublishedCount = catalogFilterTabCount('unpublished');

  const summaryParts = [];
  if (unpublishedCount > 0) summaryParts.push(`<span class="idea-plan-badge" style="margin:0">未掲載 ${unpublishedCount}件</span>`);
  if (scheduledCount > 0) summaryParts.push(renderCatalogStatusBadge({ key: 'scheduled', label: `Google掲載予定 ${scheduledCount}件` }));
  const emptyMessage = items.length ? '' : catalogPublicationEmptyMessage();

        </select>

    </div>
    ${items.length ? items.map(c => {

      // 保存中かどうかはDOM（disabled属性）ではなくCatalogLibrary.pendingGooglePublishIds
      // （商品ID単位の状態）で判定する。検索・フィルター変更等でcatalogRenderList()が
      // 再実行されDOMが作り直されても、この再描画時点で保存中のIDは変わらずSetに残っている
      // ため、disabled・「保存中…」表示が正しく復元される（Codexレビュー指摘の修正）。
      const isPending = CatalogLibrary.pendingGooglePublishIds.has(c.id);
      return `

    if (el) {

      const canSelect = el.tagName === 'TEXTAREA' || (el.tagName === 'INPUT' && /^(text|search|tel|url|password)$/.test(el.type));
      if (canSelect && selStart !== null && selEnd !== null) {

  // （customer-search-fix-report.mdで判明した仕様。再描画のたびに要素が作り直されるため毎回登録し直す）。
  const searchInput = document.getElementById('catalog-search');
  if (searchInput) {
    searchInput.addEventListener('compositionstart', catalogOnCompositionStart);
    searchInput.addEventListener('compositionend', () => catalogOnCompositionEnd(searchInput.value));

// 一覧カードの「Google掲載対象」チェックボックス変更。保存中は二重操作を防ぐため
// disabled化＋「保存中…」表示にし、失敗時はチェック状態を元に戻す（要件2・3参照）。
// 成功時はCatalogLibrary.list内の該当商品だけを書き換えてcatalogApplyFilter()を呼び、
// 検索・フィルター・並び順の状態は変えずに一覧・件数・フィルター結果だけを再描画する
// （catalog-library-google-target-toggle-report.md参照）。
async function catalogToggleGooglePublish(id, checkboxEl) {
  // 二重操作防止はDOMのdisabled属性だけに頼らず、CatalogLibrary.pendingGooglePublishIds
  // （商品ID単位の状態）でも判定する。検索・フィルター変更等で保存中にcatalogRenderList()が
  // 再実行されDOM要素が作り直された場合でも、このSetを見て再描画のたびにdisabled状態を
  // 復元するため、disabled属性だけを見るより確実（Codexレビュー指摘の修正）。
  if (CatalogLibrary.pendingGooglePublishIds.has(id)) return;
  const newValue = checkboxEl.checked;

  CatalogLibrary.pendingGooglePublishIds.add(id);
  catalogApplyFilter(); // 保存中（disabled＋「保存中…」）の表示を即座に反映する

  const ok = await CatalogStore.setGooglePublish(id, newValue);

  if (!ok) {
    CatalogLibrary.pendingGooglePublishIds.delete(id);
    catalogApplyFilter(); // チェック状態はCatalogLibrary.list側を変更していないため自動的に元へ戻る
    alert('Google掲載対象の更新に失敗しました。もう一度お試しください。');
    return;
  }

  // 【設計メモ・単一ユーザー前提】googlePublishだけを書き換えるのではなく、保存成功後に
  // CatalogStore.find(id)でDBから対象商品を再取得してCatalogLibrary.listへ丸ごと反映する。
  // これによりupdated_at・edit_history・将来追加される項目も含めて実際の保存結果と
  // 一覧の表示内容が必ず一致する（Codexレビュー指摘の修正）。現状はアプリ全体が単一ユーザー
  // 運用前提のため、この再取得とサーバー側の保存タイミングの間に他の変更が割り込む
  // レースコンディション（edit_historyの競合等）は考慮していない。複数ユーザー・同時編集に
  // 対応する場合は、setGooglePublish自体をRPC化し、更新後の行を1回のDB往復で
  // 返す設計に変更するのが望ましい（将来対応。catalog-library-google-target-toggle-report.md参照）。
  const fresh = await CatalogStore.find(id);
  CatalogLibrary.pendingGooglePublishIds.delete(id);
  if (fresh) {
    const idx = (CatalogLibrary.list || []).findIndex(c => c.id === id);
    if (idx !== -1) CatalogLibrary.list[idx] = fresh;
  }
  catalogApplyFilter();
}

// 削除（確認ダイアログ必須。report-editorial-library-delete.mdと同じパターン）
async function deleteCatalogProduct(id) {
  if (!confirm('この商品をカタログから削除しますか?（この操作は取り消せません）')) return;
  const ok = await CatalogStore.remove(id);
  if (!ok) { alert('削除に失敗しました。'); return; }
  await renderCatalogLibrary();
}

async function setCatalogProductRating(id, rating) {
  const ok = await CatalogStore.updateRating(id, rating);
  if (!ok) { alert('評価の更新に失敗しました。'); return; }
  // edit_historyに追記された最新状態を反映するため、キャッシュを部分パッチせず再取得する
  const fresh = await CatalogStore.find(id);
  const idx = (CatalogLibrary.list || []).findIndex(c => c.id === id);
  if (fresh && idx !== -1) CatalogLibrary.list[idx] = fresh;
  closeModal();
  await showCatalogProductDetail(id);
}

function buildCatalogGenerationStateFromSaved(item) {

    item,
    parsed: {
      primaryColor: item.primaryColor || '',
      colorConfidence: item.primaryColor ? 'confirmed' : 'unavailable',

async function saveCatalogProduct(editId) {
  const getVal = (id) => document.getElementById(id).value.trim();
  const brand = getVal('catalog-in-brand');
  const productName = getVal('catalog-in-product-name');
  const category = getVal('catalog-in-category');
  if (!brand) return alert('ブランド名を入力してください');
  if (!productName) return alert('商品名を入力してください');
  if (!category) return alert('カテゴリーを選択してください');

  const linkValues = {
    catalogUrl: getVal('catalog-in-catalog-url'),
    referenceUrl: getVal('catalog-in-reference-url'),
    relatedBlogUrl: getVal('catalog-in-related-blog-url'),
  };
  // Google Merchant画像URLは既存の関連リンク（WEBカタログ/参考ページ/関連Blog）とは別扱い：
  // CSV出力時の除外理由表示（未設定／不正）を分けるため保存自体はブロックしない
  // （catalog-merchant-image-url-report.md参照。実アクセス確認も今回は行わない）。
  const merchantImageUrl = getVal('catalog-in-merchant-image-url');
  const { catalogUrl, referenceUrl, relatedBlogUrl } = linkValues;
  const invalidLinkLabels = CATALOG_LINK_FIELDS
    .filter(f => linkValues[f.key] && !isValidCatalogLinkUrl(linkValues[f.key]))
    .map(f => f.label);
  if (invalidLinkLabels.length) {
    return alert(`次の項目のURLが不正です（httpまたはhttpsで始まるURLのみ使用できます）：${invalidLinkLabels.join('、')}`);
  }

  // 販売価格（税込）：任意項目。入力がある場合のみ0以上の整数であることを検証する
  // （小数・負数・数値以外は保存前にブロックする。catalog-google-merchant-center-phase1-report.md参照）。
  const priceRaw = getVal('catalog-in-price-jpy');
  let priceJpy = null;
  if (priceRaw) {
    if (!/^\d+$/.test(priceRaw)) return alert('販売価格（税込）は0以上の整数で入力してください');
    priceJpy = parseInt(priceRaw, 10);
  }
  const googlePublish = document.getElementById('catalog-in-google-publish').checked;
  // Google Merchant Center対応強化：color/condition/google_product_category
  // （catalog-google-merchant-attributes-report.md参照）。conditionは<select>のため
  // 常に3値のいずれかが入るが、念のため空になった場合は'new'にフォールバックする。
  const color = getVal('catalog-in-color');
  const condition = getVal('catalog-in-condition') || 'new';
  const googleProductCategory = getVal('catalog-in-google-category') || '187';
  // 在庫状況（Google Merchant用）：google_publish（Google掲載対象トグル）とは別概念のため
  // 独立したフィールドとして扱う（catalog-google-merchant-availability-report.md参照）。
  // <select>のため常に4値のいずれかが入るが、念のため空の場合は'in_stock'にフォールバックする。
  const availability = getVal('catalog-in-availability') || 'in_stock';

  const item = {
    brand,
    productName,
    modelNumber: getVal('catalog-in-model-number'),
    category,
    knownSpecs: getVal('catalog-in-known-specs'),
    supplementaryInfo: getVal('catalog-in-supplementary-info'),
    referenceUrls: getVal('catalog-in-reference-urls'),
    researchNotesInput: getVal('catalog-in-research-notes'),
    chatgptResearchResult: getVal('catalog-in-chatgpt-research'),
    catalogUrl,
    referenceUrl,
    relatedBlogUrl,
    merchantImageUrl,
    color,
    condition,
    googleProductCategory,
    availability,
    priceJpy,
    googlePublish,
  };

  const btn = document.getElementById('catalog-save-btn');
  const resultArea = document.getElementById('catalog-save-result');
  if (btn.disabled) return; // 二重クリック対策
  const pendingPhotos = !editId ? App._catalogPendingPhotos.slice() : [];
  btn.disabled = true;
  btn.textContent = pendingPhotos.length ? '商品と写真を保存中...' : '保存中...';

  const saved = editId ? await CatalogStore.update(editId, item) : await CatalogStore.add(item);

  if (!saved) {
    // 商品保存に失敗した場合、写真アップロードは開始しない。入力内容・一時写真はそのまま保持する。
    btn.disabled = false;
    btn.textContent = '保存する';
    resultArea.innerHTML = `<p class="idea-plan-note" style="color:var(--danger)">保存に失敗しました。もう一度お試しください。</p>`;
    return;
  }

  if (editId) {
    btn.disabled = false;
    btn.textContent = '保存する';
    resultArea.innerHTML = `<p class="idea-plan-note" style="color:var(--success)">更新しました。</p>`;
    return;
  }

  // 新規登録：商品保存成功後、一時写真を選択順（0,1,2...）にStorage・catalog_product_photosへ保存する。
  // 1枚目を自動的にメイン画像にする。写真が0枚の場合は従来どおり商品だけの登録で完了する。
  const newProductId = saved.id;
  const failedFileNames = [];
  for (let i = 0; i < pendingPhotos.length; i++) {
    try {
      await uploadProcessedCatalogPhoto(newProductId, pendingPhotos[i].processed, i, i === 0);
    } catch (e) {
      console.error(e);
      failedFileNames.push(pendingPhotos[i].processed.fileName);
    }
  }
  resetCatalogPendingPhotos();

  btn.disabled = false;
  btn.textContent = '保存する';

  // 商品自体は削除しない。成功した写真は残したまま、失敗した写真名を明示した上で編集画面へ移動する。
  if (failedFileNames.length) {
    alert(`商品は保存されましたが、一部の写真登録に失敗しました（${failedFileNames.join('、')}）。編集画面から再度追加してください。`);
  }
  // 写真が1枚以上正常に保存された場合のみ、次のステップの導線（「次にやること」カード）を1回表示する
  App._catalogJustRegisteredId = (pendingPhotos.length - failedFileNames.length) > 0 ? newProductId : null;
  renderCatalogInputForm(newProductId);
}

// マーカー方式の出力設計（catalog-production-phase2-readiness.md 3節）。
// 既存のUNIFIED_PROMPT_MARKERS/parseUnifiedPromptSections()とは完全に独立させる。
const CATALOG_PROMPT_MARKERS = [
  ['primaryColor', '===PRIMARY_COLOR==='],
  ['colorConfidence', '===COLOR_CONFIDENCE==='],
  ['headerSubtext', '===HEADER_SUBTEXT==='],
  ['badgesRaw', '===BADGES==='],
  ['chipsRaw', '===CHIPS==='],
  ['materialType', '===MATERIAL_TYPE==='],
  ['individualDifferenceNoteNeeded', '===INDIVIDUAL_DIFFERENCE_NOTE_NEEDED==='],
  ['specRowsRaw', '===SPEC_ROWS==='],
  ['unconfirmedItemsRaw', '===UNCONFIRMED_ITEMS==='],
  ['description1Title', '===DESCRIPTION_1_TITLE==='],
  ['description1Body', '===DESCRIPTION_1_BODY==='],
  ['description2Title', '===DESCRIPTION_2_TITLE==='],
  ['description2Body', '===DESCRIPTION_2_BODY==='],
  ['description3Title', '===DESCRIPTION_3_TITLE==='],
  ['description3Body', '===DESCRIPTION_3_BODY==='],
  ['seoTitle', '===SEO_TITLE==='],
  ['seoDescription', '===SEO_DESCRIPTION==='],
  ['keywordsRaw', '===KEYWORDS==='],
  ['researchNotes', '===RESEARCH_NOTES==='],
  ['informationSources', '===INFORMATION_SOURCES==='],
  ['confidenceNotes', '===CONFIDENCE_NOTES==='],
];
const CATALOG_PROMPT_END_MARKER = '===END===';

function parseCatalogGenerationSections(text) {
  const plan = {};
  for (let i = 0; i < CATALOG_PROMPT_MARKERS.length; i++) {
    const [key, marker] = CATALOG_PROMPT_MARKERS[i];
    const nextMarker = i + 1 < CATALOG_PROMPT_MARKERS.length
      ? CATALOG_PROMPT_MARKERS[i + 1][1]
      : CATALOG_PROMPT_END_MARKER;
    const start = text.indexOf(marker);
    if (start === -1) continue;
    const contentStart = start + marker.length;
    const endIdx = text.indexOf(nextMarker, contentStart);
    const raw = endIdx === -1 ? text.slice(contentStart) : text.slice(contentStart, endIdx);
    plan[key] = raw.trim();
  }
  if (Object.keys(plan).length === 0) {
    throw new Error('項目の区切りマーカーが見つかりません');
  }
  return plan;
}

function buildCatalogGenerationPrompt(item) {
  const candidates = CATALOG_SPEC_CANDIDATES[item.category];
  const candidateSection = candidates
    ? `このカテゴリー（${item.category}）で候補となる項目は以下です。候補にない項目でも、入力情報から確認できるものは追加できます。\n${candidates.map(c => `・${c}`).join('\n')}`
    : `カテゴリー「${item.category}」について、商品の説明に必要な項目を判断してください。`;

  return `あなたは「シューズサロンなとりや」の商品カタログ制作担当です。
以下の入力情報のみを根拠に、WEBカタログ用の原稿一式を作成してください。

【最重要の安全ルール】
- 入力情報に書かれていない仕様を、一般知識や推測で補完してはいけません。
- 確認できない項目・曖昧な項目は、スペック表（SPEC_ROWS）に一切含めないでください。該当する項目名はUNCONFIRMED_ITEMSに列挙してください。
- 確認区分（SPEC_ROWSの3列目）は「店舗提供情報」のみを使用してください。写真や外部サイトを実際に参照した事実は今回ないため、「写真から確認」「外部調査で確認」という区分は絶対に使用しないでください。
- 価格・税込・税抜・販売価格等は一切出力しないでください。
- ブランド名・商品名そのものをスペック表の項目値にしないでください（見出しに既に表示されるため重複させない）。
- 「定番」「人気」「代表的」「歴史がある」「評価が高い」等、入力情報に明記されていない一般的な評価・人気・歴史に関する表現を断定的に使わないでください。これらの表現は、入力情報（既知スペック・補足情報・調査時の注意事項）に明記されている場合のみ使用してよいものとします。

【情報の優先順位】
入力情報の間に食い違いがある場合は、以下の優先順位で判断してください。
1. ChatGPT調査結果・確定情報（人間が確認・貼り付けた確定情報として最優先する）
2. 商品基本情報の手動入力（既知スペック・補足情報・参考URL・調査時の注意事項）
3. その他、入力情報に明記されている内容
上位の情報と矛盾する内容は使用しないでください。

【ChatGPT調査結果の扱い】
- ChatGPT調査結果・確定情報は、人間が確認・貼り付けた確定情報として最優先してください。
- 写真だけでは確定できない素材名・木型名・製法名・ソール名を、推測で断定しないでください。
- 確認できない情報を創作しないでください。不明点は不明のまま扱ってください。
- 商品解説では、確定情報と写真から確認できる特徴を自然に統合してください。
- ChatGPT調査結果の文章をそのまま複製せず、商品ページ用の文章へ再構成してください。

【入力情報】
ChatGPT調査結果・確定情報（最優先の確定情報）:
---
${item.chatgptResearchResult || '（入力なし）'}
---
ブランド名: ${item.brand}
商品名: ${item.productName}
品番: ${item.modelNumber || '（未入力）'}
カテゴリー: ${item.category}
既知スペック:

---
${item.referenceUrls || '（入力なし）'}
---
調査時の注意事項:

${candidateSection}

【主要色の判断】
入力情報（カラーの記載等）から商品の主要色を判断できる場合は、色名とhexコードを併記してください（例：ダークブラウン（#4a2c1d））。判断できない場合はCOLOR_CONFIDENCEをunavailableにしてください。

【天然素材注釈の判断】
カテゴリーや素材の記載から、主要素材が革と確認できる場合はnatural_leather、それ以外の天然素材（綿・ウール等）と確認できる場合はnatural_material、判断できない場合はnoneとしてください。

【出力形式】
以下のマーカー形式で、指定した順番通りに出力してください。マーカー自体は改変しないでください。

===PRIMARY_COLOR===

===MATERIAL_TYPE===

// ── 色の扱い：AIは主要色1つのみ判断し、テンプレートが必要とする7色はコード側で導出する ──
const CATALOG_NEUTRAL_PALETTE = {
  accent: '#6b7280',
  badgeText: '#ffffff',
  headerBg: '#f3f4f6',
  chipBg: '#f3f4f6',
  chipBorder: '#d1d5db',
  chipText: '#4b5563',
  subText: '#6b7280',
};

function extractHexColor(text) {
  const m = (text || '').match(/#[0-9a-fA-F]{6}/);
  return m ? m[0] : null;
}

function hexToHsl(hex) {
  const r = parseInt(hex.slice(1, 3), 16) / 255;
  const g = parseInt(hex.slice(3, 5), 16) / 255;
  const b = parseInt(hex.slice(5, 7), 16) / 255;
  const max = Math.max(r, g, b), min = Math.min(r, g, b);
  let h = 0, s = 0;
  const l = (max + min) / 2;
  if (max !== min) {
    const d = max - min;
    s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
    switch (max) {
      case r: h = (g - b) / d + (g < b ? 6 : 0); break;
      case g: h = (b - r) / d + 2; break;
      case b: h = (r - g) / d + 4; break;
    }
    h /= 6;
  }
  return [h * 360, s * 100, l * 100];
}

function hslToHex(h, s, l) {
  s /= 100; l /= 100;
  const k = n => (n + h / 30) % 12;
  const a = s * Math.min(l, 1 - l);
  const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
  const toHex = x => Math.round(255 * x).toString(16).padStart(2, '0');
  return `#${toHex(f(0))}${toHex(f(8))}${toHex(f(4))}`;
}

function relativeLuminance(hex) {
  const c = [1, 3, 5].map(i => {
    const v = parseInt(hex.slice(i, i + 2), 16) / 255;
    return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4);
  });
  return 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
}

function deriveCatalogColorPalette(baseHex) {
  if (!baseHex || !/^#[0-9a-fA-F]{6}$/.test(baseHex)) {
    return { ...CATALOG_NEUTRAL_PALETTE };
  }
  const [h, s] = hexToHsl(baseHex);
  const accent = hslToHex(h, Math.max(s, 35), 34);
  const headerBg = hslToHex(h, Math.min(s, 40), 94);
  const chipBg = hslToHex(h, Math.min(s, 35), 95);
  const chipBorder = hslToHex(h, Math.min(s, 40), 80);
  const chipText = hslToHex(h, Math.max(s, 30), 30);
  const subText = hslToHex(h, Math.max(s * 0.6, 15), 40);
  const badgeText = relativeLuminance(accent) > 0.4 ? '#222222' : '#ffffff';
  return { accent, badgeText, headerBg, chipBg, chipBorder, chipText, subText };
}

// spec_id：ブランド名・品番・商品名から安全な英数字・ハイフンのみのIDを生成する
function slugifyForSpecId(brand, modelNumber, productName) {
  const base = [brand, modelNumber, productName].filter(Boolean).join('-');
  let slug = base
    .normalize('NFKC')
    .toLowerCase()
    .replace(/[^a-z0-9\-]+/g, '-')
    .replace(/-+/g, '-')
    .replace(/^-|-$/g, '');
  if (!slug || slug.length < 3) {
    const randomSuffix = (window.crypto && crypto.randomUUID ? crypto.randomUUID() : String(Math.random())).replace(/-/g, '').slice(0, 8);
    slug = slug ? `${slug}-${randomSuffix}` : `item-${randomSuffix}`;
  }
  return `${slug}-spec`;
}

function parseCatalogListLines(raw, ignoreValues) {
  const ignore = ignoreValues || ['なし'];
  return (raw || '').split('\n').map(l => l.trim()).filter(l => l && !ignore.includes(l));
}

// Phase2固有の安全制約：確認区分は「店舗提供情報」のみを許可する。それ以外（写真から確認／
// 外部調査で確認／その他の値）は無効な行として除外する。未確認・曖昧な文言や価格情報、
// ブランド名・商品名そのものを値にした行も同様に除外する（catalog-production-phase2-readiness.md 7節）。
const CATALOG_ALLOWED_SPEC_CATEGORY = '店舗提供情報';
const CATALOG_PRICE_PATTERN = /円|¥|価格|税込|税抜/;
const CATALOG_UNCONFIRMED_TEXT_PATTERN = /未確認|不明|確認中|確認できない/;

function parseCatalogSpecRows(specRowsRaw, brand, productName) {
  const lines = (specRowsRaw || '').split('\n').map(l => l.trim()).filter(Boolean);
  const rows = [];
  let rejectedCount = 0;
  for (const line of lines) {
    const parts = line.split('|').map(p => p.trim());
    if (parts.length < 3) { rejectedCount++; continue; }
    const [itemName, value, category] = parts;
    if (!itemName || !value) { rejectedCount++; continue; }
    if (category !== CATALOG_ALLOWED_SPEC_CATEGORY) { rejectedCount++; continue; }
    if (CATALOG_UNCONFIRMED_TEXT_PATTERN.test(value)) { rejectedCount++; continue; }
    if (CATALOG_PRICE_PATTERN.test(value) || CATALOG_PRICE_PATTERN.test(itemName)) { rejectedCount++; continue; }
    if (brand && (value.includes(brand) || itemName.includes(brand))) { rejectedCount++; continue; }
    if (productName && (value.includes(productName) || itemName.includes(productName))) { rejectedCount++; continue; }
    rows.push({ item: itemName, value, category, confidence: 'high', status: 'unreviewed' });
  }
  return { rows, rejectedCount };
}

function validateCatalogKeywords(keywordsRaw) {
  const list = [...new Set((keywordsRaw || '').split(',').map(k => k.trim()).filter(Boolean))];
  return { list, count: list.length, isValid: list.length === 18 };
}

// SEOタイトル：45文字を超える場合は保存不可（自動切り捨ては行わない）
function validateCatalogSeoTitle(text) {
  const length = (text || '').length;
  return { ok: length <= 45, length, max: 45 };
}

// ディスクリプション：75〜85文字を推奨。85文字超過は保存不可、75文字未満は警告のみ（保存は可能）
function validateCatalogSeoDescription(text) {
  const length = (text || '').length;
  if (length > 85) return { level: 'error', ok: false, length, message: '上限（85文字）を超えています。保存前に修正してください。' };
  if (length < 75) return { level: 'warning', ok: true, length, message: '推奨文字数（75〜85文字）に達していません。' };
  return { level: 'ok', ok: true, length, message: '' };
}

// ディスクリプション欄の文字数表示を、3段階（警告色）で常時更新する
function updateCatalogDescriptionCount(inputId, counterId) {
  const el = document.getElementById(inputId);
  const counter = document.getElementById(counterId);
  if (!el || !counter) return;
  const check = validateCatalogSeoDescription(el.value);
  const colorMap = { error: 'var(--danger)', warning: 'var(--warning)', ok: 'var(--text-muted)' };
  counter.textContent = `${check.length}/85文字（推奨75〜85）`;
  counter.style.color = colorMap[check.level];
}

// 入力情報にない一般知識（定番・人気等）の抑制：単純な文字列一致による簡易検出のため、
// 警告表示のみで保存はブロックしない（完全な検証ではなく、人間による確認を促す保険）。
const CATALOG_RISK_PHRASES = ['定番', '人気', '代表的', '歴史', '伝統', 'ロングセラー', '名品', '評価が高い', '愛用', '実績', '信頼', '最高峰', '世界的'];

function detectUngroundedClaims(item, generatedFields) {
  const inputText = [item.brand, item.productName, item.modelNumber, item.knownSpecs, item.supplementaryInfo, item.researchNotesInput]
    .filter(Boolean).join('\n');
  const findings = [];
  for (const [fieldLabel, text] of Object.entries(generatedFields)) {
    for (const phrase of CATALOG_RISK_PHRASES) {
      if ((text || '').includes(phrase) && !inputText.includes(phrase)) {
        findings.push({ field: fieldLabel, phrase });
      }
    }
  }
  return findings;
}

// 部分再生成レスポンス専用パーサー
// parseCatalogGenerationSections()は全21マーカーの並び順を前提に「次のマーカーまで」を切り出すため、
// 一部項目のみを含む部分再生成レスポンスには使えない。対象フィールドのmarkers配列内での前後関係だけを
// 境界として使うことで、部分レスポンスでも正しく切り出せるようにしている。
function parseCatalogFieldRegenerationResponse(text, targetField) {
  const { markers } = CATALOG_FIELD_REGENERATION_CONFIG[targetField];
  const result = {};
  for (let i = 0; i < markers.length; i++) {
    const marker = markers[i];
    const start = text.indexOf(marker);
    if (start === -1) continue;
    const contentStart = start + marker.length;
    const endMarker = markers[i + 1] || CATALOG_PROMPT_END_MARKER;
    const endIdx = text.indexOf(endMarker, contentStart);
    result[marker] = (endIdx === -1 ? text.slice(contentStart) : text.slice(contentStart, endIdx)).trim();
  }
  return result;
}

// 再生成前に、他フィールドへの手入力内容をg.parsedへ同期する
// (再生成後にrenderCatalogGenerationResult()で全体を再描画するため、同期しないと他フィールドの手入力が消えてしまう)
function syncCatalogGenerationStateFromDom(g) {
  Object.entries(CATALOG_EDITABLE_FIELD_DOM_MAP).forEach(([key, domId]) => {
    const el = document.getElementById(domId);
    if (el) g.parsed[key] = el.value;
  });
}

async function regenerateCatalogField(targetField, evt) {
  const g = App._catalogGeneration;
  const config = CATALOG_FIELD_REGENERATION_CONFIG[targetField];
  if (!g || !config) return;

  const editKey = CATALOG_FIELD_REGEN_TO_EDIT_KEY[targetField];
  const isManuallyEdited = !!(g.manualEditFlags && g.manualEditFlags[editKey]);
  const confirmMsg = isManuallyEdited
    ? `${config.label}は手動編集済みです。再生成すると編集内容は上書きされます。よろしいですか？`
    : `${config.label}を再生成します。この項目の現在の内容は上書きされます。よろしいですか？`;
  if (!confirm(confirmMsg)) return;

  const item = await CatalogStore.find(g.id);
  if (!item) { alert('商品が見つかりませんでした。'); return; }

  syncCatalogGenerationStateFromDom(g);

  const btn = evt ? evt.target : null;
  const originalLabel = btn ? btn.textContent : '';
  if (btn) { btn.disabled = true; btn.textContent = '再生成中...'; }

  let raw;
  try {
    raw = await callClaude(buildCatalogFieldRegenerationPrompt(item, targetField, g.parsed), 2000);
  } catch (e) {
    if (btn) { btn.disabled = false; btn.textContent = originalLabel; }
    alert(`再生成に失敗しました。${e.message}`);
    return;
  }

  const fields = parseCatalogFieldRegenerationResponse(raw, targetField);
  if (Object.keys(fields).length === 0) {
    if (btn) { btn.disabled = false; btn.textContent = originalLabel; }
    alert('再生成結果をうまく解析できませんでした。もう一度お試しください。');
    return;
  }

  config.parsedKeys.forEach((key, i) => {
    const marker = config.markers[i];
    if (fields[marker] !== undefined) g.parsed[key] = fields[marker];
  });

  // 対象項目は新しいAI出力になったため、手動編集フラグを解除する
  if (editKey && g.manualEditFlags) g.manualEditFlags[editKey] = false;

  renderCatalogGenerationResult();
}

// 固定テンプレートへプレースホルダーを機械的に差し込む（AIにはHTML自体を生成させない）
function renderCatalogTemplateString(template, valuesMap) {
  let html = template;
  for (const [key, value] of Object.entries(valuesMap)) {
    html = html.split(`{{${key}}}`).join(value);
  }
  return html;
}

function buildCatalogFootnotes(parsed) {
  const notes = [];
  if (parsed.materialType === 'natural_leather' && parsed.individualDifferenceNoteNeeded !== 'no') {
    notes.push('※天然革の風合いを活かすため、色調、シボ、柄、風合いの出方には個体差があります。');
  } else if (parsed.materialType === 'natural_material' && parsed.individualDifferenceNoteNeeded !== 'no') {
    notes.push('※天然素材の風合いを活かすため、色調や風合いの出方には個体差があります。');
  }
  notes.push('※閲覧環境や撮影条件により、掲載写真と実際の商品では色味が異なって見える場合があります。');
  notes.push('※メーカー都合により、素材、仕様、付属品等が予告なく変更される場合があります。');
  return notes.map(n => `<span>${esc(n)}</span>`).join('');
}

function buildCatalogSpecHtml(parsed, item, specRows, specId) {
  const hex = parsed.colorConfidence === 'unavailable' ? null : extractHexColor(parsed.primaryColor);
  const palette = deriveCatalogColorPalette(hex);

  const badges = parseCatalogListLines(parsed.badgesRaw).map(b => `<span class="badge">${esc(b)}</span>`).join('');
  const chips = parseCatalogListLines(parsed.chipsRaw).map(c => `<span class="chip">${esc(c)}</span>`).join('');
  const specRowsHtml = specRows.map(r => `<tr><th>${esc(r.item)}</th><td>${esc(r.value)}</td></tr>`).join('');
  const headerSubtext = parsed.headerSubtext && parsed.headerSubtext !== 'なし' ? parsed.headerSubtext : '';

  const html = renderCatalogTemplateString(CATALOG_SPEC_TEMPLATE_V1, {
    SPEC_ID: specId,
    HEADER_BG_COLOR: palette.headerBg,
    ACCENT_COLOR: palette.accent,
    BADGE_TEXT_COLOR: palette.badgeText,
    CHIP_BG_COLOR: palette.chipBg,
    CHIP_BORDER_COLOR: palette.chipBorder,
    CHIP_TEXT_COLOR: palette.chipText,
    SUB_TEXT_COLOR: palette.subText,
    BRAND_NAME: esc(item.brand),
    PRODUCT_NAME: esc(item.productName),
    HEADER_SUBTEXT: esc(headerSubtext),
    BADGES_AND_CHIPS: badges + chips,
    CONFIRMED_SPEC_ROWS: specRowsHtml,
    FOOTNOTES: buildCatalogFootnotes(parsed),
  });

  // HTMLは必ず一行、というテンプレート要件を構造的に保証するための最終防御
  return html.replace(/\r?\n/g, '');
}

function validateCatalogSpecHtml(html) {
  const issues = [];
  if (/[\r\n]/.test(html)) issues.push('HTMLに改行が含まれています');
  // CSS内の隣接する閉じ括弧（例：メディアクエリ末尾の "}}"）を誤検知しないよう、
  // 実際のプレースホルダー形式（{{英大文字とアンダースコア}}）だけを対象にする
  if (/\{\{[A-Z_]+\}\}/.test(html)) issues.push('未置換のプレースホルダーが残っています');
  if (!html.startsWith('<div id="')) issues.push('HTMLの先頭が想定と異なります');
  if (!html.endsWith('</div>')) issues.push('HTMLの末尾が想定と異なります');
  return issues;
}

// 生成本体：入力済みの商品情報のみをClaudeへ送る（写真・Web調査は使用しない）
async function generateCatalogSpec(id) {
  const item = await CatalogStore.find(id);
  if (!item) { alert('商品が見つかりませんでした。'); return; }
  if (!item.brand || !item.productName || !item.category) {
    alert('ブランド名・商品名・カテゴリーが未入力です。先に保存してください。');
    return;
  }

  // 手動編集フラグ：セッション内に既存の生成結果があればそれを、なければ画面読み込み時にDBから
  // 復元済みのフラグ（item.manuallyEditedFields）を使う。既存の下書きがある場合のみ確認する
  // （初回生成では上書きされるものが何もないため確認不要）。
  const existingFlags = (App._catalogGeneration && App._catalogGeneration.manualEditFlags) || item.manuallyEditedFields || {};
  const hasExistingDraft = !!(App._catalogGeneration || item.specHtml);
  const editedFieldKeys = Object.keys(CATALOG_EDITABLE_FIELD_LABELS).filter(k => existingFlags[k]);

  // 写真解析結果から採用済みのスペック行（photoDerived: true）は、manual-edit-protectionと同様に
  // フル再生成でも上書きしない（catalog-production-photo-analysis-adoption-implementation-report.md参照）。
  const existingSpecRows = (App._catalogGeneration && App._catalogGeneration.specRows) || item.specData || [];
  const protectedPhotoRows = existingSpecRows.filter(r => r.photoDerived);
  const protectedPhotoItemNames = protectedPhotoRows.map(r => r.item);

  if (hasExistingDraft) {
    const preservedParts = [];
    if (editedFieldKeys.length) preservedParts.push(`手動編集済みの項目（${editedFieldKeys.map(k => CATALOG_EDITABLE_FIELD_LABELS[k]).join('、')}）`);
    if (protectedPhotoItemNames.length) preservedParts.push(`写真から採用済みのスペック項目（${protectedPhotoItemNames.join('、')}）`);
    const confirmMsg = preservedParts.length
      ? `商品情報をもとにカタログ原稿を再生成します。次の内容は上書きされません：${preservedParts.join('、')}。続行しますか？`
      : '商品情報をもとにカタログ原稿を再生成します。既存の内容は上書きされます。よろしいですか？';
    if (!confirm(confirmMsg)) return;
  }

  // 手動編集済みフィールドの現在の値は、下の「生成中...」表示でDOMが上書きされる前に読み取っておく
  // （読み取りを後回しにすると、対象のtextarea自体がloading表示に置き換わって消えてしまうため）。
  const preservedFieldValues = {};
  editedFieldKeys.forEach((key) => {
    const el = document.getElementById(CATALOG_EDITABLE_FIELD_DOM_MAP[key]);
    if (el) preservedFieldValues[key] = el.value;
  });

  const btn = document.getElementById('catalog-generate-btn');
  const resultArea = document.getElementById('catalog-generate-result');
  btn.disabled = true;
  btn.textContent = '生成中...';
  resultArea.innerHTML = '<div class="ai-result"><div class="loading">カタログ原稿を生成しています...</div></div>';

  let raw;
  try {
    raw = await callClaude(buildCatalogGenerationPrompt(item), 12000);
  } catch (e) {
    btn.disabled = false;
    btn.textContent = '\u{1F50D} カタログ原稿を生成';
    resultArea.innerHTML = `<div class="ai-result" style="border-color:var(--danger)">生成に失敗しました。${esc(e.message)}</div>`;
    return;
  }

  let parsed;
  try {
    parsed = parseCatalogGenerationSections(raw);
  } catch (e) {
    console.error('カタログ生成結果の解析に失敗しました。AIの生レスポンス:');
    console.error(raw);
    btn.disabled = false;
    btn.textContent = '\u{1F50D} カタログ原稿を生成';
    resultArea.innerHTML = `<div class="ai-result" style="border-color:var(--danger)">生成結果をうまく解析できませんでした。もう一度お試しください。</div>`;
    return;
  }

  // 手動編集済みのフィールドは、新しいAI出力で上書きせず、事前に読み取っておいた値を保持する。
  Object.entries(preservedFieldValues).forEach(([key, value]) => {
    parsed[key] = value;
  });

  const { rows: aiSpecRows, rejectedCount } = parseCatalogSpecRows(parsed.specRowsRaw, item.brand, item.productName);
  // 写真由来の採用済み行を優先して保持し、同一項目名のAI生成行は追加しない（重複行を作らない）。
  const specRows = [
    ...protectedPhotoRows,
    ...aiSpecRows.filter(r => !protectedPhotoItemNames.includes(r.item)),
  ];
  const unconfirmedItems = parseCatalogListLines(parsed.unconfirmedItemsRaw, ['特になし']);
  const badgeList = parseCatalogListLines(parsed.badgesRaw);
  const chipList = parseCatalogListLines(parsed.chipsRaw);
  const specId = slugifyForSpecId(item.brand, item.modelNumber, item.productName);
  const specHtml = buildCatalogSpecHtml(parsed, item, specRows, specId);
  const htmlIssues = validateCatalogSpecHtml(specHtml);
  if (htmlIssues.length) console.error('カタログHTMLの検証で問題が見つかりました:', htmlIssues);
  const keywordCheck = validateCatalogKeywords(parsed.keywordsRaw);

  App._catalogGeneration = {
    id, item, parsed, specRows, rejectedCount, unconfirmedItems,
    badgeList, chipList, specId, specHtml, htmlIssues, keywordCheck,
    manualEditFlags: { ...existingFlags },
  };

  btn.disabled = false;
  btn.textContent = '\u{1F50D} カタログ原稿を生成';
  renderCatalogGenerationResult();
}

// スペック項目一覧（管理用）：spec_dataの各行を項目名・値・confidence・写真由来バッジ付きで表示する、
// 完全に読み取り専用の管理者向け一覧。buildCatalogSpecHtml()・顧客向けspec_htmlには一切関与しない
// 独立した表示経路（catalog-production-photo-derived-spec-display-implementation-report.md参照）。
// photoDerived/confidenceが存在しない行（既存データ）も、通常行としてそのまま表示できる。
// confidence表記の正規化（表示専用）。DB保存値・既存jsonbデータは一切変更しない。
// AI生成行（high/medium/low、parseCatalogSpecRows()が設定）と写真由来行（高/中/要検証、
// parseCatalogPhotoAnalysisRows()が設定）の表記ゆれを、管理画面の表示上でのみ統一する
// （catalog-production-photo-derived-spec-display-implementation-report.md参照）。
const CATALOG_CONFIDENCE_DISPLAY_MAP = {
  high: '高', '高': '高',
  medium: '中', '中': '中',
  low: '要検証', '要検証': '要検証',
};
function normalizeCatalogConfidenceDisplay(confidence) {
  if (!confidence) return '未設定';
  return CATALOG_CONFIDENCE_DISPLAY_MAP[confidence] || confidence; // 未知の値はそのまま表示する
}

// editable=trueの場合のみ、photoDerived行に編集・削除ボタンを表示する（AI生成行には常に出さない）。
// 書庫詳細モーダルはeditable=false（省略可）で呼び出し、常に読み取り専用にする。
// editingIndexが渡された行はインライン編集フォームで表示する（編集画面のみで使用）。
function renderCatalogSpecRowsAdminList(specRows, editable, editingIndex) {
  if (!Array.isArray(specRows) || !specRows.length) return '<p class="idea-plan-note">該当なし</p>';
  return `<ul style="margin:6px 0 6px 20px">${specRows.map((r, i) => {
    const confidenceBadge = `<span class="idea-plan-badge">${esc(normalizeCatalogConfidenceDisplay(r.confidence))}</span>`;
    const photoBadge = r.photoDerived ? `<span class="idea-plan-badge" style="background:var(--primary-light)">&#128247; 写真から採用</span>` : '';

    if (editable && r.photoDerived && editingIndex === i) {
      return `<li style="margin-bottom:4px">
        <input type="text" id="catalog-spec-edit-item-${i}" value="${esc(r.item)}" style="width:140px">
        ：
        <input type="text" id="catalog-spec-edit-value-${i}" value="${esc(r.value)}" style="width:220px">
        ${confidenceBadge} ${photoBadge}
        <button class="btn" onclick="saveCatalogSpecRowEdit(${i})">保存</button>
        <button class="btn" onclick="cancelCatalogSpecRowEdit()">キャンセル</button>
      </li>`;
    }

    const actions = (editable && r.photoDerived)
      ? `<button class="btn" onclick="editCatalogSpecRow(${i})">編集</button> <button class="btn" onclick="deleteCatalogSpecRow(${i})">削除</button>`
      : '';
    return `<li>${esc(r.item)}：${esc(r.value)} ${confidenceBadge} ${photoBadge} ${actions}</li>`;
  }).join('')}</ul>`;
}

// カンマ区切りのキーワード文字列を分割する。区切り文字：半角カンマ・全角カンマ・改行。
// 各語の前後空白を除去し、空文字は除外、重複語は1つにまとめる（表示順は初出順を維持）。
// textarea本体（生の文字列）は変更しない、あくまで表示用の一覧を作るだけの純粋関数
// （catalog-keyword-copy-buttons-report.md参照）。
function parseCatalogKeywordList(rawText) {
  const parts = (rawText || '').split(/[,，\n]/).map(k => k.trim()).filter(Boolean);
  return [...new Set(parts)];
}

// 「キーワード」textareaの現在値から個別コピーボタンを再生成する。textareaのoninputと、
// 生成結果の初回描画の両方から呼ぶ（保存前でも編集内容が即座にボタンへ反映される）。
function renderCatalogKeywordCopyButtons() {
  const container = document.getElementById('catalog-keyword-copy-buttons');
  const textarea = document.getElementById('catalog-gen-keywords');
  if (!container || !textarea) return;
  App._catalogKeywordChipList = parseCatalogKeywordList(textarea.value);
  if (!App._catalogKeywordChipList.length) {
    container.innerHTML = '<p class="idea-plan-note">キーワードが入力されていません。</p>';
    return;
  }
  container.innerHTML = App._catalogKeywordChipList.map((kw, i) =>
    `<button type="button" class="catalog-keyword-chip" id="catalog-keyword-chip-${i}" onclick="copyCatalogKeyword(${i})">${esc(kw)}</button>`
  ).join('');
}

// キーワード1語だけをクリップボードへコピーする。既存のcopyEditorialField()等と同じ
// try/catchパターン（navigator.clipboard.writeText失敗時は手動コピーを促すアラートを出す。
// この既存パターン自体が、このコードベースにおける「コピー用フォールバック処理」）。
// 失敗時はボタン表示を変更しない＝誤った成功表示を出さず、再クリックでの再試行を妨げない。
async function copyCatalogKeyword(index) {
  const kw = (App._catalogKeywordChipList || [])[index];
  if (kw === undefined) return;
  const btn = document.getElementById(`catalog-keyword-chip-${index}`);
  if (!btn) return;
  try {
    await navigator.clipboard.writeText(kw);
    btn.textContent = '✓ コピー済み';
    btn.classList.add('is-copied');
    setTimeout(() => {
      // textarea編集により別のボタンへ再生成されている可能性があるため、
      // 同じキーワードがまだ同じ位置にある場合だけ表示を戻す（他のボタンに影響しない）。
      if ((App._catalogKeywordChipList || [])[index] === kw) {
        btn.textContent = kw;
        btn.classList.remove('is-copied');
      }
    }, 1000);
  } catch (e) {
    alert('コピーに失敗しました。手動でテキストを選択してコピーしてください。');
  }
}

// キーワードの全文コピー専用。汎用のcopyEditorialField()（textareaの生の文字列をそのまま
// コピーするだけ）とは異なり、保存内容・個別コピーボタンと必ず一致させる必要があるため、
// parseCatalogKeywordList()で整理した内容（前後空白・空要素・重複を除いた結果）をコピーする
// （catalog-keyword-edited-save-fix-report.md参照）。
async function copyCatalogKeywordsFull(btnId) {
  const textarea = document.getElementById('catalog-gen-keywords');
  if (!textarea) return;
  const list = parseCatalogKeywordList(textarea.value);
  if (!list.length) return;
  const btn = document.getElementById(btnId);
  const original = btn.innerHTML;
  try {
    await navigator.clipboard.writeText(list.join(','));
    btn.textContent = '✓ コピー済み';
    setTimeout(() => { btn.innerHTML = original; }, 2000);
  } catch (e) {
    alert('コピーに失敗しました。手動でテキストを選択してコピーしてください。');
  }
}

      ${warnings.length ? `<p class="idea-plan-note" style="color:var(--danger)">${warnings.map(w => esc(w)).join('<br>')}</p>` : ''}

  // キーワードの個別コピーボタンを初期描画する（catalog-keyword-copy-buttons-report.md参照）。

async function saveCatalogGenerationResult() {
  const g = App._catalogGeneration;
  if (!g) return;
  const resultArea = document.getElementById('catalog-gen-save-result');

  // 保存時は必ず編集済みのDOMの値を読み取る（App._catalogGenerationのキャッシュ値は使わない）。
  // タイトル（description1Title〜3Title）は今回のスコープでは編集不可のためg.parsedから読む。
  const seoTitle = document.getElementById('catalog-gen-seo-title').value.trim();
  const seoDescription = document.getElementById('catalog-gen-seo-description').value.trim();
  const description1Body = document.getElementById('catalog-gen-desc1').value.trim();
  const description2Body = document.getElementById('catalog-gen-desc2').value.trim();
  const description3Body = document.getElementById('catalog-gen-desc3').value.trim();
  // キーワードも同様にtextareaの現在値を読み取る。個別コピーボタンと全く同じ
  // parseCatalogKeywordList()を通すことで、区切り文字（半角・全角カンマ・改行）・前後空白・
  // 重複の扱いを一致させる（catalog-keyword-edited-save-fix-report.md参照）。
  const keywordsList = parseCatalogKeywordList(document.getElementById('catalog-gen-keywords').value);

  // 保存前検証：上限超過は保存を中断する（自動切り捨ては行わない）
  const seoTitleCheck = validateCatalogSeoTitle(seoTitle);
  const seoDescriptionCheck = validateCatalogSeoDescription(seoDescription);
  if (!seoTitleCheck.ok) {
    resultArea.innerHTML = `<p class="idea-plan-note" style="color:var(--danger)">SEOタイトルが上限（45文字）を超えています（現在${seoTitleCheck.length}文字）。修正してから保存してください。</p>`;
    return;
  }
  if (!seoDescriptionCheck.ok) {
    resultArea.innerHTML = `<p class="idea-plan-note" style="color:var(--danger)">ディスクリプションが上限（85文字）を超えています（現在${seoDescriptionCheck.length}文字）。修正してから保存してください。</p>`;
    return;
  }
  // 75文字未満は保存を止めないが、保存前に確認ダイアログで明確に警告する
  if (seoDescriptionCheck.level === 'warning') {
    const proceed = confirm('ディスクリプションは75文字未満です。推奨範囲は75〜85文字です。このまま保存しますか？');
    if (!proceed) return;
  }

  const btn = document.getElementById('catalog-gen-save-btn');
  btn.disabled = true;
  btn.textContent = '保存中...';

  const payload = {
    specHtml: g.specHtml,
    primaryColor: g.parsed.colorConfidence === 'unavailable' ? '' : (extractHexColor(g.parsed.primaryColor) || ''),
    description1Title: g.parsed.description1Title || '',
    description1Body,
    description2Title: g.parsed.description2Title || '',
    description2Body,
    description3Title: g.parsed.description3Title || '',
    description3Body,
    seoTitle,
    seoDescription,
    keywords: keywordsList.join(','),
    researchNotesOutput: g.parsed.researchNotes || '',
    informationSources: g.parsed.informationSources || '',
    confidenceNotes: g.parsed.confidenceNotes || '',
    specData: g.specRows,
    badgeData: g.badgeList.map(label => ({ label })),
    chipData: g.chipList.map(label => ({ label })),
    unconfirmedItems: g.unconfirmedItems,
    hasUnconfirmedInfo: g.unconfirmedItems.length > 0,
    specId: g.specId,
    manuallyEditedFields: g.manualEditFlags || {},
  };

  const ok = await CatalogStore.saveGenerationResult(g.id, payload);
  btn.disabled = false;
  btn.textContent = '生成結果を保存';

  if (!ok) {
    resultArea.innerHTML = `<p class="idea-plan-note" style="color:var(--danger)">保存に失敗しました。もう一度お試しください。</p>`;
    return;
  }

  // 保存した内容をg.parsedにも反映しておく（再生成時のsyncCatalogGenerationStateFromDomに依らず状態を一致させる）
  g.parsed.seoTitle = seoTitle;
  g.parsed.seoDescription = seoDescription;
  g.parsed.description1Body = description1Body;
  g.parsed.description2Body = description2Body;
  g.parsed.description3Body = description3Body;

  resultArea.innerHTML = `<p class="idea-plan-note" style="color:var(--success)">カタログ原稿を保存しました。</p>`;
}

function showModal(html) {
  // 既に開いているモーダルがあれば先に取り除く。イベント詳細画面のように、開いたまま

  document.querySelector('.modal-overlay')?.remove();
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.onclick = e => { if (e.target === overlay) closeModal(); };
  overlay.innerHTML = `<div class="modal">${html}</div>`;
  document.body.appendChild(overlay);
}

function closeModal() {
  document.querySelector('.modal-overlay')?.remove();
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  // <, >, & 以外に " も変換する。value="${esc(...)}" のような属性値埋め込みで、
  // テキスト中の二重引用符がHTML属性の区切りとして解釈され、
  // 表示内容が途中で壊れて切れてしまう事故を防ぐため（テキスト内容として使う分には
  // &quot; はそのまま " として表示されるため、既存箇所の見た目は変わらない）。
  return d.innerHTML.replace(/"/g, '&quot;');
}

// イベントごとに1件ずつカウントする（二重カウントではなく、イベント単位の「要連絡」数として扱う）。
